  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ---------- Browser-Speicher ----------
    // Der Browser darf jederzeit nein sagen (privates Fenster, voller Speicher) —
    // dann gilt der Standardwert. Alle Zugriffe laufen über diese zwei Zeilen.
    const readLocal = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch { return fallback; }
    };
    const writeLocal = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    };

    // ---------- Sprache (wie in MyKahoot) ----------
    // Umgeschaltet wird nur die Oberfläche, nie der Inhalt: Titel, Paare und die
    // eingebauten Beispiele bleiben, wie sie sind. Die Wahl merkt sich der
    // Browser; `t(key, …args)` liest das Wörterbuch, dynamische Texte sind
    // Funktionen, Texte mit Auszeichnung stehen als JSX drin. Beide Tabellen
    // müssen dieselben Schlüssel haben — ein fehlender bleibt leer.
    const LANGS = [{ id: 'de', name: 'Deutsch' }, { id: 'en', name: 'English' }];
    const LANG_KEY = 'mymemory_lang';
    const loadLang = () => (readLocal(LANG_KEY) === 'en' ? 'en' : 'de');
    // Ein geteilter Link bringt seine Sprache mit (…&l=en): die Klasse sieht
    // damit die Sprache, in der geteilt wurde, ohne selber etwas einstellen zu
    // müssen — umschalten darf sie trotzdem, und das merkt sich ihr Browser.
    const hashParts = () => location.hash.slice(1).split('&');
    // Nur bekannte Sprachen zählen: bei `&l=fr` gilt weiter, was der Browser
    // gemerkt hat, statt stillschweigend auf Deutsch zu fallen.
    const langFromHash = () => {
      const part = hashParts().find((x) => x.startsWith('l=') && LANGS.some((l) => l.id === x.slice(2)));
      return part && part.slice(2);
    };
    let currentLang = langFromHash() || loadLang();
    document.documentElement.lang = currentLang;
    // `t()` liest `currentLang` direkt — React weiss davon nichts. Die App trägt
    // hier einmal ein, wie sie sich neu zeichnen lässt.
    let redrawLang = () => {};

    const code = (x) => <code className="bg-gray-100 px-1 rounded">{x}</code>;

    // Aufgebaut wie der Prompt in MyKahoot: zuoberst ein Block zum Ausfüllen,
    // darunter unverändert die Vorgaben, an denen es sonst scheitert. Zwei
    // Sprachfassungen — die Formatzeichen (F: / A: / ---) bleiben identisch, nur

    // Sprache das Memory selbst hat, gibt der Nutzer im Ausfüll-Block vor.

    const kiPrompt = () => (currentLang === 'en' ? KI_PROMPT_EN : KI_PROMPT_DE);

    // ---------- Dateien parsen ----------
    // Tafelfussball-Format: F: (oder Q:) Vorderseite, A: Rückseite, --- als Trenner.
    const parseFA = (text) => {
      const pairs = [];
      let question = null;
      for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        const m = line.match(/^([FQA]):\s*(.*)$/i);
        if (!m) continue;
        if (m[1].toUpperCase() === 'A') {
          if (question && m[2]) pairs.push({ question, answer: m[2] });
          question = null;
        } else {
          question = m[2];
        }
      }
      return pairs;
    };

    // Altes MyMemory-Format: "# Titel", pro Paar "## Vorderseite" + nächste Zeile.
    const parseMd = (text) => {
      const pairs = [];
      let title = null;
      let question = null;
      for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        if (!line) continue;
        if (line.startsWith('## ')) { question = line.slice(3).trim(); continue; }
        if (line.startsWith('# ')) { if (!title) title = line.slice(2).trim(); continue; }
        if (question) { pairs.push({ question, answer: line }); question = null; }
      }
      return { title, pairs };
    };

    const parseFile = (text, filename) => {
      const fromName = filename.replace(/\.(txt|md)$/i, '').replace(/_/g, ' ').trim();
      if (/^##\s/m.test(text)) {
        const { title, pairs } = parseMd(text);
        return { title: title || fromName, pairs };
      }
      // Steht ein «# Titel» in der Datei, gilt der: nur so überlebt ein Titel den
      // Weg Export → Import unverändert (der Dateiname verliert z.B. «_» und «:»).
      const inFile = text.match(/^#\s+(.+)$/m);
      return { title: (inFile && inFile[1].trim()) || fromName, pairs: parseFA(text) };
    };

    // ---------- Dateien schreiben (Export) ----------
    // Gegenstück zu parseFA: exportiert wird genau die Datei, die der Import
    // wieder versteht. Zuoberst steht der Titel als «# Titel» — den liest der
    // Import zurück, und MyTafelfussball überspringt die Zeile (sie steht vor
    // der ersten «F: »-Zeile und wird dort keiner Aufgabe zugeschlagen).
    const toFile = (memory) =>
      `# ${memory.title}\n\n` +
      memory.pairs.map((p) => `F: ${p.question}\nA: ${p.answer}\n---`).join('\n') + '\n';

    // Dateiname aus dem Titel — was Dateisysteme stört, wird zum Bindestrich.
    // Ordnerpfade Stück für Stück, sonst stünde ein «:» im ZIP-Pfad und Windows
    // packt das Archiv nicht mehr aus.
    const safeName = (title) => title.replace(/[\\/:*?"<>|]+/g, '-').trim() || 'Memory';
    const safeDir = (dir) => dir.split('/').map(safeName).join('/');

    // JSZip wird erst geholt, wenn jemand exportiert: wer nur einem Link folgt,
    // lädt sonst 100 KB für einen Knopf, den er nie drückt.
    let jsZipLoading = null;
    const loadJsZip = () => {
      if (window.JSZip) return Promise.resolve(window.JSZip);
      if (!jsZipLoading) {
        jsZipLoading = new Promise((resolve, reject) => {
          const el = document.createElement('script');
          el.src = 'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js';
          el.onload = () => resolve(window.JSZip);
          el.onerror = () => { jsZipLoading = null; reject(); };
          document.head.appendChild(el);
        });
      }
      return jsZipLoading;
    };

    // Alle Memories in einem ZIP: die Ordner der App werden zu Ordnern im ZIP,
    // jedes Memory zu seiner .txt. Gleiche Dateinamen im selben Ordner bekommen
    // eine Nummer, damit keiner den anderen überschreibt.
    const zipBlob = async (memories, folders) => {
      const JSZipLib = await loadJsZip();
      const zip = new JSZipLib();
      const used = new Set();
      for (const folder of folders) zip.folder(safeDir(folder)); // auch die leeren Ordner
      for (const memory of memories) {
        const base = `${memory.dir ? safeDir(memory.dir) + '/' : ''}${safeName(memory.title)}`;
        let name = `${base}.txt`;
        for (let i = 2; used.has(name); i++) name = `${base} (${i}).txt`;
        used.add(name);
        zip.file(name, toFile(memory));
      }
      return zip.generateAsync({ type: 'blob' });
    };

    const download = (name, data) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    // ---------- Eigene Memories im Browser (localStorage) ----------
    // Gespeichert wird { memories, folders }. Ältere Stände kannten nur
    // `memories` (ohne Ordner) — die landen im Hauptordner.
    const STORAGE_KEY = 'mymemory';

    const loadStore = () => {
      const raw = readLocal(STORAGE_KEY, {}) || {};
      return {
        memories: (raw.memories || []).map((m) => ({ dir: '', ...m })),
        folders: raw.folders || [],
      };
    };
    const saveStore = (store) => writeLocal(STORAGE_KEY, store);

    // ---------- Ordner ----------
    // Ein Ordner ist nur ein Pfad-String ('Mathe/Klasse 8'); '' ist der
    // Hauptordner. Jedes Memory trägt seinen Ordner in `dir`; `folders` hält
    // zusätzlich die leeren Ordner fest, die sonst niemand kennen würde.
    const dirName = (dir) => dir.split('/').pop();
    const parentDir = (dir) => (dir.includes('/') ? dir.slice(0, dir.lastIndexOf('/')) : '');
    const inside = (dir, ancestor) => dir === ancestor || dir.startsWith(ancestor + '/');
    const byTitle = (a, b) => a.title.localeCompare(b.title, 'de');

    // Alle sichtbaren Ordner: die gemerkten plus jeder Pfad, in dem ein Memory liegt
    const allFolders = ({ memories, folders }) => {
      const set = new Set(folders);
      for (const m of memories) {
        for (let d = m.dir || ''; d; d = parentDir(d)) set.add(d);
      }
      return [...set].sort((a, b) => a.localeCompare(b, 'de'));
    };

    // Ordner umhängen/umbenennen: Pfad samt allem, was darin liegt, umschreiben
    const remapDir = (store, from, to) => {
      const move = (d) => (inside(d, from) ? to + d.slice(from.length) : d);
      return {
        memories: store.memories.map((m) => ({ ...m, dir: move(m.dir || '') })),
        folders: [...new Set(store.folders.map(move))],
      };
    };

    // Welche Ordner sind aufgeklappt? Überlebt das Neuladen der Seite.
    const OPEN_KEY = 'mymemory_open_dirs';
    const loadOpen = () => readLocal(OPEN_KEY, []) || [];
    const newId = () =>
      (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

    // ---------- Direktlinks: Memory komprimiert im URL-Fragment ----------
    // Die Daten stehen nach dem # — sie verlassen den Browser nicht einmal
    // Richtung Server. Format: #m=1.<deflate+base64url> bzw. #m=0.<base64url>.
    const b64urlEncode = (bytes) => {
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) {
        bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      }
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };
    const b64urlDecode = (str) =>
      Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));

    const encodeMemory = async (memory) => {
      const json = new TextEncoder().encode(
        JSON.stringify([memory.title, memory.pairs.map((p) => [p.question, p.answer])])
      );
      if (window.CompressionStream) {
        const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        return '1.' + b64urlEncode(new Uint8Array(await new Response(stream).arrayBuffer()));
      }
      return '0.' + b64urlEncode(json);
    };

    const decodeMemory = async (data) => {
      const version = data.slice(0, 1);
      const bytes = b64urlDecode(data.slice(2));
      const json = version === '1'
        ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()
        : new TextDecoder().decode(bytes);
      const [title, rawPairs] = JSON.parse(json);
      return { title, pairs: rawPairs.map(([question, answer]) => ({ question, answer })) };
    };

    const demoById = (id) => DEMOS.find((d) => d.id === id);

    // ---------- Routing über das URL-Fragment ----------
    // Hash-Formen: #demo=<id>, #local=<id>, #m=<daten>, dahinter jeweils die
    // Sprache als &l=<de|en> — gebaut nur via toHash, gelesen nur via getRoute.
    // Jeder Hash, den die App schreibt, trägt die Sprache am Ende; gelesen wird
    // immer nur der erste Teil, der keine Sprache ist. Zusammengesetzt statt per
    // Textersatz — sonst bliebe `#l=en` (Sprache zuvorderst) stehen und die Wahl
    // wäre nach dem Neuladen wieder weg.
    const withLang = (hash) => `${hash}${hash.endsWith('#') ? '' : '&'}l=${currentLang}`;
    const routePart = () => hashParts().find((x) => !x.startsWith('l=')) || '';

    // Sprache umschalten: merken, neu zeichnen, und wenn sie im Link steht, dort
    // mitziehen — sonst käme beim Neuladen die alte zurück. Safari begrenzt
    // replaceState, darum darf das scheitern.
    const changeLang = (id) => {
      currentLang = id;
      document.documentElement.lang = id;
      writeLocal(LANG_KEY, id);
      redrawLang(id);
      if (langFromHash()) {
        try {
          const url = location.pathname + location.search + withLang('#' + routePart());
          history.replaceState(null, '', url);
        } catch {}
      }
    };

    const toHash = (memory) =>
      withLang(demoById(memory.id) ? '#demo=' + memory.id : '#local=' + memory.id);

    const directLink = async (memory) => {
      const base = location.origin + location.pathname;
      return demoById(memory.id)
        ? base + toHash(memory)
        : withLang(`${base}#m=${await encodeMemory(memory)}`);
    };

    // Ein von Hand verunstaltetes Fragment (#new=%zz) darf die App nicht
    // beim ersten Rendern umbringen — dann eben ungedeutet weiterreichen.
    const safeDecode = (raw) => {
      try { return decodeURIComponent(raw); } catch { return raw; }
    };

    const getRoute = () => {
      const hash = routePart(); // die Sprache im Hash geht die Route nichts an
      if (hash.startsWith('m=')) return { type: 'data', data: hash.slice(2) };
      if (hash.startsWith('demo=')) return { type: 'demo', id: hash.slice(5) };
      if (hash.startsWith('local=')) return { type: 'local', id: hash.slice(6) };
      if (hash.startsWith('edit=')) return { type: 'edit', id: hash.slice(5) };
      if (hash.startsWith('new=')) return { type: 'new', dir: safeDecode(hash.slice(4)) };
      return null;
    };

    // Alte Links (?memory=Mathematik/wurzeln) einmalig auf die Demos umschreiben,
    // damit getRoute ein reiner Hash-Parser bleibt
    (() => {
      const legacy = new URLSearchParams(location.search).get('memory');
      if (!legacy) return;
      const demo = DEMOS.find((d) => legacy.split('/').pop().includes(d.id));
      history.replaceState(null, '', location.pathname + (demo ? '#demo=' + demo.id : ''));
    })();

    const shuffleArray = (array) => {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    };

    // ---------- LaTeX/Text gemischt rendern ----------
    const MathRenderer = ({ content }) => {
      const ref = useRef(null);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        el.innerHTML = '';
        for (const part of content.split(/(\$[^$]+\$)/g)) {
          if (!part) continue;
          if (part.startsWith('$') && part.endsWith('$') && window.katex) {
            const span = document.createElement('span');
            try {
              window.katex.render(part.slice(1, -1), span, { throwOnError: false, displayMode: false });
            } catch (e) {
              span.textContent = part;
            }
            el.appendChild(span);
          } else {
            el.appendChild(document.createTextNode(part));
          }
        }
      }, [content]);

      return <span ref={ref} className="break-words [overflow-wrap:anywhere]"></span>;
    };

    // ---------- Text, der sich auf die Kachel einpasst ----------
    // Lange Einträge sollen möglich sein, ohne aus der Karte zu laufen: die
    // Schrift geht stufenweise runter, bis der Text in die Kachel passt. Die
    // oberste Stufe gilt für kurze Einträge (die dürfen gross sein), die unterste
    // ist die Grenze — darunter wird es auch am Beamer nicht mehr lesbar.
    // Handy-Kacheln sind viel kleiner, deshalb dort eine eigene Leiter.
    const FONT_STEPS = [24, 22, 20, 18, 16, 14];
    const FONT_STEPS_SM = [18, 16, 14, 12, 11, 10];
    const SMALL_SCREEN = window.matchMedia('(max-width: 640px)');

    // Gemessen wird nicht jede Karte für sich, sondern alle Inhalte zusammen:
    // der längste bestimmt die Stufe für das ganze Spielfeld. So sind alle
    // Kacheln gleich beschriftet und die Schrift springt beim Aufdecken nicht.
    // `boxRef` zeigt auf eine echte Kachel (die Masse), gemessen wird in einer
    // unsichtbaren Kopie mit derselben Schrift — sonst bräche es anders um.
    //
    // Ausnahme sind einzelne Einträge, die auf KEINER Stufe passen: eine Formel
    // bricht nicht um, `$\sqrt{a^2-2ab+b^2}$` bleibt auch bei 14 px zu breit.
    // Solche Ausreisser zählen bei der Stufenwahl nicht mit — sie würden das
    // ganze Spielfeld nach unten ziehen, ohne selber zu passen — und bekommen
    // stattdessen allein eine kleinere Schrift. Unter MIN_PX hört es auf: was
    // dann noch nicht passt, ist schlicht zu lang für eine Karte.
    const MIN_PX = 8;

    // Zurück kommt eine Map Inhalt → px (Map statt Objekt: Kartentexte wie
    // «constructor» sind gültige Schlüssel, keine geerbten Eigenschaften).
    const useSharedFontSize = (contents, boxRef) => {
      const probeRef = useRef(null);
      const [sizes, setSizes] = useState(() => new Map());
      const key = contents.join('\u0000');

      // Passives useEffect (kein Layout-Effekt): so ist der KaTeX-Inhalt der
      // MathRenderer-Kinder schon da, wenn hier gemessen wird.
      useEffect(() => {
        const measure = () => {
          const box = boxRef.current, probe = probeRef.current;
          if (!box || !probe) return;
          const cs = getComputedStyle(box);
          const availW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
          const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
          if (availW <= 0 || availH <= 0) return;

          const els = Array.from(probe.children);
          els.forEach(el => { el.style.maxWidth = `${availW}px`; });
          const steps = SMALL_SCREEN.matches ? FONT_STEPS_SM : FONT_STEPS;
          const setStep = (step) => els.forEach(el => { el.style.fontSize = `${step}px`; });
          const fits = (el) => el.scrollWidth <= availW && el.scrollHeight <= availH;

          // Einmal die Leiter hinunter und dabei merken, wer auf welcher Stufe
          // noch übersteht. Wer nicht einmal zuunterst passt, ist ein Ausreisser
          // und redet bei der Stufenwahl nicht mit. Passt gar keiner, sind es
          // keine Ausreisser, sondern lauter lange Einträge — dann gilt wieder
          // für alle dieselbe unterste Stufe.
          const unfitAt = [];
          for (const step of steps) {
            setStep(step);
            unfitAt.push(els.filter(el => !fits(el)));
            if (!unfitAt[unfitAt.length - 1].length) break;
          }
          const bottom = unfitAt[unfitAt.length - 1];
          const stubborn = new Set(bottom.length < els.length ? bottom : []);
          const level = unfitAt.findIndex(unfit => unfit.every(el => stubborn.has(el)));
          const chosen = steps[level < 0 ? steps.length - 1 : level];

          // Für jeden Ausreisser die grösste Schrift suchen, bei der er ganz auf
          // die Kachel passt. Halbierend statt gerechnet: umbrechender Text wird
          // mit halber Schrift nicht halb so hoch, sondern viertelt sich (halb so
          // breite Zeilen UND halb so viele) — eine Formel dagegen schrumpft
          // linear. Gemessen schlägt gerechnet.
          const next = new Map(contents.map(content => [content, chosen]));
          els.forEach((el, i) => {
            if (!stubborn.has(el)) return;
            let lo = MIN_PX, hi = chosen; // lo passt (oder ist die Untergrenze), hi passt nicht
            while (hi - lo > 1) {
              const mid = Math.floor((lo + hi) / 2);
              el.style.fontSize = `${mid}px`;
              if (fits(el)) lo = mid; else hi = mid;
            }
            next.set(contents[i], lo);
          });
          setSizes((prev) => (
            prev.size === next.size && [...next].every(([c, px]) => prev.get(c) === px) ? prev : next
          ));
        };
        // Beim Ziehen am Fensterrand kämen sonst 60 Messungen pro Sekunde —
        // gebündelt bleibt eine pro Bild übrig.
        let frame = 0;
        const refit = () => {
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(measure);
        };

        measure();
        // Die KaTeX-Schriften kommen nachgeladen und ändern die Masse
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
        // Tailwind kommt vom CDN: beim ersten Messen steht die Kachel womöglich
        // noch ohne ihr Seitenverhältnis da und wäre viel zu flach. Der Beobachter
        // misst deshalb jedes Mal neu, wenn die Kachel ihre Grösse ändert — das
        // deckt auch Fenstergrösse und Handy-Drehung ab.
        const box = boxRef.current;
        if (!window.ResizeObserver || !box) { // ältere Geräte: wenigstens beim Drehen neu messen
          window.addEventListener('resize', refit);
          return () => { cancelAnimationFrame(frame); window.removeEventListener('resize', refit); };
        }
        const observer = new ResizeObserver(refit);
        observer.observe(box);
        return () => { cancelAnimationFrame(frame); observer.disconnect(); };
      }, [key]);

      // Die Kopie hängt an den Inhalten, nicht am Spielstand: sonst würde bei
      // jedem aufgedeckten Kärtchen die ganze KaTeX-Arbeit noch einmal anfallen.
      const probe = useMemo(() => (
        <div
          ref={probeRef} aria-hidden="true" className="font-bold text-center"
          style={{ position: 'fixed', left: 0, top: '-9999px', visibility: 'hidden' }}
        >
          {contents.map((content, i) => (
            <div key={i} className="leading-tight"><MathRenderer content={content} /></div>
          ))}
        </div>
      ), [key]);
      // Der Aufrufer fragt nur nach dem Inhalt; wie die Grösse zustande kommt,
      // bleibt hier drin. Vor der ersten Messung gilt die oberste Stufe.
      const sizeFor = (content) => sizes.get(content) || FONT_STEPS[0];
      return [sizeFor, probe];
    };

    const FitText = ({ content, size }) => (
      <div className="max-w-full leading-tight" style={{ fontSize: `${size}px` }}>
        <MathRenderer content={content} />
      </div>
    );

    // ---------- Gemeinsame Bausteine ----------
    const SCREEN = 'min-h-screen bg-gradient-to-br from-red-50 to-blue-50';
    const BTN_PRIMARY = 'bg-gradient-to-r from-red-500 to-blue-500 text-white rounded-lg font-semibold hover:from-red-600 hover:to-blue-600 transition-all shadow-lg';
    const BTN_SECONDARY = 'bg-gray-100 text-gray-600 rounded-lg font-semibold hover:bg-gray-200 transition-all';
    const CARD = 'bg-white rounded-lg shadow-lg';
    const LABEL = 'text-xs uppercase tracking-wide text-gray-400';

    const Modal = ({ children, onClose }) => (
      <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
        <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl" onClick={(e) => e.stopPropagation()}>
          {children}
        </div>
      </div>
    );

    // prompt()/confirm() des Browsers sehen fremd aus und frieren die Seite ein —
    // dieselben zwei Fragen als Modal, gesteuert über einen `dialog`-Zustand:
    // { kind: 'prompt', label, preset, onOk } bzw. { kind: 'confirm', text, onYes }.
    const AskModal = ({ dialog, onClose }) => {
      const [value, setValue] = useState(dialog.preset || '');
      const isPrompt = dialog.kind === 'prompt';
      const submit = () => {
        if (isPrompt) { if (!value.trim()) return; dialog.onOk(value.trim()); }
        else dialog.onYes();
        onClose();
      };
      return (
        <Modal onClose={onClose}>
          <p className="text-gray-700 mb-4">{isPrompt ? dialog.label : dialog.text}</p>
          {isPrompt && (
            <input
              autoFocus type="text" value={value}
              onChange={(e) => setValue(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
              className="w-full mb-4 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-400"
            />
          )}
          <div className="flex gap-3">
            <button onClick={onClose} className={`flex-1 px-4 py-2 ${BTN_SECONDARY}`}>
              {t('cancel')}
            </button>
            <button onClick={submit} className={`flex-1 ${BTN_PRIMARY} px-4 py-2`}>
              {dialog.ok || 'OK'}
            </button>
          </div>
        </Modal>
      );
    };

    const IconButton = ({ onClick, title, hover = 'hover:bg-blue-50', extra = '', children }) => (
      <button onClick={onClick} title={title}
        className={`px-3 py-3 bg-white rounded-lg shadow hover:shadow-md transition-all text-gray-500 ${hover} ${extra}`}>
        {children}
      </button>
    );

    // ---------- Symbole ----------
    // Einfache Strichzeichnungen statt Emoji: die kommen je nach System als
    // bunte 3D-Bildchen. Alle teilen sich denselben Rahmen, damit sie in einer
    // Knopfreihe gleich gross sind.
    const Icon = ({ children }) => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {children}
      </svg>
    );

    const LinkIcon = () => (
      <Icon>
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </Icon>
    );
    const QrIcon = () => (
      <Icon>
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
        <path d="M14 14.5h3.5V18H14z" />
        <path d="M18.5 18.5H21V21h-2.5z" />
      </Icon>
    );
    const PenIcon = () => (
      <Icon><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z" /></Icon>
    );
    // Schieberegler statt Zahnrad: als Strichzeichnung besser zu erkennen
    const SettingsIcon = () => (
      <Icon>
        <path d="M4 8h10M18 8h2M4 16h4M12 16h8" />
        <circle cx="16" cy="8" r="2" />
        <circle cx="10" cy="16" r="2" />
      </Icon>
    );
    const InboxIcon = () => (
      <Icon>
        <path d="M12 3v9" />
        <path d="M8 8.5 12 12.5l4-4" />
        <path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" />
      </Icon>
    );
    const DownloadIcon = () => (
      <Icon>
        <path d="M12 3v12" />
        <path d="M7.5 10.5 12 15l4.5-4.5" />
        <path d="M4 20h16" />
      </Icon>
    );
    const PlusIcon = () => (
      <Icon><path d="M12 5v14" /><path d="M5 12h14" /></Icon>
    );
    const FolderIcon = () => (
      <Icon><path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" /></Icon>
    );
    const TrashIcon = () => (
      <Icon>
        <path d="M4 7h16" />
        <path d="M9 7V5h6v2" />
        <path d="M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12" />
      </Icon>
    );

    // ---------- QR-Code-Dialog ----------

    const QrModal = ({ title, url, onClose, onCopy }) => {
      const svg = useMemo(() => {
        try {
          const qr = window.qrcode(0, 'M');
          qr.addData(url);
          qr.make();
          return qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
        } catch (e) {
          return null; // zu viele Daten für einen QR-Code
        }
      }, [url]);

      return (
        <Modal onClose={onClose}>
          <h2 className="text-xl font-bold text-center mb-4 text-gray-800">{title}</h2>
          {svg ? (
            <div className="flex justify-center mb-4 [&>svg]:w-56 [&>svg]:h-56" dangerouslySetInnerHTML={{ __html: svg }} />
          ) : (
            <div className="text-center text-red-600 mb-4">
              {t('qrTooBig')}
            </div>
          )}
          <div className="text-xs text-gray-400 break-all max-h-16 overflow-y-auto mb-4">{url}</div>
          <div className="flex gap-2">
            <button onClick={onCopy} className={`flex-1 ${BTN_PRIMARY} px-4 py-2`}>
              {t('copyLinkBtn')}
            </button>
            <button onClick={onClose} className={`px-4 py-2 ${BTN_SECONDARY}`}>
              {t('close')}
            </button>
          </div>
        </Modal>
      );
    };

    // ---------- Einstellungen ----------
    // Knopf und Kästchen kommen getrennt zurück, weil sie an verschiedenen
    // Stellen der Seite stehen (Knopf im Kopf, Kästchen darunter). Es gibt sie
    // auf der Auswahlseite und im Spiel: wer über einen Link hereinkommt, sieht
    // die Übersicht nie und käme sonst nicht an die Sprache.
    const useSettings = () => {
      const [open, setOpen] = useState(false);
      const button = (
        <IconButton onClick={() => setOpen((v) => !v)} title={t('settings')}><SettingsIcon /></IconButton>
      );
      const panel = open && (
        <div className={`${CARD} p-6 mb-8`}>
          <h2 className="text-lg font-semibold text-gray-700 mb-3">{t('settings')}</h2>
          <div className="rounded-lg border border-gray-200 p-4">
            <div className={`${LABEL} mb-2`}>{t('language')}</div>
            <div className="flex gap-2">
              {LANGS.map((entry) => (
                <button
                  key={entry.id} onClick={() => changeLang(entry.id)}
                  className={`px-4 py-2 ${entry.id === currentLang ? BTN_PRIMARY : BTN_SECONDARY}`}
                >
                  {entry.name}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
      return [button, panel];
    };

    // ---------- Auswahlseite ----------
    const Selection = ({ own, folders, onOpen, onEdit, onNew, onImport, onDelete, folderApi }) => {
      const [toast, setToast] = useState(null);
      const [settingsButton, settingsPanel] = useSettings();
      const [qr, setQr] = useState(null); // { title, url }
      const [createOpen, setCreateOpen] = useState(false);
      const [openDirs, setOpenDirs] = useState(loadOpen);
      const [dropDir, setDropDir] = useState(null); // Ordner, über dem gerade etwas schwebt
      const dragged = useRef(null); // { kind: 'memory'|'dir', id, dir? }
      const [dialog, setDialog] = useState(null); // s. AskModal
      const [pasted, setPasted] = useState('');
      const [pastedTitle, setPastedTitle] = useState('');
      const fileInput = useRef(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

      const copyText = (text, msg) =>
        navigator.clipboard.writeText(text).then(() => showToast(msg));

      const copyLink = async (memory) => copyText(await directLink(memory), t('linkCopied'));
      const showQr = async (memory) => setQr({ title: memory.title, url: await directLink(memory) });

      // Ein Memory als .txt herunterladen — dieselbe Datei, die der Import frisst
      const exportOne = (memory) => {
        download(`${safeName(memory.title)}.txt`, toFile(memory));
        showToast(t('downloadedOne', memory.title));
      };

      // Alle eigenen Memories als ZIP (s. zipBlob)
      const exportAll = async () => {
        if (!own.length) { showToast(t('noOwnMemories')); return; }
        try {
          download('MyMemory.zip', await zipBlob(own, folders));
        } catch {
          showToast(t('zipFailed'));
          return;
        }
        showToast(t('downloadedAll', own.length));
      };

      // Einziger Weg von Text zu Memory — Datei und Einfügefeld teilen ihn sich
      const addImported = (text, name, dir, complain) => {
        const { title, pairs } = parseFile(text, name);
        if (!pairs.length) { showToast(complain); return false; }
        onImport({ id: newId(), title, pairs, dir });
        showToast(t('imported', title, pairs.length));
        return true;
      };

      const importFiles = (fileList, dir = '') => {
        for (const file of fileList) {
          file.text().then((text) =>
            addImported(text, file.name, dir, t('noPairsInFile', file.name)));
        }
      };

      const importPasted = () => {
        const done = addImported(pasted, pastedTitle.trim() || 'Memory', '', t('noPairsFound'));
        if (!done) return;
        setPasted('');
        setPastedTitle('');
      };

      // Dateien dürfen aufs ganze Fenster gezogen werden (wie bei MyTafelfussball).
      // Nur einmal registrieren: onImport aktualisiert per Funktions-Update,
      // die Closure kann also nicht veralten.
      useEffect(() => {
        const over = (e) => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); };
        const drop = (e) => {
          if (!e.dataTransfer.files.length) return;
          e.preventDefault();
          importFiles(e.dataTransfer.files);
        };
        window.addEventListener('dragover', over);
        window.addEventListener('drop', drop);
        return () => {
          window.removeEventListener('dragover', over);
          window.removeEventListener('drop', drop);
        };
      }, []);

      // ---- Ordner auf-/zuklappen (gemerkt) ----
      const rememberOpen = (dirs) => {
        setOpenDirs(dirs);
        writeLocal(OPEN_KEY, dirs);
      };
      const toggleDir = (dir) =>
        rememberOpen(openDirs.includes(dir) ? openDirs.filter((d) => d !== dir) : [...openDirs, dir]);

      // ---- Umhängen per Drag&Drop ----
      // Der Zustand steckt in einer Ref statt im dataTransfer: dessen Inhalt ist
      // beim dragover nicht lesbar, wir brauchen ihn aber genau dort (Zielprüfung).
      // Gezogen werden Memories und Ordner (samt Inhalt), Ziel ist jeder Ordner
      // oder die Liste selbst (= Hauptordner).
      const canDrop = (dir) => {
        const d = dragged.current;
        if (!d) return false;
        if (d.kind === 'memory') return d.dir !== dir;
        return !inside(dir, d.id) && parentDir(d.id) !== dir; // nicht in sich selbst, nicht dorthin, wo er schon liegt
      };

      const dragProps = (item) => ({
        draggable: true,
        onDragStart: (e) => { dragged.current = item; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', item.id); },
        onDragEnd: () => { dragged.current = null; setDropDir(null); },
      });

      // Immer stopPropagation: Der Ordner unter dem Zeiger entscheidet allein —
      // auch wenn er ablehnt. Liesse man das Ereignis weiterlaufen, übernähme es
      // der Elternordner: ein Memory zurück auf seinen eigenen Ordner gelegt
      // landete eine Ebene höher, ein Ordner auf sich selbst gar im Hauptordner.
      const dropProps = (dir) => ({
        onDragOver: (e) => {
          e.stopPropagation();
          // Datei von aussen: landet in genau diesem Ordner (s. onDrop)
          if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); setDropDir(dir); return; }
          if (!canDrop(dir)) { setDropDir(null); return; } // kein preventDefault = hier wird nichts abgelegt
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          setDropDir(dir);
        },
        onDragLeave: (e) => {
          if (!e.currentTarget.contains(e.relatedTarget)) setDropDir((cur) => (cur === dir ? null : cur));
        },
        onDrop: (e) => {
          e.stopPropagation(); // sonst importiert der Fenster-Listener die Datei ein zweites Mal
          // Datei auf einen Ordner gezogen = dort importieren
          if (e.dataTransfer.files.length) {
            e.preventDefault();
            setDropDir(null);
            importFiles(e.dataTransfer.files, dir);
            return;
          }
          const item = dragged.current;
          if (!item || !canDrop(dir)) return;
          e.preventDefault();
          dragged.current = null;
          setDropDir(null);
          // Der Zielordner klappt bewusst NICHT auf: wer etwas wegräumt, will es
          // weggeräumt haben. Beim Ordner wandert der gemerkte Zustand mit.
          if (item.kind === 'memory') folderApi.moveMemory(item.id, dir);
          else {
            const target = folderApi.moveFolder(item.id, dir);
            rememberOpen(openDirs.map((d) => (inside(d, item.id) ? target + d.slice(item.id.length) : d)));
          }
        },
      });

      const newFolder = (parent) => setDialog({
        kind: 'prompt', ok: t('create'),
        label: parent ? t('askSubfolder', dirName(parent)) : t('askFolder'),
        onOk: (name) => {
          const path = folderApi.makeFolder(parent, name);
          if (path) rememberOpen([...new Set([...openDirs, parent, path].filter(Boolean))]);
        },
      });

      const renameFolder = (dir) => setDialog({
        kind: 'prompt', ok: t('rename'), label: t('askRename'), preset: dirName(dir),
        onOk: (name) => {
          const target = folderApi.renameFolder(dir, name);
          if (target) rememberOpen(openDirs.map((d) => (inside(d, dir) ? target + d.slice(dir.length) : d)));
        },
      });

      // Gelöscht wird nur ein leerer Ordner — sonst wäre mit einem Klick eine
      // ganze Sammlung weg (und der Papierkorb ist hier der localStorage).
      const dropFolder = (dir) => {
        if (own.some((m) => inside(m.dir || '', dir)) || folders.some((f) => f !== dir && inside(f, dir))) {
          showToast(t('folderNotEmpty'));
          return;
        }
        setDialog({
          kind: 'confirm', ok: t('del'), text: t('confirmDeleteFolder', dirName(dir)),
          onYes: () => {
            folderApi.removeFolder(dir);
            rememberOpen(openDirs.filter((d) => d !== dir));
          },
        });
      };

      const row = (memory, deletable) => (
        <div
          key={memory.id}
          className="flex items-center gap-2 mb-2"
          {...(deletable ? dragProps({ kind: 'memory', id: memory.id, dir: memory.dir || '' }) : {})}
        >
          <button
            onClick={() => onOpen(memory)}
            className="flex-1 min-w-0 truncate text-left px-4 py-3 bg-white rounded-lg shadow hover:shadow-md hover:bg-red-50 transition-all font-semibold text-gray-800"
          >
            {memory.title}
            <span className="ml-2 text-sm font-normal text-gray-400">{t('nPairs', memory.pairs.length)}</span>
          </button>
          <IconButton onClick={() => exportOne(memory)} title={t('exportOne')} extra="hidden sm:block"><DownloadIcon /></IconButton>
          <IconButton onClick={() => copyLink(memory)} title={t('copyLink')}><LinkIcon /></IconButton>
          <IconButton onClick={() => showQr(memory)} title={t('showQr')}><QrIcon /></IconButton>
          {deletable && (
            <IconButton onClick={() => onEdit(memory)} title={t('edit')}><PenIcon /></IconButton>
          )}
          {deletable && (
            <IconButton
              onClick={() => setDialog({
                kind: 'confirm', ok: t('del'), text: t('confirmDeleteMemory', memory.title),
                onYes: () => onDelete(memory.id),
              })}
              title={t('del')} hover="hover:bg-red-50"
            ><TrashIcon /></IconButton>
          )}
        </div>
      );

      // Ein Ordner samt Inhalt: erst die Unterordner, dann seine Memories.
      // Gepackt wird an der Zeile, abgelegt auf der ganzen Kachel — ein Drop
      // irgendwo im Ordner (auch auf einem seiner Memories) meint diesen Ordner.
      const folderBox = (dir) => {
        const isOpen = openDirs.includes(dir);
        return (
          <div
            key={dir}
            {...dropProps(dir)}
            className={`mb-2 rounded-lg border-2 transition-colors ${dropDir === dir ? 'border-blue-400 bg-blue-50/60' : 'border-transparent'}`}
          >
            <div
              {...dragProps({ kind: 'dir', id: dir })}
              onClick={() => toggleDir(dir)}
              className="flex items-center gap-2 px-3 py-2 bg-white rounded-lg shadow hover:shadow-md cursor-pointer select-none"
            >
              <span className="text-gray-400 w-3">{isOpen ? '▾' : '▸'}</span>
              <span className="shrink-0 text-gray-400"><FolderIcon /></span>
              <span className="flex-1 min-w-0 truncate font-semibold text-gray-700">{dirName(dir)}</span>
              <IconButton onClick={(e) => { e.stopPropagation(); onNew(dir); }} title={t('newMemoryHere')}><PlusIcon /></IconButton>
              <IconButton onClick={(e) => { e.stopPropagation(); newFolder(dir); }} title={t('newSubfolder')}><FolderIcon /></IconButton>
              <IconButton onClick={(e) => { e.stopPropagation(); renameFolder(dir); }} title={t('renameFolder')}><PenIcon /></IconButton>
              <IconButton onClick={(e) => { e.stopPropagation(); dropFolder(dir); }} title={t('deleteFolder')} hover="hover:bg-red-50"><TrashIcon /></IconButton>
            </div>
            {isOpen && <div className="ml-4 mt-2">{treeOf(dir)}</div>}
          </div>
        );
      };

      const treeOf = (dir) => (
        <>
          {folders.filter((f) => parentDir(f) === dir).map(folderBox)}
          {own.filter((m) => (m.dir || '') === dir).map((m) => row(m, true))}
        </>
      );

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className="max-w-2xl mx-auto">
            <div className="relative mb-2">
              <h1 className="text-4xl font-bold text-center text-gray-800">MyMemory</h1>
              <div className="absolute right-0 top-1/2 -translate-y-1/2">{settingsButton}</div>
            </div>
            <p className="text-center text-gray-500 mb-8">{t('subtitle')}</p>

            {settingsPanel}

            <div className={`${CARD} mb-8`}>
              <button
                onClick={() => setCreateOpen((v) => !v)}
                className="w-full flex items-center justify-between gap-2 px-6 py-4 text-left"
              >
                <h2 className="text-lg font-semibold text-gray-700">{t('createTitle')}</h2>
                <span className={`text-gray-400 transition-transform ${createOpen ? 'rotate-90' : ''}`}>▶</span>
              </button>
              {createOpen && (
                <div className="px-6 pb-6">
                  <ol className="list-decimal list-inside text-sm text-gray-600 space-y-1 mb-4">
                    {t('steps')}
                  </ol>
                  <button
                    onClick={() => copyText(kiPrompt(), t('promptCopied'))}
                    className={`w-full ${BTN_PRIMARY} px-4 py-2 mb-6`}
                  >
                    {t('copyPrompt')}
                  </button>
                  <div
                    onClick={() => fileInput.current.click()}
                    className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center text-gray-500 cursor-pointer hover:border-blue-400 hover:text-gray-700 hover:bg-blue-50 transition-all"
                  >
                    <span className="flex items-center justify-center gap-2 font-bold"><InboxIcon /> {t('dropTitle')}</span>
                    <span className="block text-sm text-gray-400">{t('dropHint')}</span>
                  </div>
                  <input
                    ref={fileInput} type="file" accept=".txt,.md" multiple className="hidden"
                    onChange={(e) => { importFiles(e.target.files); e.target.value = ''; }}
                  />
                  <div className={`flex items-center gap-3 my-4 ${LABEL}`}>
                    <span className="flex-1 h-px bg-gray-200" /> {t('orPaste')} <span className="flex-1 h-px bg-gray-200" />
                  </div>
                  <input
                    type="text" value={pastedTitle} onChange={(e) => setPastedTitle(e.target.value)}
                    placeholder={t('pastedTitlePh')}
                    className="w-full mb-2 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-400"
                  />
                  <textarea
                    value={pasted} onChange={(e) => setPasted(e.target.value)} rows={5}
                    placeholder={t('pastePh')}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:border-blue-400"
                  />
                  <button
                    onClick={importPasted}
                    disabled={!pasted.trim()}
                    className={`w-full mt-2 px-4 py-2 rounded-lg font-semibold transition-all ${pasted.trim() ? 'bg-gray-800 text-white hover:bg-gray-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                  >
                    {t('importText')}
                  </button>
                  <p className="text-xs text-gray-400 mt-3">{t('importHint')}</p>
                </div>
              )}
            </div>

            <div className="mb-8">
              <div className="flex items-center gap-2 mb-3">
                <h2 className="text-lg font-semibold text-gray-600 flex-1">{t('myMemories')}</h2>
                <IconButton onClick={() => onNew('')} title={t('newMemory')}><PlusIcon /></IconButton>
                <IconButton onClick={() => newFolder('')} title={t('newFolder')}><FolderIcon /></IconButton>
                <IconButton onClick={exportAll} title={t('exportAll')}><DownloadIcon /></IconButton>
              </div>
              {/* Die Liste selbst ist der Hauptordner: was hierher gezogen wird, liegt in keinem Ordner */}
              <div
                {...dropProps('')}
                className={`min-h-[3rem] rounded-lg border-2 transition-colors ${dropDir === '' ? 'border-blue-400 bg-blue-50/60' : 'border-transparent'}`}
              >
                {own.length || folders.length ? treeOf('') : (
                  <p className="text-sm text-gray-400 px-1 py-3">{t('emptyList')}</p>
                )}
              </div>
              {own.length > 0 && (
                <p className="text-xs text-gray-400 mt-1">{t('storedHint')}</p>
              )}
            </div>

            <div className="mb-8">
              <h2 className="text-lg font-semibold text-gray-600 mb-3">{t('examples')}</h2>
              {DEMOS.map((m) => row(m, false))}
            </div>
          </div>

          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
          {qr && (
            <QrModal
              title={qr.title} url={qr.url}
              onClose={() => setQr(null)}
              onCopy={() => copyText(qr.url, t('linkCopied'))}
            />
          )}
          {toast && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg z-50">
              {toast}
            </div>
          )}
        </div>
      );
    };

    // ---------- Editor: Titel, Ordner und Paare bearbeiten ----------
    // Gearbeitet wird auf einer Kopie; erst «Speichern» schreibt sie zurück.
    const MemoryEditor = ({ memory, memories, folders, onSave, onCancel, onNewFolder }) => {
      const [title, setTitle] = useState(memory.title);
      const [dir, setDir] = useState(memory.dir || '');
      const [pairs, setPairs] = useState(() =>
        memory.pairs.length ? memory.pairs.map((p) => ({ ...p })) : [{ question: '', answer: '' }]);
      const [error, setError] = useState('');
      const [dialog, setDialog] = useState(null); // s. AskModal

      const snapshot = JSON.stringify({ title, dir, pairs });
      const [openSnapshot] = useState(snapshot); // Stand beim Öffnen — für die Rückfrage beim Abbrechen

      const setPair = (i, key, value) =>
        setPairs((ps) => ps.map((p, j) => (j === i ? { ...p, [key]: value } : p)));
      const addPair = () => setPairs((ps) => [...ps, { question: '', answer: '' }]);
      const removePair = (i) => setPairs((ps) => ps.filter((_, j) => j !== i));
      const movePair = (i, delta) => setPairs((ps) => {
        const j = i + delta;
        if (j < 0 || j >= ps.length) return ps;
        const next = [...ps];
        [next[i], next[j]] = [next[j], next[i]];
        return next;
      });

      // Jede Rückseite darf nur zu genau einer Vorderseite passen — sonst ist im
      // Spiel nicht entscheidbar, welches Paar gemeint war.
      const answers = pairs.map((p) => p.answer.trim()).filter(Boolean);
      const duplicate = answers.find((a, i) => answers.indexOf(a) !== i);

      const save = () => {
        const clean = pairs
          .map((p) => ({ question: p.question.trim(), answer: p.answer.trim() }))
          .filter((p) => p.question || p.answer);
        const name = title.trim();
        if (!name) return setError(t('errTitle'));
        // Titel sind der Schlüssel beim Import (gleicher Titel = neue Version).
        // Zwei gleichnamige Memories würden dort beide ersetzt — gar nicht erst
        // entstehen lassen.
        if (memories.some((m) => m.id !== memory.id && m.title === name)) {
          return setError(t('errTitleTaken'));
        }
        if (!clean.length) return setError(t('errNoPair'));
        if (clean.some((p) => !p.question || !p.answer)) return setError(t('errHalfPair'));
        onSave({ ...memory, title: name, dir, pairs: clean });
      };

      const cancel = () => {
        // Ungespeicherte Arbeit nicht wortlos wegwerfen
        if (snapshot === openSnapshot) return onCancel();
        setDialog({ kind: 'confirm', ok: t('discard'), text: t('confirmDiscard'), onYes: onCancel });
      };

      const newFolder = () => setDialog({
        kind: 'prompt', ok: t('create'),
        label: dir ? t('askSubfolder', dirName(dir)) : t('askFolder'),
        onOk: (name) => { const path = onNewFolder(dir, name); if (path) setDir(path); },
      });

      // Vorschau nur, wo sie etwas zeigt, das im Feld nicht steht (LaTeX)
      const preview = (text) => text.includes('$') && (
        <div className="mt-1 text-sm text-gray-500"><MathRenderer content={text} /></div>
      );

      const field = (i, key, label, placeholder) => (
        <label className="block">
          <span className={LABEL}>{label}</span>
          <input
            type="text" value={pairs[i][key]} placeholder={placeholder}
            onChange={(e) => setPair(i, key, e.target.value)}
            className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-400"
          />
          {preview(pairs[i][key])}
        </label>
      );

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className="max-w-2xl mx-auto">
            <h1 className="text-2xl font-bold text-gray-800 mb-6">
              {memory.id ? t('editMemory') : t('newMemory')}
            </h1>

            <div className={`${CARD} p-6 mb-6`}>
              <label className="block mb-4">
                <span className={LABEL}>{t('titleLabel')}</span>
                <input
                  type="text" value={title} onChange={(e) => setTitle(e.target.value)}
                  placeholder={t('titlePh')}
                  className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-400"
                />
              </label>
              <span className={LABEL}>{t('folderLabel')}</span>
              <div className="flex gap-2 mt-1">
                <select
                  value={dir} onChange={(e) => setDir(e.target.value)}
                  className="flex-1 min-w-0 px-3 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:border-blue-400"
                >
                  <option value="">{t('rootFolder')}</option>
                  {folders.map((f) => (
                    <option key={f} value={f}>{'\u00a0\u00a0'.repeat(f.split('/').length - 1) + dirName(f)}</option>
                  ))}
                </select>
                <IconButton onClick={newFolder} title={t('makeFolder')}><FolderIcon /></IconButton>
              </div>
            </div>

            {pairs.map((pair, i) => (
              <div key={i} className="bg-white rounded-lg shadow p-4 mb-3">
                <div className="flex items-center gap-2 mb-2">
                  <span className="flex-1 text-sm font-semibold text-gray-400">{t('pairN', i + 1)}</span>
                  <IconButton onClick={() => movePair(i, -1)} title={t('moveUp')}>↑</IconButton>
                  <IconButton onClick={() => movePair(i, 1)} title={t('moveDown')}>↓</IconButton>
                  <IconButton onClick={() => removePair(i)} title={t('deletePair')} hover="hover:bg-red-50"><TrashIcon /></IconButton>
                </div>
                <div className="grid sm:grid-cols-2 gap-3">
                  {field(i, 'question', t('front'), t('frontPh'))}
                  {field(i, 'answer', t('back'), t('backPh'))}
                </div>
              </div>
            ))}

            <button onClick={addPair} className="w-full px-4 py-2 mb-4 bg-white rounded-lg shadow hover:shadow-md font-semibold text-gray-600 flex items-center justify-center gap-2">
              <PlusIcon /> {t('addPair')}
            </button>

            {duplicate && (
              <p className="text-sm text-amber-600 mb-2">{t('dupAnswer', duplicate)}</p>
            )}
            {error && <p className="text-sm text-red-600 mb-2">{error}</p>}

            <div className="flex gap-3">
              <button onClick={cancel} className="flex-1 px-4 py-3 bg-white rounded-lg shadow hover:shadow-md font-semibold text-gray-600">
                {t('cancel')}
              </button>
              <button onClick={save} className={`flex-1 ${BTN_PRIMARY} px-4 py-3`}>
                {t('save')}
              </button>
            </div>
            <p className="text-xs text-gray-400 mt-3">{t('editorHint')}</p>
          </div>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Spielernamen ----------
    // Rein lokal: die Namen stehen weder im Memory noch im geteilten Link.
    // Ein Klick auf «Spieler 1» macht daraus ein Eingabefeld — vor dem ersten
    // Zug oder mitten im Spiel. Leer heisst wieder der Standardname, der so
    // auch der Sprachumschaltung folgt.
    // Mehr Zeichen sprengen die Kopfzeile auf dem Handy.
    const NAME_MAX = 14;

    const PlayerName = ({ name, fallback, onChange }) => {
      const [editing, setEditing] = useState(false);
      const [value, setValue] = useState('');
      const save = () => { onChange(value.trim()); setEditing(false); };

      if (editing) {
        return (
          <input
            autoFocus type="text" value={value} maxLength={NAME_MAX} placeholder={fallback}
            onChange={(e) => setValue(e.target.value)}
            onBlur={save}
            onKeyDown={(e) => {
              if (e.key === 'Enter') save();
              if (e.key === 'Escape') setEditing(false);
            }}
            className="w-24 sm:w-40 px-2 py-0.5 text-lg font-semibold text-gray-700 text-center bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-blue-400"
          />
        );
      }
      return (
        <button
          onClick={() => { setValue(name); setEditing(true); }}
          title={t('editName')}
          className="block mx-auto max-w-[6rem] sm:max-w-[10rem] truncate text-lg font-semibold text-gray-700 hover:text-gray-900 underline decoration-dotted decoration-gray-400 underline-offset-4"
        >
          {name || fallback}
        </button>
      );
    };

    // ---------- Das Memory-Spiel ----------
    // Es werden immer ALLE Paare der Datei gespielt: Kachelzahl = 2 × Paare.
    const MemoryGame = ({ title, allPairs, onBack }) => {
      const createCards = () => {
        const cards = [];
        allPairs.forEach((pair, i) => {
          cards.push({ id: `q-${i}`, content: pair.question, pairId: i, type: 'question' });
          cards.push({ id: `a-${i}`, content: pair.answer, pairId: i, type: 'answer' });
        });
        return shuffleArray(cards);
      };

      const [cards, setCards] = useState(createCards);
      const [flippedCards, setFlippedCards] = useState([]);
      const [matchedPairs, setMatchedPairs] = useState([]);
      const [currentPlayer, setCurrentPlayer] = useState(1);
      const [scores, setScores] = useState({ player1: 0, player2: 0 });
      // Leer = Standardname. Beim Verlassen des Spiels verschwinden die Namen
      // von selbst (die Komponente wird abgeräumt), «Nochmal spielen» behält
      // sie — dort sitzen ja dieselben zwei vor dem Bildschirm.
      const [names, setNames] = useState({ 1: '', 2: '' });
      const nameOf = (n) => names[n] || t(`player${n}`);
      const nameField = (n) => (
        <PlayerName
          name={names[n]} fallback={t(`player${n}`)}
          onChange={(v) => setNames((prev) => ({ ...prev, [n]: v }))}
        />
      );
      const [isChecking, setIsChecking] = useState(false);
      const [settingsButton, settingsPanel] = useSettings();

      // Eine Schriftgrösse für alle Kacheln, bestimmt vom längsten Eintrag.
      // Gemessen wird an den Paaren, nicht an den gemischten Karten — sonst
      // begänne das Messen bei jedem «Neues Spiel» von vorn.
      const tileRef = useRef(null);
      const contents = useMemo(() => allPairs.flatMap(p => [p.question, p.answer]), [allPairs]);
      const [fontSizeFor, fontProbe] = useSharedFontSize(contents, tileRef);

      // Spaltenzahl so wählen, dass das Raster möglichst aufgeht
      const colsFor = (n, candidates, fallback) => {
        for (const c of candidates) if (n % c === 0) return c;
        return fallback;
      };
      const cardCount = cards.length;
      const cols = cardCount <= 16 ? colsFor(cardCount, [4, 3, 5, 6], 4) : colsFor(cardCount, [6, 5, 4], 6);
      const colsSm = colsFor(cardCount, [3, 4], 4);

      // Prüfen ob zwei aufgedeckte Karten ein Paar bilden
      useEffect(() => {
        if (flippedCards.length === 2) {
          setIsChecking(true);
          const [first, second] = flippedCards;
          const firstCard = cards.find(c => c.id === first);
          const secondCard = cards.find(c => c.id === second);

          if (firstCard.pairId === secondCard.pairId) {
            // Paar gefunden!
            setTimeout(() => {
              setMatchedPairs(prev => [...prev, firstCard.pairId]);
              setScores(prev => ({
                ...prev,
                [`player${currentPlayer}`]: prev[`player${currentPlayer}`] + 1
              }));
              setFlippedCards([]);
              setIsChecking(false);
            }, 1000);
          } else {
            // Kein Paar - Karten wieder umdrehen und Spieler wechseln
            setTimeout(() => {
              setFlippedCards([]);
              setCurrentPlayer(p => (p === 1 ? 2 : 1));
              setIsChecking(false);
            }, 2500);
          }
        }
      }, [flippedCards]);

      const handleCardClick = (card) => {
        if (isChecking || flippedCards.includes(card.id) || matchedPairs.includes(card.pairId)) {
          return;
        }

        if (flippedCards.length < 2) {
          setFlippedCards([...flippedCards, card.id]);
        }
      };

      const resetGame = () => {
        setCards(createCards());
        setFlippedCards([]);
        setMatchedPairs([]);
        setCurrentPlayer(1);
        setScores({ player1: 0, player2: 0 });
        setIsChecking(false);
      };

      const isGameComplete = matchedPairs.length === allPairs.length;

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className="max-w-5xl mx-auto">
            {/* Kopfzeile als Reihe: der Titel bekommt, was zwischen den Knöpfen
                bleibt — absolut gesetzte Knöpfe lägen auf dem Handy darüber */}
            <div className="flex items-center gap-2 mb-8">
              <button
                onClick={onBack}
                title={t('toOverview')}
                className="shrink-0 bg-white px-4 py-2 rounded-lg shadow hover:shadow-md transition-all font-semibold text-gray-700"
              >
                ← {t('overview')}
              </button>
              <h1 className="flex-1 min-w-0 text-2xl sm:text-4xl font-bold text-center text-gray-800 break-words">{title}</h1>
              {settingsButton}
            </div>
            {settingsPanel}

            {/* Spielerinfo */}
            <div className={`${CARD} p-6 mb-8`}>
              <div className="flex justify-around items-center">
                <div className={`text-center p-4 rounded-lg transition-all ${currentPlayer === 1 && !isGameComplete ? 'bg-red-100 ring-2 ring-red-500' : 'bg-gray-50'}`}>
                  {nameField(1)}
                  <div className="text-3xl font-bold text-red-600">{scores.player1}</div>
                </div>
                <div className={`text-center p-4 rounded-lg transition-all ${currentPlayer === 2 && !isGameComplete ? 'bg-blue-100 ring-2 ring-blue-500' : 'bg-gray-50'}`}>
                  {nameField(2)}
                  <div className="text-3xl font-bold text-blue-600">{scores.player2}</div>
                </div>
              </div>
            </div>

            {/* Spielfeld */}
            <div className="board mb-8 max-w-4xl mx-auto" style={{ '--cols': cols, '--cols-sm': colsSm }}>
              {fontProbe}
              {cards.map((card, i) => {
                const matched = matchedPairs.includes(card.pairId);
                const flipped = flippedCards.includes(card.id) || matched;

                return (
                  <div
                    key={card.id}
                    onClick={() => handleCardClick(card)}
                    className={`aspect-[3/2] cursor-pointer transition-all duration-300 transform ${
                      !flipped ? 'hover:scale-105' : ''
                    }`}
                  >
                    <div ref={i === 0 ? tileRef : null} className={`w-full h-full rounded-lg shadow-md flex items-center justify-center overflow-hidden p-2 sm:p-3 text-sm sm:text-lg font-bold text-center transition-all duration-300 ${
                      flipped
                        ? matched
                          ? 'bg-green-100 text-green-800'
                          : card.type === 'question'
                          ? 'bg-red-100 text-red-800'
                          : 'bg-blue-100 text-blue-800'
                        : 'bg-gradient-to-br from-red-400 to-blue-500 text-white hover:from-red-500 hover:to-blue-600'
                    }`}>
                      {flipped ? (
                        <FitText content={card.content} size={fontSizeFor(card.content)} />
                      ) : (
                        '?'
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Neues Spiel Button */}
            <div className="text-center">
              <button onClick={resetGame} className={`${BTN_PRIMARY} px-8 py-3`}>
                {t('newGame')}
              </button>
            </div>

            {/* Gewinner-Anzeige */}
            {isGameComplete && (
              <Modal>
                  <h2 className="text-3xl font-bold text-center mb-4">{t('gameOver')}</h2>
                  <div className="text-center mb-6">
                    {scores.player1 > scores.player2 ? (
                      <div className="text-2xl text-red-600 font-bold">{t('wins', nameOf(1))}</div>
                    ) : scores.player2 > scores.player1 ? (
                      <div className="text-2xl text-blue-600 font-bold">{t('wins', nameOf(2))}</div>
                    ) : (
                      <div className="text-2xl text-gray-600 font-bold">{t('draw')}</div>
                    )}
                  </div>
                  <div className="flex justify-around mb-6">
                    <div className="text-center">
                      <div className="text-gray-600 break-words">{nameOf(1)}</div>
                      <div className="text-4xl font-bold text-red-600">{scores.player1}</div>
                    </div>
                    <div className="text-center">
                      <div className="text-gray-600 break-words">{nameOf(2)}</div>
                      <div className="text-4xl font-bold text-blue-600">{scores.player2}</div>
                    </div>
                  </div>
                  <button onClick={resetGame} className={`w-full ${BTN_PRIMARY} px-6 py-3`}>
                    {t('playAgain')}
                  </button>
              </Modal>
            )}
          </div>
        </div>
      );
    };

    // ---------- Spiel aus der Route laden ----------
    const Game = ({ route, own, onBack }) => {
      const [memory, setMemory] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        setMemory(null);
        setError(null);
        if (route.type === 'demo') {
          const demo = demoById(route.id);
          demo ? setMemory(demo) : setError(t('errNoSuchMemory'));
        } else if (route.type === 'local') {
          const m = own.find((m) => m.id === route.id);
          m ? setMemory(m) : setError(t('errNotStored'));
        } else {
          decodeMemory(route.data)
            .then((m) => (m.pairs.length ? setMemory(m) : setError(t('errLinkEmpty'))))
            .catch(() => setError(t('errLinkBroken')));
        }
      }, [route.type, route.id, route.data]);

      if (error) {
        return (
          <div className={`${SCREEN} p-8 flex flex-col items-center justify-center gap-4`}>
            <div className="text-xl text-red-600 font-semibold text-center">{error}</div>
            <button onClick={onBack} className={`${BTN_PRIMARY} px-6 py-3`}>
              {t('toOverview')}
            </button>
          </div>
        );
      }
      if (!memory) {
        return <div className={`${SCREEN} p-8 text-center text-gray-500`}>{t('loading')}</div>;
      }
      return <MemoryGame title={memory.title} allPairs={memory.pairs} onBack={onBack} />;
    };

    // ---------- App ----------
    const App = () => {
      const [route, setRoute] = useState(getRoute);
      const [store, setStore] = useState(loadStore);
      // Sprache: `currentLang` ist der Wert, den t() liest — der Zustand daneben
      // sorgt nur dafür, dass die Oberfläche beim Umschalten neu gezeichnet wird.
      const [, redraw] = useState(currentLang);
      redrawLang = redraw; // die Setzfunktion bleibt dieselbe, das Zuweisen ist gratis
      const own = store.memories;
      const folders = allFolders(store);

      useEffect(() => {
        // Ein Link kann mitten im Betrieb hereinkommen (eingefügt statt geklickt).
        // Dann gilt auch seine Sprache — gemerkt wird sie nicht, der Link
        // entscheidet nur für diesen Besuch.
        const onHash = () => {
          const fromLink = langFromHash();
          if (fromLink && fromLink !== currentLang) {
            currentLang = fromLink;
            document.documentElement.lang = fromLink;
            redrawLang(fromLink); // sonst wüsste React nichts von der neuen Sprache
          }
          setRoute(getRoute());
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const openMemory = (memory) => { location.hash = toHash(memory); };
      const editMemory = (memory) => { location.hash = withLang('#edit=' + memory.id); };
      const newMemory = (dir) => { location.hash = withLang('#new=' + encodeURIComponent(dir || '')); };

      // Ändern + speichern in einem Schritt; Funktions-Update, damit Handler
      // nie einen veralteten Stand einfangen (Drag&Drop-Listener läuft dauerhaft)
      const updateStore = (fn) => setStore((prev) => {
        const next = fn(prev);
        saveStore(next);
        return next;
      });

      const putMemory = (memory, dropBy) => updateStore((prev) => ({
        ...prev,
        memories: [...prev.memories.filter(dropBy), memory].sort(byTitle),
      }));

      // Gleicher Titel = neue Version desselben Memorys → ersetzen statt doppeln
      const importMemory = (memory) => putMemory(memory, (m) => m.title !== memory.title);

      const saveMemory = (memory) => {
        const saved = memory.id ? memory : { ...memory, id: newId() };
        putMemory(saved, (m) => m.id !== saved.id);
        back();
      };

      const deleteMemory = (id) =>
        updateStore((prev) => ({ ...prev, memories: prev.memories.filter((m) => m.id !== id) }));

      // ---- Ordner verwalten ----
      // Die Namen kommen aus den Dialogen (s. AskModal); '/' muss raus, das
      // trennt hier die Ebenen.
      const cleanName = (name) => (name || '').trim().replace(/\//g, '-').replace(/^\.+$/, '-');

      const makeFolder = (parent, rawName) => {
        const name = cleanName(rawName);
        if (!name) return null;
        const path = parent ? `${parent}/${name}` : name;
        updateStore((prev) => (prev.folders.includes(path) ? prev : { ...prev, folders: [...prev.folders, path] }));
        return path;
      };

      const renameFolder = (dir, rawName) => {
        const name = cleanName(rawName);
        if (!name) return null;
        const target = parentDir(dir) ? `${parentDir(dir)}/${name}` : name;
        if (target === dir) return null;
        updateStore((prev) => remapDir(prev, dir, target));
        return target;
      };

      const moveFolder = (dir, parent) => {
        const target = parent ? `${parent}/${dirName(dir)}` : dirName(dir);
        updateStore((prev) => remapDir(prev, dir, target));
        return target;
      };

      const removeFolder = (dir) =>
        updateStore((prev) => ({ ...prev, folders: prev.folders.filter((f) => f !== dir) }));

      const moveMemory = (id, dir) => updateStore((prev) => ({
        ...prev,
        memories: prev.memories.map((m) => (m.id === id ? { ...m, dir } : m)),
      }));

      const folderApi = { makeFolder, renameFolder, moveFolder, removeFolder, moveMemory };

      const back = () => {
        history.replaceState(null, '', location.pathname);
        setRoute(null);
      };

      if (route && (route.type === 'edit' || route.type === 'new')) {
        const target = route.type === 'new'
          ? { id: null, title: '', dir: route.dir, pairs: [] }
          : own.find((m) => m.id === route.id);
        if (!target) {
          return (
            <div className={`${SCREEN} p-8 text-center text-gray-500`}>
              {t('errGone')}
              <button onClick={back} className="block mx-auto mt-4 underline">{t('backToList')}</button>
            </div>
          );
        }
        return (
          <MemoryEditor
            key={route.type === 'new' ? 'new' : route.id}
            memory={target} memories={own} folders={folders}
            onSave={saveMemory} onCancel={back} onNewFolder={makeFolder}
          />
        );
      }

      return route
        ? <Game key={JSON.stringify(route)} route={route} own={own} onBack={back} />
        : (
          <Selection
            own={own} folders={folders}
            onOpen={openMemory} onEdit={editMemory} onNew={newMemory}
            onImport={importMemory} onDelete={deleteMemory} folderApi={folderApi}
          />
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
