              <button onClick={onNew} className={`w-full ${BTN_NEUTRAL} flex items-center justify-center gap-2`}>
                <PenIcon /> {t('byHand')}
              </button>
              <p className="text-sm text-text-3 mt-3">{hint}</p>
            </div>
          )}
        </div>
      );
    };

    // ---------- Auswahlseite ----------
    const Selection = ({ own, folders, onOpen, onEdit, onNew, onImport, onDelete, folderApi, link, backup }) => {
      const [toast, setToast] = useState(null);
      const [qr, setQr] = useState(null); // { title, url }
      const [createOpen, setCreateOpen] = useState(false);
      const [examplesShown, setExamplesShown] = useExamplesShown();
      const [openDirs, setOpenDirs] = useState(loadOpen);
      const [dropDir, setDropDir] = useState(null); // Ordner, über dem gerade etwas schwebt
      const dragged = useRef(null); // { kind: 'memory'|'dir', id, dir? }
      const [dialog, setDialog] = useState(null); // s. AskModal
      // Wohin «Memory erstellen» ablegt. Das «+» an einem Ordner öffnet den Kasten
      // mit diesem Ordner vorgewählt (wie in MyVoci). Ein inzwischen umbenannter
      // oder gelöschter Ordner fällt auf den Hauptordner zurück.
      const [target, setTarget] = useState('');
      const into = folders.includes(target) ? target : '';
      // Eine gezogene Datei kommt in den Kasten (Vorschau wie im Feld), mehrere direkt in die
      // Sammlung. `dir` wie bei importFiles: auf einen Ordner gezogen dieser, aufs Fenster keiner.
      const takeFile = useRef(null); // setzt CreateBox
      const dropFiles = (files, dir) => {
        if (files.length === 1 && !/\.json$/i.test(files[0].name)) { create(dir || ''); takeFile.current([...files]); }
        else importFiles(files, dir);
      };
      const create = (dir) => {
        setTarget(dir);
        setCreateOpen(true);
        document.getElementById('create').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      // Der Datei-Listener am Fenster entsteht nur einmal: er liest die Liste hier
      const ownRef = useRef(own);
      ownRef.current = own;

      const toastTimer = useRef(0);
      const showToast = (msg) => {
        setToast(msg);
        clearTimeout(toastTimer.current); // sonst räumt der Timer der ersten Meldung die zweite ab
        toastTimer.current = setTimeout(() => setToast(null), 2500);
      };

      // Die Zwischenablage kann fehlen (ohne HTTPS) oder ablehnen (Safari, wenn
      // zwischen Klick und Kopieren etwas dazwischenkam). Beides endet hier,
      // statt stillschweigend nichts zu tun — der Link steht ja im QR-Fenster.
      const copyText = async (text, msg) => {
        try {
          await navigator.clipboard.writeText(text);
          showToast(msg);
        } catch { showToast(t('copyFailed')); }
      };

      const copyLink = async (memory) => copyText(await directLink(memory), t('linkCopied'));
      const showQr = async (memory) => setQr({ title: memory.title, url: await directLink(memory) });

      // Ein Memory als .txt herunterladen — dieselbe Datei, die der Import frisst
      const exportOne = (memory) => {
        download(fileName(memory), toFile(memory));
        showToast(t('downloadedOne', memory.title));
      };

      // Alle eigenen Memories als ZIP (s. zipBlob)
      const exportAll = async () => {
        if (!own.length) { showToast(t('noOwnMemories')); return; }
        try {
          download('MyMemory.zip', await ablage.zipBlob({ memories: own, folders }));
        } catch {
          showToast(t('zipFailed'));
          return;
        }
        showToast(t('downloadedAll', own.length));
      };

      const importBackupText = (text) => {
        const n = backup.restore(text);
        showToast(n === null ? t('backupBad') : t('backupDone', n));
      };

      // Ein Import in einen zugeklappten Ordner wäre sonst unsichtbar — die
      // Meldung sagt «importiert», die Liste zeigt nichts.
      const openTo = (dir) => setOpenDirs((cur) => {
        const add = [];
        for (let d = dir || ''; d; d = parentDir(d)) if (!cur.includes(d)) add.push(d);
        if (!add.length) return cur;
        const next = [...cur, ...add];
        writeLocal(OPEN_KEY, next);
        return next;
      });

      // Einziger Weg zu einem neuen Memory (Vorschau, Dateien). Ohne genannten Ordner
      // (`dir` undefined: aufs Fenster gezogen) gilt ein einziger gleicher Titel
      // irgendwo als neue Fassung davon, sonst der Hauptordner. Gleicher Platz:
      // erst nach «ersetzen?» (ABLAGE.md, «Dasselbe Set»). `done` erst, wenn das
      // Memory wirklich da ist — nach «Abbrechen» bleibt die Vorschau stehen.
      const addMemory = (memory, chosen, done) => {
        const titled = ownRef.current.filter((m) => m.title === memory.title);
        const dir = chosen ?? (titled.length === 1 ? titled[0].dir || '' : '');
        const put = () => {
          onImport({ id: newId(), ...memory, dir });
          openTo(dir);
          showToast(t('imported', memory.title, memory.pairs.length));
          if (done) done();
        };
        if (ownRef.current.some((m) => sameSlot(m, { dir, title: memory.title }))) {
          setDialog({ kind: 'confirm', ok: t('replace'), text: t('confirmReplace', memory.title), onYes: put });
        } else put();
      };

      const importFiles = (fileList, dir) => {
        for (const file of fileList) {
          if (/\.json$/i.test(file.name)) { file.text().then(importBackupText); continue; } // Sicherung aufs Fenster gezogen
          file.text().then((text) => {
            const parsed = parseFile(text, file.name);
            if (!parsed.pairs.length) showToast(t('noPairsInFile', file.name));
            else addMemory(parsed, dir);
          });
        }
      };

      // Dateien dürfen aufs ganze Fenster gezogen werden (wie bei MyTafelfussball).
      // Nur einmal registrieren: die Liste kommt aus ownRef, onImport aktualisiert
      // per Funktions-Update — die Closure kann also nicht veralten.
      useEffect(() => {
        const over = (e) => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); };
        const drop = (e) => {
          if (!e.dataTransfer.files.length) return;
          e.preventDefault();
          dropFiles(e.dataTransfer.files);
        };
        window.addEventListener('dragover', over);
        window.addEventListener('drop', drop);
        return () => {
          window.removeEventListener('dragover', over);
          window.removeEventListener('drop', drop);
        };
      }, []);

      // ---- Ordner auf-/zuklappen (gemerkt) ----
      const rememberOpen = (dirs) => {
        setOpenDirs(dirs);
        writeLocal(OPEN_KEY, dirs);
      };
      const toggleDir = (dir) =>
        rememberOpen(openDirs.includes(dir) ? openDirs.filter((d) => d !== dir) : [...openDirs, dir]);

      // ---- Umhängen per Drag&Drop ----
      // Der Zustand steckt in einer Ref statt im dataTransfer: dessen Inhalt ist
      // beim dragover nicht lesbar, wir brauchen ihn aber genau dort (Zielprüfung).
      // Gezogen werden Memories und Ordner (samt Inhalt), Ziel ist jeder Ordner
      // oder die Liste selbst (= Hauptordner).
      const canDrop = (dir) => {
        const d = dragged.current;
        if (!d) return false;
        if (d.kind === 'memory') return d.dir !== dir;
        return !inside(dir, d.id) && parentDir(d.id) !== dir; // nicht in sich selbst, nicht dorthin, wo er schon liegt
      };

      const dragProps = (item) => ({
        draggable: true,
        onDragStart: (e) => { dragged.current = item; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', item.id); },
        onDragEnd: () => { dragged.current = null; setDropDir(null); },
      });

      // Immer stopPropagation: Der Ordner unter dem Zeiger entscheidet allein —
      // auch wenn er ablehnt. Liesse man das Ereignis weiterlaufen, übernähme es
      // der Elternordner: ein Memory zurück auf seinen eigenen Ordner gelegt
      // landete eine Ebene höher, ein Ordner auf sich selbst gar im Hauptordner.
      const dropProps = (dir) => ({
        onDragOver: (e) => {
          e.stopPropagation();
          // Datei von aussen: landet in genau diesem Ordner (s. onDrop)
          if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); setDropDir(dir); return; }
          if (!canDrop(dir)) { setDropDir(null); return; } // kein preventDefault = hier wird nichts abgelegt
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          setDropDir(dir);
        },
        onDragLeave: (e) => {
          if (!e.currentTarget.contains(e.relatedTarget)) setDropDir((cur) => (cur === dir ? null : cur));
        },
        onDrop: (e) => {
          e.stopPropagation(); // sonst importiert der Fenster-Listener die Datei ein zweites Mal
          // Datei auf einen Ordner gezogen = dort importieren
          if (e.dataTransfer.files.length) {
            e.preventDefault();
            setDropDir(null);
            dropFiles(e.dataTransfer.files, dir);
            return;
          }
          const item = dragged.current;
          if (!item || !canDrop(dir)) return;
          e.preventDefault();
          dragged.current = null;
          setDropDir(null);
          // Der Zielordner klappt bewusst NICHT auf: wer etwas wegräumt, will es
          // weggeräumt haben. Beim Ordner wandert der gemerkte Zustand mit.
          if (item.kind === 'memory') folderApi.moveMemory(item.id, dir);
          else {
            followMove(item.id, folderApi.moveFolder(item.id, dir), dirName(item.id));
          }
        },
      });

      // Nach dem Umhängen/Umbenennen wandern die aufgeklappten Ordner mit;
      // `false` = am Ziel liegt schon ein Ordner, null = nichts geschehen
      // samt der Ordnerwahl im Kasten, sonst fiele sie still auf den Hauptordner
      const followMove = (from, to, shown) => {
        if (to === false) { showToast(t('folderExists', shown)); return; }
        if (!to) return;
        const move = (d) => (inside(d, from) ? to + d.slice(from.length) : d);
        rememberOpen(openDirs.map(move));
        setTarget(move);
      };

      const newFolder = (parent) => setDialog({
        kind: 'prompt', ok: t('create'),
        label: parent ? t('askSubfolder', dirName(parent)) : t('askFolder'),
        onOk: (name) => {
          const path = folderApi.makeFolder(parent, name);
          if (path) rememberOpen([...new Set([...openDirs, parent, path].filter(Boolean))]);
        },
      });

      const renameFolder = (dir) => setDialog({
        kind: 'prompt', ok: t('rename'), label: t('askRename'), preset: dirName(dir),
        onOk: (name) => {
          followMove(dir, folderApi.renameFolder(dir, name), name);
        },
      });

      // Gelöscht wird nur ein leerer Ordner — sonst wäre mit einem Klick eine
      // ganze Sammlung weg (und der Papierkorb ist hier der localStorage).
      const dropFolder = (dir) => {
        if (own.some((m) => inside(m.dir || '', dir)) || folders.some((f) => f !== dir && inside(f, dir))) {
          showToast(t('folderNotEmpty'));
          return;
        }
        setDialog({
          kind: 'confirm', ok: t('del'), text: t('confirmDeleteFolder', dirName(dir)),
          onYes: () => {
            folderApi.removeFolder(dir);
            rememberOpen(openDirs.filter((d) => d !== dir));
          },
        });
      };

      // Kompakte Liste (DESIGN.md): Name in fester Spalte, die Anzahl direkt
      // dahinter — so stehen die Zahlen untereinander. Die ganze Zeile startet
      // das Spiel, die Symbolknöpfe fangen ihren Klick selbst ab (IconButton).
      const row = (memory, deletable) => (
        <div
          key={memory.id}
          onClick={() => onOpen(memory)}
          className="liste-zeile cursor-pointer"
          {...(deletable ? dragProps({ kind: 'memory', id: memory.id, dir: memory.dir || '' }) : {})}
        >
          <button className="liste-name">{memory.title}</button>
          <span className="liste-zahl">
            {t('nPairs', memory.pairs.length)}
            {memory.lang && <span className="kuerzel ml-2 align-[1px]">{memory.lang}</span>}
          </span>
          <IconButton onClick={() => exportOne(memory)} title={t('exportOne')} extra="hidden sm:inline-flex"><DownloadIcon /></IconButton>
          <IconButton onClick={() => copyLink(memory)} title={t('copyLink')}><LinkIcon /></IconButton>
          <IconButton onClick={() => showQr(memory)} title={t('showQr')}><QrIcon /></IconButton>
          {deletable && (
            <IconButton onClick={() => onEdit(memory)} title={t('edit')}><PenIcon /></IconButton>
          )}
          {deletable && (
            <IconButton
              onClick={() => setDialog({
                kind: 'confirm', ok: t('del'), text: t('confirmDeleteMemory', memory.title),
                onYes: () => onDelete(memory.id),
              })}
              title={t('del')} danger
            ><TrashIcon /></IconButton>
          )}
        </div>
      );

      // Ein Ordner samt Inhalt: erst die Unterordner, dann seine Memories.
      // Gepackt wird an der Zeile, abgelegt auf der ganzen Kachel — ein Drop
      // irgendwo im Ordner (auch auf einem seiner Memories) meint diesen Ordner.
      const folderBox = (dir) => {
        const isOpen = openDirs.includes(dir);
        const count = own.filter((m) => inside(m.dir || '', dir)).length;
        return (
          <div
            key={dir}
            {...dropProps(dir)}
            className={`ablage ${dropDir === dir ? 'ziel' : ''}`}
          >
            <div
              {...dragProps({ kind: 'dir', id: dir })}
              onClick={() => toggleDir(dir)}
              className="liste-zeile cursor-pointer select-none !pl-1.5"
            >
              <span className="liste-name flex items-center gap-1.5">
                <span className={`shrink-0 text-text-3 transition-transform ${isOpen ? 'rotate-90' : ''}`}><ChevronIcon /></span>
                <span className="shrink-0 text-text-3"><FolderIcon /></span>
                <span className="truncate">{dirName(dir)}</span>
              </span>
              <span className="liste-zahl">{t('nMemories', count)}</span>
              <IconButton onClick={() => create(dir)} title={t('newMemoryHere')}><PlusIcon /></IconButton>
              <IconButton onClick={() => newFolder(dir)} title={t('newSubfolder')}><FolderIcon /></IconButton>
              <IconButton onClick={() => renameFolder(dir)} title={t('renameFolder')}><PenIcon /></IconButton>
              <IconButton onClick={() => dropFolder(dir)} title={t('deleteFolder')} danger><TrashIcon /></IconButton>
            </div>
            {isOpen && <div className="liste-ordner">{treeOf(dir)}</div>}
          </div>
        );
      };

      const treeOf = (dir) => (
        <>
          {folders.filter((f) => parentDir(f) === dir).map(folderBox)}
          {own.filter((m) => (m.dir || '') === dir).map((m) => row(m, true))}
        </>
      );

      return (
        <div className={PAGE}>
          <div className={COLUMN.narrow}>
            {/* Keine Kopfleiste (wie MyKahoot): die Startseite trägt den Markenzug */}
            <div className="flex items-center gap-3 mb-1">
              <div className="flex-1 flex items-center gap-3 text-3xl sm:text-4xl">
                <h1 className="font-bold frei">MyMemory</h1>
                <span className="logo" role="img" aria-label="MyMemory-Elefant" />
              </div>
              <Settings link={link} count={own.length} onBackupSave={backup.save} onBackupText={importBackupText} />
            </div>
            <p className="text-text-2 mb-6 frei">{t('subtitle')}</p>

            <CreateBox open={createOpen} onToggle={() => { setTarget(''); setCreateOpen((v) => !v); }}
              into={into} onPick={setTarget} folders={folders} onNew={() => onNew(into)}
              hint={link.status === 'ok' ? t('importHintDir', link.name) : t('importHint')}
              onFiles={(files) => importFiles(files, into)} takeRef={takeFile}
              onSave={(memory, done) => addMemory(memory, into, done)}
              onCopyPrompt={() => copyText(kiPrompt(), t('promptCopied'))} />

            {(link.status === 'prompt' || link.status === 'error') && (
              <div className={`${CARD} p-4 mb-6 text-sm`}>
                <p className={`mb-3 font-semibold ${link.status === 'prompt' ? 'text-orange' : 'text-rot'}`}>
                  {link.status === 'prompt' ? t('dirPrompt', link.name) : t('dirError', link.name)}
                </p>
                <div className="flex flex-wrap gap-2">
                  {link.status === 'prompt'
                    ? <button onClick={link.reconnect} className={`${BTN_PRIMARY} !py-1.5 text-sm`}>{t('dirReconnect')}</button>
                    : <button onClick={link.refresh} className={`${BTN_SECONDARY} !py-1.5 text-sm`}>{t('dirReload')}</button>}
                  <button onClick={link.disconnect} className={`${BTN_NEUTRAL} !py-1.5 text-sm`}>{t('dirDisconnect')}</button>
                </div>
              </div>
            )}

            <div className={`${CARD} p-3 sm:p-4 mb-6`}>
              <div className="flex items-center gap-1 mb-2 pl-2.5">
                <h2 className={`${LABEL} flex-1`}>{t('myMemories')}</h2>
                <IconButton onClick={() => create('')} title={t('newMemory')}><PlusIcon /></IconButton>
                <IconButton onClick={() => newFolder('')} title={t('newFolder')}><FolderIcon /></IconButton>
                <IconButton onClick={exportAll} title={t('exportAll')}><DownloadIcon /></IconButton>
              </div>
              {/* Die Liste selbst ist der Hauptordner: was hierher gezogen wird, liegt in keinem Ordner */}
              <div
                {...dropProps('')}
                className={`ablage min-h-[3rem] ${dropDir === '' ? 'ziel' : ''}`}
              >
                {own.length || folders.length ? treeOf('') : (
                  <div className="flex flex-col items-center text-center gap-3 px-4 py-6 text-text-3">
                    <img src="design/icons/creme/memory.svg" alt="" className="w-[52px] h-[52px] rounded-xl" />
                    <p className="text-sm max-w-xs">{t('emptyList')}</p>
                  </div>
                )}
              </div>
              {/* Mit verbundenem Ordner stimmt «in diesem Browser» nicht mehr */}
              {own.length > 0 && link.status !== 'ok' && (
                <p className="text-sm text-text-3 mt-2 px-2.5">{t('storedHint')}</p>
              )}
              {link.status === 'ok' && (
                <p className="text-sm text-text-3 mt-2 px-2.5">{t('storedHintDir', link.name)}</p>
              )}
              {/* Ein einmaliger Einrichtungsschritt — hinter dem Zahnrad fände ihn
                  niemand. Nur wo er geht (Chrome/Edge am Computer). */}
              {link.status === 'none' && (
                <p className="text-sm text-text-3 mt-2 px-2.5">
                  {t('dirOffer')}{' '}
                  <button onClick={link.connect} className="underline font-semibold hover:text-text-2">{t('dirChoose')}</button>
                </p>
              )}
            </div>

            {examplesShown && (
              <div className={`${CARD} p-3 sm:p-4 mb-8`}>
                <div className="flex items-center gap-1 mb-2 pl-2.5">
                  <h2 className={`${LABEL} flex-1`}>{t('examples')}</h2>
                  <IconButton onClick={() => setExamplesShown(false)} title={t('hideExamples')}><EyeOffIcon /></IconButton>
                </div>
                {DEMOS.map((m) => row(m, false))}
              </div>
            )}
          </div>

          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
          {qr && (
            <QrModal
              title={qr.title} url={qr.url}
              onClose={() => setQr(null)}
              onCopy={() => copyText(qr.url, t('linkCopied'))}
            />
          )}
          {toast && (
            <div className="kachel fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 z-50 font-semibold" style={{ boxShadow: 'var(--schatten)' }}>
              {toast}
            </div>
          )}
        </div>
      );
    };

    // ---------- Editor: Titel, Ordner und Paare bearbeiten ----------
    // Gearbeitet wird auf einer Kopie; erst «Speichern» schreibt sie zurück.
    const MemoryEditor = ({ memory, memories, folders, onSave, onCancel, onNewFolder }) => {
      const [title, setTitle] = useState(memory.title);
      const [dir, setDir] = useState(memory.dir || '');
      const [lang, setLang] = useState(memory.lang || ''); // '' = wie eingestellt
      const [pairs, setPairs] = useState(() =>
        memory.pairs.length ? memory.pairs.map((p) => ({ ...p })) : [{ question: '', answer: '' }]);
      const [error, setError] = useState('');
      const [dialog, setDialog] = useState(null); // s. AskModal

      const snapshot = JSON.stringify({ title, dir, lang, pairs });
      const [openSnapshot] = useState(snapshot); // Stand beim Öffnen — für die Rückfrage beim Abbrechen

      const setPair = (i, key, value) =>
        setPairs((ps) => ps.map((p, j) => (j === i ? { ...p, [key]: value } : p)));
      const addPair = () => setPairs((ps) => [...ps, { question: '', answer: '' }]);
      const removePair = (i) => setPairs((ps) => ps.filter((_, j) => j !== i));
      const movePair = (i, delta) => setPairs((ps) => {
        const j = i + delta;
        if (j < 0 || j >= ps.length) return ps;
        const next = [...ps];
        [next[i], next[j]] = [next[j], next[i]];
        return next;
      });

      // Jede Rückseite darf nur zu genau einer Vorderseite passen — sonst ist im
      // Spiel nicht entscheidbar, welches Paar gemeint war.
      const answers = pairs.map((p) => p.answer.trim()).filter(Boolean);
      const duplicate = answers.find((a, i) => answers.indexOf(a) !== i);

      const save = () => {
        const clean = pairs
          .map((p) => ({ question: p.question.trim(), answer: p.answer.trim() }))
          .filter((p) => p.question || p.answer);
        const name = title.trim();
        if (!name) return setError(t('errTitle'));
        // Ort (Ordner + Titel) und Datei sind der Schlüssel beim Import und beim
        // Spiegeln in den Ordner: zwei Memories am selben Ort würden sich
        // gegenseitig ersetzen bzw. überschreiben — gar nicht erst entstehen lassen.
        if (slotTaken(memories, { ...memory, title: name, dir }, memory.id)) {
          return setError(t('errTitleTaken'));
        }
        if (!clean.length) return setError(t('errNoPair'));
        if (clean.some((p) => !p.question || !p.answer)) return setError(t('errHalfPair'));
        onSave({ ...memory, title: name, dir, pairs: clean, lang: lang || undefined });
      };

      const cancel = () => {
        // Ungespeicherte Arbeit nicht wortlos wegwerfen
        if (snapshot === openSnapshot) return onCancel();
        setDialog({ kind: 'confirm', ok: t('discard'), text: t('confirmDiscard'), onYes: onCancel });
      };

      const newFolder = () => setDialog({
        kind: 'prompt', ok: t('create'),
        label: dir ? t('askSubfolder', dirName(dir)) : t('askFolder'),
        onOk: (name) => { const path = onNewFolder(dir, name); if (path) setDir(path); },
      });

      // Vorschau nur, wo sie etwas zeigt, das im Feld nicht steht (LaTeX)
      const preview = (text) => text.includes('$') && (
        <div className="mt-1 text-sm text-text-2 break-words"><MathRenderer content={text} /></div>
      );

      const field = (i, key, label, placeholder) => (
        <label className="block">
          <span className={LABEL}>{label}</span>
          <input
            type="text" value={pairs[i][key]} placeholder={placeholder}
            onChange={(e) => setPair(i, key, e.target.value)}
            className={`w-full mt-1 ${INPUT}`}
          />
          {preview(pairs[i][key])}
        </label>
      );

      return (
        <div className={PAGE}>
          <div className="max-w-2xl mx-auto">
            <h1 className="text-2xl font-bold mb-6 frei">
              {memory.id ? t('editMemory') : t('newMemory')}
            </h1>

            <div className={`${CARD} p-5 mb-6`}>
              <label className="block mb-4">
                <span className={LABEL}>{t('titleLabel')}</span>
                <input
                  type="text" value={title} onChange={(e) => setTitle(e.target.value)}
                  placeholder={t('titlePh')}
                  className={`w-full mt-1 ${INPUT}`}
                />
              </label>
              <span className={LABEL}>{t('folderLabel')}</span>
              <div className="flex gap-2 mt-1">
                <FolderSelect value={dir} onChange={setDir} folders={folders} />
                <IconButton onClick={newFolder} title={t('makeFolder')}><FolderIcon /></IconButton>
              </div>
              <label className="block mt-4">
                <span className={LABEL}>{t('gameLangLabel')}</span>
                <select
                  value={lang} onChange={(e) => setLang(e.target.value)}
                  className={`w-full mt-1 ${INPUT}`}
                >
                  <option value="">{t('gameLangDefault')}</option>
                  {LANGS.map((entry) => <option key={entry.id} value={entry.id}>{entry.name}</option>)}
                </select>
                <span className="block mt-1 text-sm text-text-2">{t('gameLangHint')}</span>
              </label>
            </div>

            {pairs.map((pair, i) => (
              <div key={i} className={`${CARD} p-4 mb-3`}>
                <div className="flex items-center gap-1 mb-2">
                  <span className="flex-1 text-sm font-semibold text-text-3">{t('pairN', i + 1)}</span>
                  <IconButton onClick={() => movePair(i, -1)} title={t('moveUp')}>↑</IconButton>
                  <IconButton onClick={() => movePair(i, 1)} title={t('moveDown')}>↓</IconButton>
                  <IconButton onClick={() => removePair(i)} title={t('deletePair')} danger><TrashIcon /></IconButton>
                </div>
                <div className="grid sm:grid-cols-2 gap-3">
                  {field(i, 'question', t('front'), t('frontPh'))}
                  {field(i, 'answer', t('back'), t('backPh'))}
                </div>
              </div>
            ))}

            <button onClick={addPair} className={`w-full mb-4 flex items-center justify-center gap-2 ${BTN_SECONDARY}`}>
              <PlusIcon /> {t('addPair')}
            </button>

            {duplicate && (
              <p className="text-sm text-orange mb-2">{t('dupAnswer', duplicate)}</p>
            )}
            {error && <p className="text-sm text-rot mb-2">{error}</p>}

            <div className="flex gap-3">
              <button onClick={cancel} className={`flex-1 ${BTN_NEUTRAL}`}>
                {t('cancel')}
              </button>
              <button onClick={save} className={`flex-1 ${BTN_PRIMARY}`}>
                {t('save')}
              </button>
            </div>
            <p className="text-sm text-text-3 mt-3">{t('editorHint')}</p>
          </div>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Spielernamen ----------
    // Rein lokal: die Namen stehen weder im Memory noch im geteilten Link.
    // Ein Klick auf «Spieler 1» macht daraus ein Eingabefeld — vor dem ersten
    // Zug oder mitten im Spiel. Leer heisst wieder der Standardname, der so
    // auch der Sprachumschaltung folgt.
    // Mehr Zeichen sprengen die Kopfzeile auf dem Handy.
    const NAME_MAX = 14;

    const PlayerName = ({ name, fallback, onChange }) => {
      const [editing, setEditing] = useState(false);
      const [value, setValue] = useState('');
      const save = () => { onChange(value.trim()); setEditing(false); };

      if (editing) {
        return (
          <input
            autoFocus type="text" value={value} maxLength={NAME_MAX} placeholder={fallback}
            onChange={(e) => setValue(e.target.value)}
            onBlur={save}
            onKeyDown={(e) => {
              if (e.key === 'Enter') save();
              if (e.key === 'Escape') setEditing(false);
            }}
            className={`w-24 sm:w-40 !px-2 !py-0.5 text-lg font-semibold text-center ${INPUT}`}
          />
        );
      }
      return (
        <button
          onClick={() => { setValue(name); setEditing(true); }}
          title={t('editName')}
          className="block mx-auto max-w-[6rem] sm:max-w-[10rem] truncate text-lg font-semibold underline decoration-dotted decoration-text-3 underline-offset-4"
        >
          {name || fallback}
        </button>
      );
    };

    // ---------- Das Memory-Spiel ----------
    // Es werden immer ALLE Paare der Datei gespielt: Kachelzahl = 2 × Paare.
    const MemoryGame = ({ title, allPairs, onBack }) => {
      const createCards = () => {
        const cards = [];
        allPairs.forEach((pair, i) => {
          cards.push({ id: `q-${i}`, content: pair.question, pairId: i, type: 'question' });
          cards.push({ id: `a-${i}`, content: pair.answer, pairId: i, type: 'answer' });
        });
        return shuffleArray(cards);
      };

      const [cards, setCards] = useState(createCards);
      const [flippedCards, setFlippedCards] = useState([]);
      const [matchedPairs, setMatchedPairs] = useState([]);
      // Wer welches Paar gefunden hat (pairId → 1/2): die Karte behält seine Farbe
      const [foundBy, setFoundBy] = useState({});
      const [currentPlayer, setCurrentPlayer] = useState(1);
      const [scores, setScores] = useState({ player1: 0, player2: 0 });
      // Leer = Standardname. Beim Verlassen des Spiels verschwinden die Namen
      // von selbst (die Komponente wird abgeräumt), «Nochmal spielen» behält
      // sie — dort sitzen ja dieselben zwei vor dem Bildschirm.
      const [names, setNames] = useState({ 1: '', 2: '' });
      const nameOf = (n) => names[n] || t(`player${n}`);
      const nameField = (n) => (
        <PlayerName
          name={names[n]} fallback={t(`player${n}`)}
          onChange={(v) => setNames((prev) => ({ ...prev, [n]: v }))}
        />
      );
      const [isChecking, setIsChecking] = useState(false);

      // Eine Schriftgrösse für alle Kacheln, bestimmt vom längsten Eintrag.
      // Gemessen wird an den Paaren, nicht an den gemischten Karten — sonst
      // begänne das Messen bei jedem «Neues Spiel» von vorn.
      const tileRef = useRef(null);
      const contents = useMemo(() => allPairs.flatMap(p => [p.question, p.answer]), [allPairs]);
      const [fontSizeFor, fontProbe] = useSharedFontSize(contents, tileRef);

      // Spaltenzahl so wählen, dass das Raster möglichst aufgeht
      const colsFor = (n, candidates, fallback) => {
        for (const c of candidates) if (n % c === 0) return c;
        return fallback;
      };
      const cardCount = cards.length;
      const isSmall = useSyncExternalStore(subscribeSmall, () => SMALL_SCREEN.matches);
      // Rückfall, wenn das Feld nicht ins Fenster passt (s. useBoardLayout)
      const fallbackCols = isSmall
        ? 3 // Handy: lieber scrollen als Kacheln, auf denen man nichts mehr liest
        : cardCount <= 16 ? colsFor(cardCount, [4, 3, 5, 6], 4) : colsFor(cardCount, [6, 5, 4], 6);
      const boardRef = useRef(null);
      const board = useBoardLayout(cardCount, fallbackCols, boardRef);

      // Prüfen ob zwei aufgedeckte Karten ein Paar bilden. Der Timer hängt am
      // Effekt: «Neues Spiel» und das Verlassen räumen die aufgedeckten Karten
      // ab, damit läuft das Aufräumen und bricht ihn ab — sonst feuerte er ins
      // neue Spiel und verteilte dort Punkte oder den Zug.
      useEffect(() => {
        if (flippedCards.length !== 2) return;
        setIsChecking(true);
        const [first, second] = flippedCards;
        const firstCard = cards.find(c => c.id === first);
        const secondCard = cards.find(c => c.id === second);
        let timer;

        if (firstCard.pairId === secondCard.pairId) {
          // Paar gefunden!
          timer = setTimeout(() => {
            setMatchedPairs(prev => [...prev, firstCard.pairId]);
            setFoundBy(prev => ({ ...prev, [firstCard.pairId]: currentPlayer }));
            setScores(prev => ({
              ...prev,
              [`player${currentPlayer}`]: prev[`player${currentPlayer}`] + 1
            }));
            setFlippedCards([]);
            setIsChecking(false);
          }, 1000);
        } else {
          // Kein Paar - Karten wieder umdrehen und Spieler wechseln
          timer = setTimeout(() => {
            setFlippedCards([]);
            setCurrentPlayer(p => (p === 1 ? 2 : 1));
            setIsChecking(false);
          }, 2500);
        }
        return () => clearTimeout(timer);
      }, [flippedCards]);

      const handleCardClick = (card) => {
        if (isChecking || flippedCards.includes(card.id) || matchedPairs.includes(card.pairId)) {
          return;
        }

        if (flippedCards.length < 2) {
          setFlippedCards([...flippedCards, card.id]);
        }
      };

      const resetGame = () => {
        setCards(createCards());
        setFlippedCards([]);
        setMatchedPairs([]);
        setFoundBy({});
        setCurrentPlayer(1);
        setScores({ player1: 0, player2: 0 });
        setIsChecking(false);
      };

      const isGameComplete = matchedPairs.length === allPairs.length;

      return (
        <div className={PAGE}>
          <div className={COLUMN.wide}>
            {/* Kopfzeile als Reihe: der Titel bekommt, was zwischen den Knöpfen
                bleibt — absolut gesetzte Knöpfe lägen auf dem Handy darüber */}
            <div className="flex items-center gap-2 mb-4">
              <button
                onClick={onBack}
                title={t('toOverview')}
                className={`shrink-0 ${BTN_NEUTRAL} auf-rand !px-4 !py-2`}
              >
                ← {t('overview')}
              </button>
              <h1 className="flex-1 min-w-0 text-2xl sm:text-4xl font-bold text-center break-words frei">{title}</h1>
              <Settings wide />
            </div>

            {/* Spielerinfo wie eine Anzeigetafel im Fussball: «Spieler 1  2 : 1  Spieler 2»
                — eine Zeile statt zwei Kästchen, damit das Spielfeld Platz hat.
                Spielfarbe als Fläche und Punkt, die Zahl bleibt in --text: Spielfarbe 1
                (Budapest: Rosa) erreicht als Schrift auf Weiss nur 2:1 */}
            <div className={`${CARD} px-3 py-2 sm:px-4 mb-4 grid grid-cols-[1fr_auto_1fr] items-center gap-2 sm:gap-4`}>
              {[1, 2].map((n) => (
                <div key={n} className={`spieler flex items-center gap-2 px-3 py-1.5 rounded-lg transition-colors min-w-0 ${
                  n === 1 ? 'justify-self-end' : 'justify-self-start col-start-3 row-start-1 flex-row-reverse'
                } ${currentPlayer === n && !isGameComplete ? `dran-${n}` : ''}`}>
                  <span className={`punkt punkt-${n}`} />
                  {nameField(n)}
                </div>
              ))}
              <div className="col-start-2 row-start-1 text-3xl sm:text-4xl font-bold tabular-nums whitespace-nowrap">
                {scores.player1}<span className="text-text-3 mx-2">:</span>{scores.player2}
              </div>
            </div>

            {/* Spielfeld */}
            <div ref={boardRef} className="board mb-6" style={{ '--cols': board.cols, ...(board.width
              // Mittig zur Spalte, auch wenn das Feld breiter ist als sie
              ? { width: `${board.width}px`, marginLeft: `calc(50% - ${board.width / 2}px)` } : {}) }}>
              {fontProbe}
              {cards.map((card, i) => {
                const matched = matchedPairs.includes(card.pairId);
                const flipped = flippedCards.includes(card.id) || matched;

                // Nur `transform` animieren: sonst gleitet bei jeder neuen Spaltenzahl
                // auch die Breite, Bild für Bild neu gesetzt und neu gemessen.
                // Neue Klassen hier auch ins versteckte <div> am Anfang des <body>.
                return (
                  <div
                    key={card.id}
                    onClick={() => handleCardClick(card)}
                    className={`platz aspect-[3/2] cursor-pointer transition-transform duration-300 transform ${
                      !flipped ? 'hover:scale-105' : ''
                    }`}
                  >
                    <div ref={i === 0 ? tileRef : null} className={`w-full h-full rounded-xl flex items-center justify-center overflow-hidden p-2 sm:p-3 text-sm sm:text-lg font-bold text-center transition-colors duration-300 ${
                      !flipped ? 'karte-ruecken'
                        : `${card.type === 'question' ? 'karte-frage' : 'karte-antwort'} ${
                          matched ? `von-${foundBy[card.pairId]}` : `offen-${currentPlayer}`}`
                    }`}>
                      {flipped ? (
                        <FitText content={card.content} fit={fontSizeFor(card.content)} />
                      ) : (
                        '?'
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Neues Spiel Button */}
            <div className="text-center">
              <button onClick={resetGame} className={`${BTN_SECONDARY} !px-8`}>
                {t('newGame')}
              </button>
            </div>

            {/* Gewinner-Anzeige */}
            {isGameComplete && (
              <Modal>
                  <h2 className="text-3xl font-bold text-center mb-4">{t('gameOver')}</h2>
                  <div className="text-center mb-6 text-2xl font-bold">
                    {scores.player1 === scores.player2
                      ? t('draw')
                      : t('wins', nameOf(scores.player1 > scores.player2 ? 1 : 2))}
                  </div>
                  <div className="flex justify-around mb-6">
                    {[1, 2].map((n) => (
                      <div key={n} className="text-center">
                        <div className="flex items-center justify-center gap-2 text-text-2 break-words">
                          <span className={`punkt punkt-${n}`} /> {nameOf(n)}
                        </div>
                        <div className="text-4xl font-bold">{scores[`player${n}`]}</div>
                      </div>
                    ))}
                  </div>
                  {/* Meist geht es danach mit einem anderen Memory weiter —
                      nochmals dasselbe ist die Ausnahme. */}
                  <div className="flex flex-col gap-2">
                    <button onClick={onBack} className={`w-full ${BTN_PRIMARY}`}>
                      {t('toOverview')}
                    </button>
                    <button onClick={resetGame} className={`w-full ${BTN_NEUTRAL}`}>
                      {t('playAgain')}
                    </button>
                  </div>
              </Modal>
            )}
          </div>
        </div>
      );
    };

    // ---------- Spiel aus der Route laden ----------
    const Game = ({ route, own, onKeep, onBack }) => {
      const [memory, setMemory] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        setMemory(null);
        setError(null);
        if (route.type === 'demo') {
          const demo = demoById(route.id);
          demo ? setMemory(demo) : setError(t('errNoSuchMemory'));
        } else if (route.type === 'local') {
          const m = own.find((m) => m.id === route.id);
          m ? setMemory(m) : setError(t('errNotStored'));
        } else {
          // Ein Link wird ein eigenes Memory (onKeep), die Route wechselt dann auf `local=`
          decodeMemory(route.data)
            .then((m) => (m.pairs.length ? onKeep(m) : setError(t('errLinkEmpty'))))
            .catch(() => setError(t('errLinkBroken')));
        }
      }, [route.type, route.id, route.data]);

      if (error) {
        return (
          <div className={`${SCREEN} p-8 flex flex-col items-center justify-center gap-4`}>
            <div className="text-xl text-rot font-semibold text-center frei">{error}</div>
            <button onClick={onBack} className={BTN_PRIMARY}>
              {t('toOverview')}
            </button>
          </div>
        );
      }
      if (!memory) {
        return <div className={`${SCREEN} p-8 text-center text-text-2 frei`}>{t('loading')}</div>;
      }
      return <MemoryGame title={memory.title} allPairs={memory.pairs} onBack={onBack} />;
    };

    // ---------- App ----------
    const App = () => {
      const [route, setRoute] = useState(getRoute);
      const [store, setStore] = useState(loadStore);
      // Sprache: `currentLang` ist der Wert, den t() liest — der Zustand daneben
      // sorgt nur dafür, dass die Oberfläche beim Umschalten neu gezeichnet wird.
      const [, redraw] = useState(currentLang);
      redrawLang = redraw; // die Setzfunktion bleibt dieselbe, das Zuweisen ist gratis
      const own = store.memories;
      const folders = allFolders(store);

      useEffect(() => {
        // Ein Link kann mitten im Betrieb hereinkommen (eingefügt statt geklickt).
        // Dann gilt auch seine Sprache — gemerkt wird sie nicht, der Link
        // entscheidet nur für diesen Besuch.
        const onHash = () => {
          // Der Hash entscheidet, sonst die gemerkte Wahl — das deckt auch die
          // Zurück-Taste des Browsers ab, die nicht über back() läuft.
          applyLang(langFromHash() || loadLang());
          setRoute(getRoute());
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const openMemory = (memory) => { location.hash = toHash(memory); };
      const editMemory = (memory) => { location.hash = withLang('#edit=' + memory.id); };
      const newMemory = (dir) => { location.hash = withLang('#new=' + encodeURIComponent(dir || '')); };

      // Der Store zum Nachschlagen ausserhalb des Renderns: Handler fangen so
      // nie einen veralteten Stand ein (Drag&Drop-Listener läuft dauerhaft),
      // und was aus dem Ordner kommt, wird fertig berechnet statt in einem
      // setStore-Updater — ein Updater darf mehrfach laufen oder verworfen werden.
      const storeRef = useRef(store);
      storeRef.current = store;
      // Ein Weg, den Store zu ändern: speichern, Ref nachziehen, rendern.
      const commit = (next) => { saveStore(next); storeRef.current = next; setStore(next); };
      const updateStore = (fn) => commit(fn(storeRef.current));

      // ---- Ordner auf der Platte (s. Abschnitt oben) ----
      const [link, setLink] = useState({ handle: null, status: dirSupported ? 'none' : 'unsupported' });
      // Der Ordner, der gerade gelten soll: ein Auftrag, der erst nach dem
      // Trennen fertig wird, erkennt sich daran als überholt.
      const wanted = useRef(null);
      // Der Stand, den der Ordner zuletzt gesehen hat: mirrorDir schreibt nur
      // die Differenz dazu. Was vom Ordner kommt, wird darauf gesetzt statt
      // zurückgeschrieben — sonst bügelte die App jede von Hand geschriebene
      // Datei in ihr eigenes Format.
      const mirrored = useRef(null);
      // Alle Ordner-Zugriffe hintereinander (MyAblage.queue): ein Nachlesen darf
      // nicht in ein halb geschriebenes Memory hineinlesen.
      const [enqueue] = useState(() => MyAblage.queue((e) => {
        console.error(e);
        // nach dem Trennen schweigen; das Handle kommt von `wanted`, denn beim Start und
        // beim ersten Verbinden steht es noch nicht im Zustand
        if (wanted.current) setLink((d) => ({ handle: d.handle || wanted.current, status: 'error' }));
      }));
      const takeDisk = (handle, keepAll) => {
        wanted.current = handle;
        return enqueue(async () => {
          const seen = storeRef.current;
          const disk = await readDir(handle);
          if (wanted.current !== handle) return;
          // Hat sich der Store während des Lesens geändert, ist der Plattenstand
          // veraltet (der Spiegel-Auftrag dazu steht erst hinter uns): nach ihm neu lesen.
          if (storeRef.current !== seen) { takeDisk(handle, keepAll); return; }
          const { next, onDisk } = fromDisk(storeRef.current, disk, keepAll, handle);
          mirrored.current = onDisk;
          // Der Fokus liest bei jedem Fensterwechsel nach; hat sich nichts
          // getan, soll weder localStorage noch die Liste etwas davon merken.
          if (JSON.stringify(next) !== JSON.stringify(storeRef.current)) commit(next);
          setLink((d) => (d.status === 'ok' && d.handle === handle ? d : { handle, status: 'ok' }));
        });
      };
      useEffect(() => {
        if (!dirSupported) return;
        loadDirHandle().then(async (handle) => {
          if (!handle) return;
          const perm = await handle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') takeDisk(handle, false); else setLink({ handle, status: 'prompt' });
        });
      }, []);
      useEffect(() => {
        if (link.status !== 'ok' || !mirrored.current || mirrored.current === store) return;
        const base = mirrored.current;
        mirrored.current = store;
        // Nicht geschrieben heisst nicht gespiegelt: nach einem Fehler holt
        // sonst kein späterer Lauf die Änderung nach.
        enqueue(async () => {
          if (wanted.current !== link.handle) return; // Ordner inzwischen gewechselt oder getrennt
          try { await mirrorDir(link.handle, base, store); } catch (e) { mirrored.current = base; throw e; }
        });
      }, [store, link]);
      // Im Finder abgelegte oder gelöschte Dateien erscheinen beim Wechsel
      // zurück ins Fenster.
      useEffect(() => {
        if (link.status !== 'ok') return;
        const onFocus = () => takeDisk(link.handle, false);
        window.addEventListener('focus', onFocus);
        return () => window.removeEventListener('focus', onFocus);
      }, [link.status, link.handle]);
      const connectDir = async () => {
        let handle;
        // Beim ersten Mal in «Dokumente», wo auch MyVoci und MyKahoot liegen; danach
        // merkt sich der Browser über `id` den zuletzt gewählten Ort.
        try { handle = await MyAblage.pickDir('mymemory'); }
        catch { return; } // abgebrochen
        await saveDirHandle(handle);
        takeDisk(handle, true);
      };
      // Kein `keepAll`: der Ordner ist die Wahrheit. Memories, die nur im
      // Browser entstanden sind, bleiben trotzdem (sie tragen kein `disk`).
      const reconnectDir = async () => {
        try {
          if ((await link.handle.requestPermission({ mode: 'readwrite' })) === 'granted') takeDisk(link.handle, false);
        } catch { setLink((d) => ({ ...d, status: 'error' })); }
      };
      const disconnectDir = () => { if (link.handle) ablage.forget(link.handle); wanted.current = null; saveDirHandle(null); mirrored.current = null; setLink({ handle: null, status: 'none' }); };
      const dirApi = {
        status: link.status, name: link.handle ? link.handle.name : '',
        connect: connectDir, reconnect: reconnectDir, disconnect: disconnectDir, refresh: () => takeDisk(link.handle, false),
      };

      // Die eine Regel fürs Ablegen: das alte Exemplar raus, das neue rein,
      // sortiert bleiben. Beide Wege (Speichern, Import) gehen hier durch.
      const insertMemory = (prev, memory, dropBy) => ({
        ...prev,
        memories: [...prev.memories.filter(dropBy), memory].sort(byTitle),
      });

      const putMemory = (memory, dropBy) => updateStore((prev) => insertMemory(prev, memory, dropBy));

      // Gleicher Platz = neue Fassung desselben Memorys → ersetzen statt doppeln
      // (gefragt hat schon die Übersicht). Überschrieben wird nur, was der Import
      // wirklich mitbringt: eine Datei ohne «Sprache:»-Zeile lässt die eingestellte
      // Sprache stehen. Auch die id bleibt — sonst zeigten Lesezeichen auf
      // «#local=<id>» ins Leere.
      const importMemory = (memory) => updateStore((prev) => {
        const old = prev.memories.find((m) => sameSlot(m, memory));
        return insertMemory(prev, old ? { ...old, ...memory, id: old.id } : memory, (m) => !old || m.id !== old.id);
      });

      // Ein geöffneter Link bleibt im Browser (wie in MyVoci): übernommen wie ein
      // Import und dann als eigenes Memory geöffnet (`local=`, die Sprache des Links
      // bleibt). Gleicher Ort = dasselbe Memory, ein korrigierter Link ersetzt es
      // ohne Frage. Der Link trägt keinen Ordner, landet darum im Hauptordner — es
      // sei denn, das Memory liegt unverändert schon irgendwo (die Lehrperson
      // öffnet den eigenen Link): dann wird das geöffnet, ohne Zweitkopie.
      const keepLink = (memory) => {
        const list = storeRef.current.memories;
        const here = list.find((m) => sameSlot(m, { ...memory, dir: '' }));
        const twins = here ? [] : list.filter((m) => m.title === memory.title);
        const same = twins.length === 1 && JSON.stringify(twins[0].pairs) === JSON.stringify(memory.pairs) ? twins[0] : null;
        const id = here ? here.id : same ? same.id : newId();
        if (!same) importMemory({ ...memory, id, dir: '' });
        const rest = hashParts().filter((x) => x !== routePart());
        history.replaceState(null, '', location.pathname + location.search + '#' + ['local=' + id, ...rest].join('&'));
        setRoute(getRoute());
      };

      // ---- Sicherung: Memories + Ordner in einer Datei (ABLAGE.md, «Weitergeben») ----
      // Einlesen ergänzt: gleicher Platz = dasselbe Memory, es bekommt nur die
      // fehlenden Paare; nichts wird ersetzt. null = keine MyMemory-Sicherung.
      const backup = {
        save: () => download('MyMemory-Sicherung.json', ablage.backupFile(storeRef.current, 'mymemory')),
        restore: (text) => {
          let data;
          try { data = JSON.parse(text); } catch { return null; }
          const res = ablage.restoreBackup(storeRef.current, data, 'mymemory');
          if (!res) return null;
          commit(res.next);
          return res.count;
        },
      };

      const saveMemory = (memory) => {
        const saved = ablage.prepareSave(store, memory); // neue id bzw. Datei zieht beim Umbenennen mit
        putMemory(saved, (m) => m.id !== saved.id);
        back();
      };

      const deleteMemory = (id) =>
        updateStore((prev) => ({ ...prev, memories: prev.memories.filter((m) => m.id !== id) }));

      // ---- Ordner verwalten ----
      // Die Namen kommen aus den Dialogen (s. AskModal); '/' trennt hier die
      // Ebenen, und was ein Dateisystem stört (: ? " …) kommt gar nicht erst in
      // einen Ordnernamen — sonst hiesse der Ordner auf der Platte anders.
      // Ziele und Wächter (Vorgabe unverändert, Ziel belegt, Gross/Klein) kommen aus
      // dem Modul: zurück kommt der Pfad, null = nichts tun, false = Ziel belegt.
      const makeFolder = (parent, rawName) => {
        const path = ablage.newFolderPath(store, parent, rawName);
        if (path) updateStore((prev) => (prev.folders.includes(path) ? prev : { ...prev, folders: [...prev.folders, path] }));
        return path;
      };
      const applyMove = (dir, target) => {
        if (target) updateStore((prev) => remapDir(prev, dir, target));
        return target;
      };
      const renameFolder = (dir, rawName) => applyMove(dir, ablage.renameFolderTarget(store, dir, rawName));
      const moveFolder = (dir, parent) => applyMove(dir, ablage.moveFolderTarget(store, dir, parent));

      const removeFolder = (dir) =>
        updateStore((prev) => ({ ...prev, folders: prev.folders.filter((f) => f !== dir) }));

      const moveMemory = (id, dir) => updateStore((prev) => ({
        ...prev,
        memories: prev.memories.map((m) => (m.id === id ? { ...m, dir } : m)),
      }));

      const folderApi = { makeFolder, renameFolder, moveFolder, removeFolder, moveMemory };

      const back = () => {
        history.replaceState(null, '', location.pathname);
        restoreLang();
        setRoute(null);
      };

      if (route && (route.type === 'edit' || route.type === 'new')) {
        const target = route.type === 'new'
          ? { id: null, title: '', dir: route.dir, pairs: [] }
          : own.find((m) => m.id === route.id);
        if (!target) {
          return (
            <div className={`${SCREEN} p-8 text-center text-text-2 frei`}>
              {t('errGone')}
              <button onClick={back} className="block mx-auto mt-4 underline">{t('backToList')}</button>
            </div>
          );
        }
        return (
          <MemoryEditor
            key={route.type === 'new' ? 'new' : route.id}
            memory={target} memories={own} folders={folders}
            onSave={saveMemory} onCancel={back} onNewFolder={makeFolder}
          />
        );
      }

      return route
        ? <Game key={JSON.stringify(route)} route={route} own={own} onKeep={keepLink} onBack={back} />
        : (
          <Selection
            own={own} folders={folders}
            onOpen={openMemory} onEdit={editMemory} onNew={newMemory}
            onImport={importMemory} onDelete={deleteMemory} folderApi={folderApi} link={dirApi} backup={backup}
          />
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    // Lader: Babel im Browser ist der teuerste Teil des Starts (3 MB laden, dann
    // übersetzen — auf einem Schul-Laptop mehrere Sekunden). Darum wird das
    // Übersetzte unter einem Fingerabdruck des Quelltexts gemerkt und beim
    // nächsten Besuch direkt ausgeführt; Babel kommt nur, wenn sich der Code
    // geändert hat (oder der Browser nichts speichern darf). Übersetzt wird nur
    // JSX — alles andere können die Browser selbst und so geht es dreimal so schnell.
    // Gemerkt wird im Cache Storage, nicht in localStorage: dessen 5 MB teilen sich
    // alle Apps auf manuel-benz.github.io mit ihren Daten und ein voller Speicher
    // liesse das Speichern der Memories still scheitern.
    (() => {
      const { BABEL, CACHE } = window.myLader;
      // `retainLines`: Zeile im Fehler = Zeile im #app-Block
      const OPTIONS = { presets: ['react'], retainLines: true };
      const app = document.getElementById('app'), src = app.textContent;
      app.remove(); // 130 KB Quelltext, die nach dem Lesen niemand mehr braucht
      // FNV-1a über Babel-Version, Einstellungen und Quelltext
      const input = BABEL + JSON.stringify(OPTIONS) + src;
      let h = 0x811c9dc5;
      for (let i = 0; i < input.length; i++) { h ^= input.charCodeAt(i); h = Math.imul(h, 0x01000193); }
      const key = `${(h >>> 0).toString(36)}.${src.length}`; // Länge als zweite Sicherung
      const store = window.caches ? caches.open(CACHE) : Promise.reject(new Error('kein Cache Storage'));
      const babel = () => new Promise((ok, fail) => {
        const el = document.createElement('script');
        el.src = BABEL;
        // Im Handler fangen: ein Fehler dort (Filter liefert eine Sperrseite statt
        // Babel, Tippfehler im JSX) liesse das Versprechen sonst ewig offen
        el.onload = () => { try { ok(Babel.transform(src, OPTIONS).code); } catch (e) { fail(e); } };
        el.onerror = () => fail(new Error(`${BABEL} nicht geladen`));
        document.head.appendChild(el);
      });
      const code = store.then((c) => c.match(key)).then((r) => r && r.text()).catch(() => null)
        .then((js) => js || babel().then((neu) => {
          // ein einziger Eintrag: alte Stände raus, neuer rein
          caches.delete(CACHE).then(() => caches.open(CACHE)).then((c) => c.put(key, new Response(neu))).catch(() => {});
          return neu;
        }));
      // React und KaTeX sind `defer`: sie laufen vor DOMContentLoaded
      const ready = new Promise((ok) => document.addEventListener('DOMContentLoaded', ok));
      Promise.all([code, ready]).then(([js]) => {
        const el = document.createElement('script');
        el.textContent = `"use strict";${js}\n//# sourceURL=mymemory-app.js`;
        document.body.appendChild(el); // läuft hier sofort durch
        el.remove(); // der Text bliebe sonst die ganze Sitzung im DOM
      }, (e) => console.error('MyMemory konnte nicht starten', e));
    })();
  </script>
</body>
</html>
