<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyMemory</title>
  <link rel="icon" type="image/svg+xml" href="design/icons/memory.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- My-Designsystem: Kopie aus ~/MySuite (design/HERKUNFT.txt), hier nie ändern -->
  <link rel="stylesheet" href="design/css/my-tokens.css" />
  <link rel="stylesheet" href="design/css/my-schemen.css" />
  <script>
    // Schema, Ton und Hell/Dunkel stehen am <html>, bevor irgendetwas
    // gezeichnet wird — sonst blitzt beim Laden kurz das Standardschema auf.
    // Dieselben Schlüssel liest die App unten (LOOK_KEY, MODUS_KEY).
    (() => {
      const read = (key) => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } };
      const saved = read('mymemory_look');
      // Ob die Schema-ID noch existiert, prüft die App (SCHEMES) und setzt sonst DEFAULT_LOOK.
      const look = saved && typeof saved.schema === 'string'
        ? saved : { schema: 'budapest', ton: 3 }; // = DEFAULT_LOOK
      const gemerkt = read('mymemory_modus');
      const html = document.documentElement;
      html.dataset.schema = look.schema;
      const ton = look.ton;
      if (ton) html.dataset.ton = ton;
      if (gemerkt === 'hell' || gemerkt === 'dunkel') html.dataset.modus = gemerkt;

      // Rand oben (s. .rand): Datei i von tools/make-hintergrund.py trägt die
      // i-te Farbe. Version (gegen alte Schichten im Browser-Cache) und
      // Kachelmasse schreibt das Skript selbst hierher. Die Schablonen des
      // aktuellen Modus beginnen schon hier zu laden: Tailwind unten blockiert
      // den Parser, der <body> mit dem Rand kommt erst danach dran. Das Skript
      // dort holt sie über dieselbe `bild()` — so gibt es nur einen Ladeweg.
      // <rand-daten>
      const V = '5cebb188', W = 1200, H = {'neuro': 460, 'pixel': 300};
      // </rand-daten>
      const schichten = {
        hell: ['pixel', ['--akzent', '--rad-1', '--rad-6', '--spiel-3']],
        dunkel: ['neuro', ['--akzent', '--rad-1', '--rad-2', '--spiel-3', '--rad-5', '--rad-6', '--rad-7']],
      };
      const datei = (name, i) => `hintergrund/${name}-${i}.svg?v=${V}`;
      const dunkel = matchMedia('(prefers-color-scheme: dark)');
      const modus = () => html.dataset.modus || (dunkel.matches ? 'dunkel' : 'hell');
      const bilder = new Map(); // jede Schablone nur einmal laden
      const bild = (src) => {
        if (!bilder.has(src)) bilder.set(src, new Promise((ok, fail) => {
          const img = new Image();
          img.onload = () => ok(img);
          // Vergessen statt merken: nach einem Funkloch lädt der nächste Versuch neu
          img.onerror = () => { bilder.delete(src); fail(); };
          img.src = src;
        }));
        return bilder.get(src);
      };
      const [name, farben] = schichten[modus()];
      farben.forEach((_, i) => bild(datei(name, i)).catch(() => {}));
      window.myRand = { W, H, schichten, datei, dunkel, modus, bild };

      // Babel (s. Lader am Ende des <body>) beim allerersten Besuch gleich
      // mitladen: der Lader läuft erst nach Tailwind und 130 KB Quelltext.
      // Steht schon übersetzter Code im Cache, braucht es Babel meist gar nicht.
      const BABEL = 'https://unpkg.com/@babel/standalone@7.26.4/babel.min.js';
      const CACHE = 'mymemory-code';
      window.myLader = { BABEL, CACHE };
      if (window.caches) {
        caches.open(CACHE).then((c) => c.keys()).then((keys) => {
          if (keys.length) return;
          const link = document.createElement('link');
          link.rel = 'preload'; link.as = 'script'; link.href = BABEL;
          document.head.appendChild(link);
        }).catch(() => {});
      }
    })();
  </script>
  <style>
    /* Rand oben, der nach unten ausdünnt (wie Dschungel/Blut in MyKahoot): Hell =
       8-Bit-Pixel, Dunkel = Neuronen-Netz. Das Bild malt das Skript am Anfang des
       <body> als Hintergrundbild (s. dort). Hinter allem (z-index −1), fest am
       Fenster. Bewusst ausserhalb von Tailwind: sonst hinge der Rand davon ab,
       wann (und ob) das CSS vom CDN kommt. */
    .rand { position: fixed; inset: 0 0 auto 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .rand > i { position: absolute; inset: 0; background-repeat: repeat-x; } /* Grösse setzt das Skript */
    .rand[data-satz="dunkel"] {
      background: radial-gradient(ellipse 60% 70% at 50% 0%, color-mix(in srgb, var(--akzent) 16%, transparent), transparent 70%); }
    /* Hoher Kontrast und Druck: weg damit — ein Hintergrundbild lässt der Browser
       bei hohem Kontrast stehen, hinter dem Titel stört es dort nur. */
    @media print, (forced-colors: active) { .rand { display: none; } }
  </style>
  <!-- Feste Versionen: «react@18» oder die nackte Tailwind-Adresse leiten erst
       weiter und die Weiterleitung hält im Cache nur Minuten — jeder Besuch
       kostete pro Datei eine Runde mehr. -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // Tailwind kennt nur noch die Farben des Designsystems: eine vergessene
    // Klasse wie `text-red-600` erzeugt gar keinen Stil statt einer festen Farbe.
    tailwind.config = {
      theme: {
        colors: {
          transparent: 'transparent',
          current: 'currentColor',
          grund: 'var(--grund)',
          karte: 'var(--karte)',
          linie: 'var(--linie)',
          hover: 'var(--hover)',
          zeile: 'var(--zeile)',
          text: { DEFAULT: 'var(--text)', 2: 'var(--text-2)', 3: 'var(--text-3)' },
          akzent: { DEFAULT: 'var(--akzent)', weich: 'var(--akzent-weich)', text: 'var(--akzent-text)', ink: 'var(--akzent-ink)' },
          rot: 'var(--rot-text)',
          orange: 'var(--orange-text)',
        },
        borderRadius: {
          none: '0',
          s: 'var(--radius-s)',
          DEFAULT: 'var(--radius)',
          lg: 'var(--radius)',
          xl: 'var(--radius-l)',
          full: 'var(--radius-pille)',
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <!-- `defer`: laden parallel, ohne den Parser anzuhalten — der Rand steht so,
       bevor die Bibliotheken da sind. Die App startet erst danach (Lader unten).
       Babel steht nicht hier: das holt der Lader nur, wenn der Code neu ist. -->
  <script defer src="design/js/my-ablage.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
  <script defer crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <style type="text/tailwindcss">
    /* Über Tailwind verarbeitet, sonst läge dessen Preflight (button { background:
       transparent }) hinter diesen Regeln und gewönne. Komponenten in @layer
       components, damit Tailwind-Klassen sie im Einzelfall noch übersteuern. */
    @layer base {
    /* Eigene Werte heissen bewusst anders als die Tokens (--akzent, --karte, --radius …):
       gleichnamig neu definiert, würden sie das Schema still überschreiben.
       Abgeleitete Flächen mischen mit var(--karte) — so machen sie Hell/Dunkel mit. */
    /* Erzwungenes Hell/Dunkel setzt my-tokens.css am [data-modus] selbst */
    :root:not([data-modus]) { color-scheme: light dark; }
    :root {
      /* Signalfarben als Schrift: Orange/Grün erreichen auf Weiss nur ~3:1 */
      --rot-text: color-mix(in oklab, var(--rot) 80%, var(--text));
      --orange-text: color-mix(in oklab, var(--orange) 60%, var(--text));
      /* Spiel: zwei Kanäle auf jeder offenen Karte. Die Fläche sagt den Typ (Frage
         hell, Antwort grau getönt — neutral, damit sie keiner Spielfarbe gleicht),
         die Farbe sagt den Spieler (Ring beim Aufdecken, Balken am gefundenen Paar).
         Spielfarbe 2 bleibt
         aussen vor — im Schema Budapest ist sie identisch mit dem Akzent (Aubergine). */
      --farbe-p1: var(--spiel-1);
      --farbe-p2: var(--spiel-4);
      --flaeche-p1: color-mix(in oklab, var(--farbe-p1) 24%, var(--karte));
      --flaeche-p2: color-mix(in oklab, var(--farbe-p2) 24%, var(--karte));
      --karte-antwort: color-mix(in oklab, var(--text) 15%, var(--karte));
      --schleier: color-mix(in srgb, var(--leiste) 55%, transparent);
    }
    /* Isle of Dogs: Spielfarbe 1 und 4 sind beide Beigebraun (Abstand unter der
       Wahrnehmungsschwelle) — Spieler 2 nimmt dort das Blau des Schemas. */
    [data-schema="isle"] { --farbe-p2: var(--blau); }
    /* Ohne color-mix (Safari < 16.2, Chrome < 111) wären die Flächen sonst
       ungültig und durchsichtig: dann deckende Ersatzflächen. */
    @supports not (color: color-mix(in oklab, red, blue)) {
      :root {
        --flaeche-p1: var(--farbe-p1);
        --flaeche-p2: var(--farbe-p2);
        --karte-antwort: var(--linie);
        --schleier: rgba(32, 32, 34, .55);
      }
      .spieler.dran-1, .spieler.dran-2 { background: var(--zeile); }
    }
    body {
      background: var(--grund); color: var(--text);
      font-family: var(--schrift); font-size: 16px; line-height: 1.55;
    }
    h1, h2 { letter-spacing: -0.02em; }
    }
    @layer components {
    .kopf { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }
    .kachel { background: var(--karte); border: 1px solid var(--linie); border-radius: var(--radius-l); }

    /* Knöpfe (DESIGN.md): primär, sekundär, neutral */
    .knopf { border-radius: var(--radius); font-weight: 600; padding: 10px 20px; transition: background .15s, border-color .15s, opacity .15s; }
    .knopf-1 { background: var(--akzent); color: var(--akzent-ink); }
    .knopf-1:hover { background: color-mix(in oklab, var(--akzent) 88%, var(--text)); }
    .knopf-2 { background: var(--akzent-weich); color: var(--akzent-text); }
    .knopf-2:hover { background: color-mix(in oklab, var(--akzent) 24%, var(--karte)); }
    .knopf-n { background: transparent; color: var(--text); border: 1px solid var(--linie); }
    .knopf-n:hover { background: var(--hover); }
    /* Markenzug wie in MyKahoot: Elefant rechts vom Titel, ohne Kachel, als Maske in
       currentColor — so dunkel auf Hell und hell auf Dunkel. Datei aus tools/make-logo.py */
    .logo {
      display: inline-block; height: 1.1em;
      aspect-ratio: 758 / 600; /* = viewBox-Breite/-Höhe, gibt tools/make-logo.py aus */
      background: currentColor;
      -webkit-mask: url("logo-elefant.svg") center / contain no-repeat;
      mask: url("logo-elefant.svg") center / contain no-repeat;
    }

    /* Was frei auf dem Rand steht (Titel, Untertitel), bekommt einen Hof in der Grundfarbe */
    .frei { text-shadow: 0 0 12px var(--grund), 0 0 5px var(--grund), 0 0 2px var(--grund); }
    .knopf:disabled { opacity: .45; cursor: not-allowed; }
    /* Quadratische Symbolknöpfe, ruhig bis zum Darüberfahren */
    .symbol { flex: none; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius); color: var(--text-2); background: transparent; transition: background .15s, color .15s; }
    .symbol:hover { background: var(--hover); color: var(--text); }
    .symbol.gefahr:hover { color: var(--rot-text); }
    /* Knöpfe, die auf dem Rand stehen: deckende Fläche, sonst scheint er durch. Das
       durchsichtige --hover legt sich beim Darüberfahren als Schleier darüber. */
    .auf-rand { background-color: var(--karte); }
    .auf-rand:hover { background-color: var(--karte); background-image: linear-gradient(var(--hover), var(--hover)); }
    /* Umschalter (Sprache, Darstellung, Schema) */
    .umschalter { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--linie); border-radius: var(--radius); }
    .umschalter button { padding: 4px 12px; border-radius: 7px; color: var(--text-2); font-size: 15px; }
    .umschalter button:hover { background: var(--hover); }
    .umschalter button[aria-pressed="true"] { background: var(--akzent-weich); color: var(--akzent-text); font-weight: 600; }
    .farbtupfer { width: 26px; height: 26px; border-radius: var(--radius-pille); background: var(--tupfer);
      outline-offset: 2px; transition: transform .1s; }
    .farbtupfer:hover { transform: scale(1.12); }
    .farbtupfer[aria-pressed="true"] { outline: 2px solid var(--text); }
    .feld { padding: 8px 12px; border: 1px solid var(--linie); border-radius: var(--radius); background: var(--karte); color: var(--text); }
    .feld:focus { outline: none; border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-weich); }
    .feld::placeholder { color: var(--text-3); }
    .feld.ziehen { border-color: var(--akzent); border-style: dashed; background: var(--akzent-weich); }
    .kuerzel { padding: 0 6px; border-radius: var(--radius-s); background: var(--hover); color: var(--text-2);
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    code { background: var(--hover); padding: 0 4px; border-radius: var(--radius-s); }

    /* Kompakte Liste (DESIGN.md, Listen): keine Fläche, nur Hover */
    .liste-zeile { display: flex; align-items: center; gap: 2px; padding: 5px 6px 5px 10px; margin-bottom: 2px;
      border-radius: var(--radius); transition: background .15s; }
    .liste-zeile:hover { background: var(--hover); }
    .liste-name { flex: 0 1 19rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 600; text-align: left; }
    /* Die Zahl kürzt nie, der Name gibt nach — nur auf dem Handy dreht es sich um (s. unten) */
    .liste-zahl { flex: 1 0 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; color: var(--text-3); white-space: nowrap; }
    /* Handy: der Name behält eine Mindestbreite, dafür gibt die Zahl nach, das Sprachkürzel
       entfällt und die Ordner rücken weniger ein — sonst verschwindet der Titel ab Ebene 2 */
    @media (max-width: 640px) {
      .symbol { width: 30px; height: 30px; }
      .liste-name { min-width: 4.5rem; }
      .liste-zahl { flex-shrink: 1; padding: 0 4px; font-size: 14px; }
      .liste-zahl .kuerzel { display: none; }
      .liste-ordner { margin-left: 6px; padding-left: 6px; }
    }
    .liste-ordner { margin-left: 14px; padding-left: 10px; border-left: 2px solid var(--linie); }
    .ablage { border-radius: var(--radius); outline: 2px dashed transparent; outline-offset: -2px; transition: background .15s, outline-color .15s; }
    .ablage.ziel { background: var(--akzent-weich); outline-color: var(--akzent); }

    /* Spielfeld */
    .spieler { background: var(--zeile); border: 2px solid transparent; }
    .spieler.dran-1 { background: var(--flaeche-p1); border-color: var(--farbe-p1); }
    .spieler.dran-2 { background: var(--flaeche-p2); border-color: var(--farbe-p2); }
    .punkt { display: inline-block; width: 10px; height: 10px; border-radius: var(--radius-pille); flex: none; }
    .punkt-1 { background: var(--farbe-p1); }
    .punkt-2 { background: var(--farbe-p2); }
    .karte-ruecken { background: var(--akzent); color: var(--akzent-ink); }
    .karte-ruecken:hover { background: color-mix(in oklab, var(--akzent) 85%, var(--text)); }
    .karte-frage { background: var(--karte); color: var(--text); box-shadow: inset 0 0 0 1px var(--linie); }
    .karte-antwort { background: var(--karte-antwort); color: var(--text); }
    /* Offene Karte im laufenden Zug: ringsum in der Farbe dessen, der dran ist —
       sticht aus den ruhigen, gefundenen Paaren heraus. Gefunden: nur ein Balken
       unten in der Farbe des Finders. */
    .offen-1 { box-shadow: inset 0 0 0 4px var(--farbe-p1); }
    .offen-2 { box-shadow: inset 0 0 0 4px var(--farbe-p2); }
    .von-1 { box-shadow: inset 0 -8px 0 var(--farbe-p1); }
    .von-2 { box-shadow: inset 0 -8px 0 var(--farbe-p2); }
    /* QR-Code: schwarz auf weiss, sonst liest ihn kein Handy — auch im Dunkelmodus */
    .qr { background: #FFFFFF; padding: 8px; border-radius: var(--radius); }
    }

    /* Spielfeld: Spaltenzahl passt sich der Kartenzahl an (immer ALLE Paare der Datei) */
    /* Flex statt Grid: eine angebrochene letzte Reihe steht so mittig */
    .board { --gap: .75rem; display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap); }
    .board > .platz { flex: 0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols)); }
    @media (max-width: 640px) { .board { --gap: .5rem; } }
  </style>
</head>
<body>
  <!-- Rand oben (s. .rand): Farbschichten aus hintergrund/, Farben aus dem Schema -->
  <div class="rand" aria-hidden="true"><i></i></div>
  <!-- Klassen, die erst beim Aufdecken auftauchen: Tailwind (CDN) baut sein ganzes
       CSS neu, sobald es einen Klassennamen zum ersten Mal im DOM sieht — sonst
       ausgerechnet im Moment, in dem die Karte umschlägt. Hier sieht es sie gleich. -->
  <div hidden class="karte-frage karte-antwort offen-1 offen-2 von-1 von-2 dran-1 dran-2 max-w-full"></div>
  <script>
    // Jede Datei aus hintergrund/ ist eine Schablone (nur Alpha). Sie werden einmal
    // in den Farben des Schemas übereinander auf eine Kachel gemalt; die Kachel wird
    // ein gewöhnliches Hintergrundbild, das CSS über die Breite wiederholt. So
    // rechnet der Browser beim Zeichnen nur ein fertiges Bild statt 4–7 SVGs mit
    // Hunderten Elementen. Neu gemalt wird nur, wenn sich Satz, Farben oder
    // Pixeldichte wirklich ändern. Daten und Ladeweg aus dem <head> (myRand).
    (() => {
      const { W, H, schichten, datei, dunkel, modus, bild } = window.myRand;
      const html = document.documentElement;
      const rand = document.querySelector('.rand'), flaeche = rand.firstElementChild;
      let gemalt = '', auftrag = 0, url = '';
      flaeche.style.backgroundSize = `${W}px auto`; // eine Kachel = W CSS-Pixel, egal bei welcher Dichte

      const malen = async () => {
        const satz = modus(), [name, farben] = schichten[satz];
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const css = getComputedStyle(html);
        const farbe = farben.map((f) => css.getPropertyValue(f).trim());
        const key = [satz, dpr, ...farbe].join(' ');
        if (key === gemalt) return; // gleiches Schema nochmals gewählt, Zoom über 2× …
        const nr = ++auftrag;
        // Anderer Satz: den alten sofort weg, nicht stehen lassen, bis die neuen
        // Schablonen geladen sind
        if (rand.dataset.satz !== satz) {
          rand.dataset.satz = satz;
          rand.style.height = `${H[name]}px`;
          flaeche.style.backgroundImage = '';
        }
        const imgs = await Promise.allSettled(farben.map((_, i) => bild(datei(name, i))));
        if (nr !== auftrag) return; // inzwischen schon wieder umgeschaltet
        const kachel = document.createElement('canvas'), schicht = document.createElement('canvas');
        kachel.width = schicht.width = Math.round(W * dpr);
        kachel.height = schicht.height = Math.round(H[name] * dpr);
        const ctx = kachel.getContext('2d'), sctx = schicht.getContext('2d');
        imgs.forEach((r, i) => {
          // Fehlt eine Schablone oder ihre Farbe, fehlt nur diese Schicht (nicht schwarz)
          if (r.status !== 'fulfilled' || !farbe[i]) return;
          sctx.globalCompositeOperation = 'source-over';
          sctx.clearRect(0, 0, schicht.width, schicht.height);
          sctx.drawImage(r.value, 0, 0, schicht.width, schicht.height);
          sctx.globalCompositeOperation = 'source-in'; // nur die deckenden Pixel färben
          sctx.fillStyle = farbe[i];
          sctx.fillRect(0, 0, schicht.width, schicht.height);
          ctx.drawImage(schicht, 0, 0);
        });
        // Nur ein vollständiges Bild gilt als gemalt: sonst holt der nächste Anlass nach
        if (imgs.every((r) => r.status === 'fulfilled') && farbe.every(Boolean)) gemalt = key;
        const blob = await new Promise((ok) => kachel.toBlob(ok));
        // Canvas-Speicher gleich freigeben: Safari (iPad) hat dafür eine harte Grenze
        kachel.width = schicht.width = 0;
        if (nr !== auftrag || !blob) return;
        if (url) URL.revokeObjectURL(url);
        url = URL.createObjectURL(blob);
        flaeche.style.backgroundImage = `url(${url})`;
      };

      malen();
      // Schema/Ton/Modus setzen die Einstellungen am <html>; zwei Attribute auf
      // einmal kommen hier als ein einziger Aufruf an.
      new MutationObserver(() => malen()).observe(html, { attributes: true, attributeFilter: ['data-schema', 'data-ton', 'data-modus'] });
      dunkel.addEventListener('change', () => malen());
      // Pixeldichte: Fenster auf einen anderen Bildschirm ziehen oder zoomen löst
      // nicht zuverlässig `resize` aus — die Media-Query meldet es immer.
      const dichte = () => matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
        .addEventListener('change', () => { malen(); dichte(); }, { once: true });
      dichte();
    })();
  </script>
  <div id="root"></div>

  <!-- Die App als JSX: läuft nicht von selbst, sondern über den Lader am Ende -->
  <script type="text/x-jsx" id="app">
    const { useState, useEffect, useLayoutEffect, useMemo, useRef, useSyncExternalStore } = React;

    // ---------- Browser-Speicher ----------
    // Der Browser darf jederzeit nein sagen (privates Fenster, voller Speicher) —
    // dann gilt der Standardwert. Alle Zugriffe laufen über diese zwei Zeilen.
    const readLocal = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch { return fallback; }
    };
    const writeLocal = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    };

    // ---------- Farbschema und Hell/Dunkel (My-Designsystem) ----------
    // Die Werte stehen in design/css/my-schemen.css; hier nur, was zur Wahl
    // steht. Gesetzt wird als data-schema/data-ton/data-modus am <html> — beim
    // Laden schon im <head> (gleiche Schlüssel), damit nichts aufblitzt.
    const LOOK_KEY = 'mymemory_look';
    const MODUS_KEY = 'mymemory_modus';
    const DEFAULT_LOOK = { schema: 'budapest', ton: 3 }; // Aubergine
    const SCHEMES = [
      { id: 'fox', name: 'Fantastic Mr. Fox' },
      { id: 'budapest', name: 'Grand Budapest Hotel' },
      { id: 'moonrise', name: 'Moonrise Kingdom' },
      { id: 'zissou', name: 'The Life Aquatic' },
      { id: 'isle', name: 'Isle of Dogs' },
    ];
    const MODI = ['system', 'hell', 'dunkel'];

    // Die Wahrheit steht am <html> (das Head-Skript hat sie dort gesetzt): so zeigen
    // die Einstellungen immer, was gilt — auch wenn der Browser das Speichern verweigert.
    const currentLook = () => {
      const { schema, ton } = document.documentElement.dataset;
      return { schema, ton: Number(ton) || null };
    };
    const applyLook = (look) => {
      writeLocal(LOOK_KEY, look);
      const html = document.documentElement;
      html.dataset.schema = look.schema;
      if (look.ton) html.dataset.ton = look.ton; else delete html.dataset.ton;
    };
    if (!SCHEMES.some((x) => x.id === currentLook().schema)) applyLook(DEFAULT_LOOK); // unbekannte ID im Speicher
    const currentModus = () => document.documentElement.dataset.modus || 'system';
    const applyModus = (modus) => {
      writeLocal(MODUS_KEY, modus);
      const html = document.documentElement;
      if (modus === 'system') delete html.dataset.modus; else html.dataset.modus = modus;
    };

    // ---------- Sprache (wie in MyKahoot) ----------
    // Umgeschaltet wird nur die Oberfläche, nie der Inhalt: Titel, Paare und die
    // eingebauten Beispiele bleiben, wie sie sind. Die Wahl merkt sich der
    // Browser; `t(key, …args)` liest das Wörterbuch, dynamische Texte sind
    // Funktionen, Texte mit Auszeichnung stehen als JSX drin. Beide Tabellen
    // müssen dieselben Schlüssel haben — ein fehlender bleibt leer.
    const LANGS = [{ id: 'de', name: 'Deutsch' }, { id: 'en', name: 'English' }];
    const LANG_KEY = 'mymemory_lang';
    const loadLang = () => (readLocal(LANG_KEY) === 'en' ? 'en' : 'de');

    // damit die Sprache, in der geteilt wurde, ohne selber etwas einstellen zu
    // müssen — umschalten darf sie trotzdem, und das merkt sich ihr Browser.
    const hashParts = () => location.hash.slice(1).split('&');
    // Nur bekannte Sprachen zählen: bei `&l=fr` gilt weiter, was der Browser
    // gemerkt hat, statt stillschweigend auf Deutsch zu fallen.
    const langFromHash = () => {

      return part && part.slice(2);
    };

    // Sprache das Memory selbst hat, gibt der Nutzer im Ausfüll-Block vor.
    const KI_PROMPT_DE = [
      "Du schreibst Lernkarten für den Unterricht. Erstelle ein Memory-Spiel (Paare) nach meinen Angaben.",
      "",
      "===== NUR DAS HIER AUSFÜLLEN (Rest unverändert lassen) =====",
      "Thema oder Material: [Thema in einem Satz — oder: siehe angehängte Datei/Text]",
      "Für wen: [z. B. 8. Klasse]",
      "Anzahl Paare: [z. B. 12]",
      "Schwierigkeit: [leicht / mittel / schwer / gemischt]",
      "Sprache des Memorys: [Deutsch]",
      "Besonderes: [optional, z. B. nur Kapitel 3]",
      "============================================================",
      "",
      "Schicke ich Material mit, nimm die Paare NUR daraus. Sonst nimmst du dein",
      "eigenes Wissen zum angegebenen Thema.",
      "",
      "SO GIBST DU ES AUS — daran scheitert es sonst:",
      "- Gib beides aus, in dieser Reihenfolge:",
      "  1. eine Datei zum Herunterladen, Endung .txt (kein .docx, kein PDF). Der",
      "     Dateiname ist der Titel ohne Umlaute, Akzente und Sonderzeichen, mit",
      "     Leerzeichen und normalem Bindestrich: Hauptstaedte Europas.txt",
      "  2. denselben Inhalt nochmals in EINEM Code-Block (```), zum Kopieren.",
      "- Kannst du keine Dateien erzeugen, reicht der Code-Block allein.",
      "- Kein Wort davor oder danach: keine Einleitung, keine Erklärung, keine Rückfrage.",
      "",
      "FORMAT (genau so):",
      "",
      "# Hauptstädte Europas",
      "Sprache: de",
      "",
      "F: Hauptstadt der Schweiz",
      "A: Bern",
      "---",
      "F: $\\sqrt{169}$",
      "A: $13$",
      "---",
      "",
      "TITEL (die Zeile «# …»):",
      "- Wie im Material (Kapitel, Thema des Arbeitsblatts), sonst das Thema kurz:",
      "  «Hauptstädte Europas», «Brüche – Kürzen».",
      "- Nicht in den Titel: Klasse, Datum, Sprache, «Memory», «Lernkarten».",
      "",
      "REGELN:",
      "- Erste Zeile «# Titel», zweite Zeile «Sprache: de» oder «Sprache: en» — je nach",
      "  Sprache des Memorys oben (bei einer anderen Sprache die Zeile weglassen).",
      "- «F: » ist die Vorderseite, «A: » die Rückseite, «---» trennt die Paare.",
      "- Nach jedem Paar eine Zeile «---», auch nach dem letzten.",
      "- Jede Rückseite darf nur zu GENAU EINER Vorderseite passen — sonst ist im Spiel",
      "  nicht entscheidbar, welche Karten zusammengehören. Keine Rückseite zweimal.",
      "- Beide Seiten müssen für sich verständlich sein: die Karten liegen einzeln da.",
      "- Kurz halten: Richtwert 40 Zeichen, höchstens ca. 80. Alle Karten tragen",
      "  dieselbe Schriftgrösse — ein einziger langer Eintrag macht die Schrift",
      "  also auf dem ganzen Spielfeld kleiner. Ganz lange Formeln werden allein",
      "  auf ihrer Karte kleiner gesetzt und sind dann kaum mehr zu lesen.",
      "- Formeln als LaTeX zwischen Dollarzeichen: $x^2 + 1$ (auch auf der Rückseite).",
      "- ALLE Zahlen gehören in den Mathe-Modus, auch einzelne: $7$, $2026$ — nie nackt als 7.",
      "- Tausendertrenner IMMER als schmales Leerzeichen \\, innerhalb der Dollarzeichen:",
      "  $468\\,000$. Kein Komma und kein Punkt als Trenner — das Komma ist bei uns das Dezimalzeichen.",
      "- Keine Nummerierung, keine Fettschrift, keine Bilder, keine Erklärungen.",
      "",
      "ZUM SCHLUSS: geh die Paare nochmals durch und bessere STILL aus, was hier nicht",
      "stimmt — am Ende nur das fertige Memory ausgeben, keine Liste der Änderungen.",
      "- Passt jede Rückseite wirklich nur zu ihrer eigenen Vorderseite?",
      "- Kommt eine Rückseite doppelt oder fast gleich vor?",
      "- Ist beides kurz genug für eine Karte?",
      "- Passt das Niveau durchgehend zur angegebenen Klasse?",
      "- Steht jede Zahl im Mathe-Modus, jeder Tausendertrenner als \\,?",
      "- Stimmt das Format überall: «# Titel», «F: », «A: », «---»?",
    ].join("\n");

    const KI_PROMPT_EN = [
      "You write flashcards for school. Create a memory game (pairs) from my input.",
      "",
      "===== FILL IN THIS PART ONLY (leave the rest unchanged) =====",
      "Topic or material: [topic in one sentence — or: see attached file/text]",
      "For whom: [e.g. grade 8]",
      "Number of pairs: [e.g. 12]",
      "Difficulty: [easy / medium / hard / mixed]",
      "Language of the memory: [English]",
      "Special notes: [optional, e.g. chapter 3 only]",
      "============================================================",
      "",
      "If I attach material, take the pairs ONLY from it. Otherwise use your own",
      "knowledge of the topic given above.",
      "",
      "HOW TO OUTPUT IT — this is where it usually goes wrong:",
      "- Give both, in this order:",
      "  1. a file to download, extension .txt (no .docx, no PDF). The file name is",
      "     the title without umlauts, accents and special characters, with spaces and",
      "     a plain hyphen: Capitals of Europe.txt",
      "  2. the same content again in ONE code block (```), to copy.",
      "- If you cannot produce files, the code block alone is enough.",
      "- Not a word before or after: no introduction, no explanation, no follow-up question.",
      "",
      "FORMAT (exactly like this):",
      "",
      "# Capitals of Europe",
      "Language: en",
      "",
      "F: Capital of Switzerland",
      "A: Bern",
      "---",
      "F: $\\sqrt{169}$",
      "A: $13$",
      "---",
      "",
      "TITLE (the line «# …»):",
      "- As in the material (chapter, topic of the worksheet), otherwise the topic in",
      "  short: «Capitals of Europe», «Fractions – Simplifying».",
      "- Not in the title: class, date, language, «Memory», «Flashcards».",
      "",
      "RULES:",
      "- First line «# Title», second line «Language: en» or «Language: de» — matching",
      "  the language of the memory given above (omit the line for any other language).",
      "- «F: » is the front, «A: » the back, «---» separates the pairs.",
      "- A line «---» after every pair, including the last one.",
      "- Every back must fit EXACTLY ONE front — otherwise the game cannot decide",
      "  which cards belong together. Never use the same back twice.",
      "- Both sides must make sense on their own: the cards lie there one by one.",
      "- Keep it short: about 40 characters, at most ~80. All cards share one font",
      "  size — a single long entry shrinks the text on the whole board. A very",
      "  long formula is set smaller on its own card and gets hard to read.",
      "- Formulas as LaTeX between dollar signs: $x^2 + 1$ (on the back too).",
      "- ALL numbers belong in math mode, single ones too: $7$, $2026$ — never bare 7.",
      "- Thousands separator ALWAYS as a thin space \\, inside the dollar signs:",
      "  $468\\,000$. Neither a comma nor a period as a separator (not 468,000, not 468.000).",
      "- No numbering, no bold, no images, no explanations.",
      "",
      "FINALLY: go through the pairs again and QUIETLY fix whatever does not match",
      "the rules — output only the finished memory, no list of changes.",
      "- Does every back really fit only its own front?",
      "- Does a back appear twice or nearly identically?",
      "- Are both sides short enough for a card?",
      "- Does the level fit the given class throughout?",
      "- Is every number in math mode, every thousands separator a \\,?",
      "- Is the format right everywhere: «# Title», «F: », «A: », «---»?",
    ].join("\n");

    const kiPrompt = () => (currentLang === 'en' ? KI_PROMPT_EN : KI_PROMPT_DE);

    // ---------- Dateien parsen ----------
    // Tafelfussball-Format: F: (oder Q:) Vorderseite, A: Rückseite, --- als Trenner.
    const parseFA = (text) => {
      const pairs = [];
      let question = null;
      for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        const m = line.match(/^([FQA]):\s*(.*)$/i);
        if (!m) continue;
        if (m[1].toUpperCase() === 'A') {
          if (question && m[2]) pairs.push({ question, answer: m[2] });
          question = null;
        } else {
          question = m[2];
        }
      }
      return pairs;
    };

    // Altes MyMemory-Format: "# Titel", pro Paar "## Vorderseite" + nächste Zeile.
    const parseMd = (text) => {
      const pairs = [];
      let title = null;
      let question = null;
      for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        if (!line) continue;
        if (line.startsWith('## ')) { question = line.slice(3).trim(); continue; }
        if (line.startsWith('# ')) { if (!title) title = line.slice(2).trim(); continue; }
        if (question) { pairs.push({ question, answer: line }); question = null; }
      }
      return { title, pairs };
    };

    const MEMORY_PREFIX = /^memory_+(?=.)/i;
    const parseFile = (text, filename) => {
      // Frühere KI-Prompts verlangten Dateinamen wie «Memory_Thema.txt»: das Präfix
      // gehört nicht in den Titel. Nur mit Unterstrich — «Memory Vokabeln.txt»
      // heisst wirklich so.
      // `lang` nur, wenn die Datei eine nennt: sonst überschriebe ein Import beim
      // Ersetzen die eingestellte Sprache mit «undefined»
      const lang = langInFile(text);
      const langPart = lang ? { lang } : {};
      if (/^##\s/m.test(text)) {
        const { title, pairs } = parseMd(text);
        return { title: title || MyAblage.titleFromFile('', filename, MEMORY_PREFIX), pairs, ...langPart };
      }
      // Steht ein «# Titel» in der Datei, gilt der: nur so überlebt ein Titel den
      // Weg Export → Import unverändert (der Dateiname verliert z.B. «_» und «:»).
      return { title: MyAblage.titleFromFile(text, filename, MEMORY_PREFIX), pairs: parseFA(text), ...langPart };
    };

    // «Sprache: en» / «Language: de» in der Datei (der KI-Prompt verlangt die
    // Zeile, der Export schreibt sie): die Sprache der Oberfläche im Spiel.
    const { langInFile } = MyAblage;

    // ---------- Dateien schreiben (Export) ----------
    // Gegenstück zu parseFA: exportiert wird genau die Datei, die der Import
    // wieder versteht. Zuoberst steht der Titel als «# Titel» — den liest der
    // Import zurück, und MyTafelfussball überspringt die Zeile (sie steht vor
    // der ersten «F: »-Zeile und wird dort keiner Aufgabe zugeschlagen).
    const toFile = (memory) =>
      `# ${memory.title}\n` +
      (memory.lang ? `${memory.lang === 'en' ? 'Language' : 'Sprache'}: ${memory.lang}\n` : '') + '\n' +
      memory.pairs.map((p) => `F: ${p.question}\nA: ${p.answer}\n---`).join('\n') + '\n';

    // Namen, Ordnerpfade, Ort, Ordner-Abgleich, ZIP und Link teilt MyMemory mit den
    // anderen My-Apps: design/js/my-ablage.js, Regeln in design/ABLAGE.md (beides
    // aus ~/MySuite, nie hier ändern). Begründungen stehen dort. Dateinamen ohne
    // Umlaute und Sonderzeichen (plainName); alte Dateien behalten ihren Namen (`file`).
    const { download } = MyAblage;

    // ---------- Eigene Memories im Browser (localStorage) ----------
    // Gespeichert wird { memories, folders }. Ältere Stände kannten nur
    // `memories` (ohne Ordner) — die landen im Hauptordner.
    const STORAGE_KEY = 'mymemory';

    // resolveSlots: alte Stände mit zwei Memories in einer Datei (frühere Namensregel) trennen
    const loadStore = () => {
      const raw = readLocal(STORAGE_KEY, {}) || {};
      return ablage.resolveSlots({
        memories: (raw.memories || []).map((m) => ({ dir: '', ...m })),
        folders: raw.folders || [],
      });
    };
    const saveStore = (store) => writeLocal(STORAGE_KEY, store);

    // ---------- Ordner ----------
    // Ein Ordner ist nur ein Pfad-String ('Mathe/Klasse 8'); '' ist der
    // Hauptordner. Jedes Memory trägt seinen Ordner in `dir`; `folders` hält
    // zusätzlich die leeren Ordner fest, die sonst niemand kennen würde.
    // byTitle aus dem Modul (natürlich sortiert: «Lektion 2» vor «Lektion 10»):
    // fromDisk sortiert genauso, sonst sähe jedes Nachlesen eine andere Reihenfolge.
    const { dirName, parentDir, inside, byTitle } = MyAblage;

    // ---------- Ordner auf der Platte (wie in MyVoci) ----------
    // Chrome/Edge am Computer öffnen über die File System Access API einen
    // Ordner; dann liegen die Memories dort als .txt (Unterordner = Ordner), und
    // localStorage ist nur noch Zwischenspeicher — die Liste steht sofort,
    // auch bevor der Browser den Zugriff wieder freigegeben hat. Der
    // Ordner-Handle überlebt nur in IndexedDB, nicht in localStorage.
    const dirSupported = MyAblage.dirSupported();
    const { load: loadDirHandle, save: saveDirHandle } = MyAblage.handleStore('mymemory');

    // «Ergänzt, was fehlt»: vorhandene Paare bleiben in ihrer Reihenfolge, neue
    // kommen hinten dazu — beim Verbinden verschluckt eine ältere Datei so
    // keine im Browser ergänzten Paare.
    const pairKey = (p) => `${p.question}\u0001${p.answer}`;
    const mergePairs = (a, b) => {
      const has = new Set(a.map(pairKey));
      return [...a, ...b.filter((p) => !has.has(pairKey(p)))];
    };

    // Das Format von MyMemory für den gemeinsamen Ordner-Abgleich: die Sammlung
    // heisst { memories, folders }, der Inhalt eines Memorys `pairs`.
    const ablage = MyAblage.sammlung({
      list: 'memories',
      items: 'pairs',
      fallback: 'Memory',
      toFile, parseFile,
      merge: mergePairs,
      newId: () => newId(), // steht erst weiter unten
    });
    // allFolders/remapDir: gebunden an { memories, folders }
    const { fileName, sameSlot, slotTaken, readDir, mirrorDir, fromDisk, allFolders, remapDir } = ablage;

    // Beispiele ein-/ausblenden: Knopf an der Beispiel-Liste, zurück über die
    // Einstellungen — beide hören auf denselben Wert. Er steht im Speicher der Seite,
    // nicht in localStorage: der Browser darf das Schreiben verweigern, und dann soll der
    // Schalter trotzdem wirken (auch nach einem Wechsel Übersicht ↔ Spiel).
    const EXAMPLES_KEY = 'mymemory_beispiele';
    let examplesOn = readLocal(EXAMPLES_KEY, true) !== false;
    const examplesListeners = new Set();
    const subscribeExamples = (fn) => { examplesListeners.add(fn); return () => { examplesListeners.delete(fn); }; };
    const setExamplesOn = (next) => {
      examplesOn = next;
      writeLocal(EXAMPLES_KEY, next);
      examplesListeners.forEach((fn) => fn());
    };
    const useExamplesShown = () => [useSyncExternalStore(subscribeExamples, () => examplesOn), setExamplesOn];

    // Welche Ordner sind aufgeklappt? Überlebt das Neuladen der Seite.
    const OPEN_KEY = 'mymemory_open_dirs';
    const loadOpen = () => readLocal(OPEN_KEY, []) || [];
    const newId = () =>
      (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

    // ---------- Direktlinks: Memory komprimiert im URL-Fragment ----------
    // Die Daten stehen nach dem # — sie verlassen den Browser nicht einmal
    // Richtung Server. Format: #m=1.<deflate+base64url> bzw. #m=0.<base64url>.
    // [Titel, Paare, Sprache]: die Sprache hinten und nur, wenn gesetzt — alte Links bleiben gültig
    const encodeMemory = (memory) => MyAblage.packLink([memory.title, memory.pairs.map((p) => [p.question, p.answer]), ...(memory.lang ? [memory.lang] : [])]);

    const decodeMemory = async (data) => {
      const [title, rawPairs, lang] = await MyAblage.unpackLink(data);
      return { title, pairs: rawPairs.map(([question, answer]) => ({ question, answer })), ...(lang === 'de' || lang === 'en' ? { lang } : {}) };
    };

    const demoById = (id) => DEMOS.find((d) => d.id === id);

    // ---------- Routing über das URL-Fragment ----------
    // Hash-Formen: #demo=<id>, #local=<id>, #m=<daten>, dahinter jeweils die
    // Sprache als &l=<de|en> — gebaut nur via toHash, gelesen nur via getRoute.
    // Jeder Hash, den die App schreibt, trägt die Sprache am Ende; gelesen wird
    // immer nur der erste Teil, der keine Sprache ist. Zusammengesetzt statt per
    // Textersatz — sonst bliebe `#l=en` (Sprache zuvorderst) stehen und die Wahl
    // wäre nach dem Neuladen wieder weg.
    // Ein Memory kann seine eigene Sprache haben (memory.lang): dann trägt
    // sein Link diese statt der gerade eingestellten — die Klasse landet so
    // automatisch in der Sprache der Fragen. `undefined` heisst «wie eingestellt».
    const withLang = (hash, lang = currentLang) => `${hash}${hash.endsWith('#') ? '' : '&'}l=${lang || currentLang}`;
    const routePart = () => hashParts().find((x) => !x.startsWith('l=')) || '';

    // Sprache von Hand umschalten: merken, neu zeichnen, und wenn sie im Link
    // steht, dort mitziehen — sonst käme beim Neuladen die alte zurück. Safari
    // begrenzt replaceState, darum darf das scheitern.
    // Einzige Stelle, die die angezeigte Sprache wechselt. Gleiche Sprache =
    // nichts tun, sonst zeichnete jeder Hash-Wechsel die Seite unnötig neu.
    const applyLang = (id) => {
      if (id === currentLang) return;
      currentLang = id;
      document.documentElement.lang = id;
      redrawLang(id);
    };
    // Ein Link oder Memory bringt seine eigene Sprache mit; verlässt man ihn,
    // gilt wieder die gemerkte Wahl. Die steht schon in LANG_KEY — ein zweites
    // Gedächtnis daneben wäre bloss eine weitere Stelle zum Vergessen (und nach
    // einem Neuladen leer, worauf die Übersicht in der Link-Sprache hängenbliebe).
    const restoreLang = () => applyLang(loadLang());
    const changeLang = (id) => {
      writeLocal(LANG_KEY, id);
      applyLang(id);
      if (langFromHash()) {
        try {
          const url = location.pathname + location.search + withLang('#' + routePart());
          history.replaceState(null, '', url);
        } catch {}
      }
    };

    const toHash = (memory) =>
      withLang(demoById(memory.id) ? '#demo=' + memory.id : '#local=' + memory.id, memory.lang);

    const directLink = async (memory) => {
      const base = location.origin + location.pathname;
      return demoById(memory.id)
        ? base + toHash(memory)
        : withLang(`${base}#m=${await encodeMemory(memory)}`, memory.lang);
    };

    // Ein von Hand verunstaltetes Fragment (#new=%zz) darf die App nicht
    // beim ersten Rendern umbringen — dann eben ungedeutet weiterreichen.
    const safeDecode = (raw) => {
      try { return decodeURIComponent(raw); } catch { return raw; }
    };

    const getRoute = () => {
      const hash = routePart(); // die Sprache im Hash geht die Route nichts an
      if (hash.startsWith('m=')) return { type: 'data', data: hash.slice(2) };
      if (hash.startsWith('demo=')) return { type: 'demo', id: hash.slice(5) };
      if (hash.startsWith('local=')) return { type: 'local', id: hash.slice(6) };
      if (hash.startsWith('edit=')) return { type: 'edit', id: hash.slice(5) };
      if (hash.startsWith('new=')) return { type: 'new', dir: safeDecode(hash.slice(4)) };
      return null;
    };

    // Alte Links (?memory=Mathematik/wurzeln) einmalig auf die Demos umschreiben,
    // damit getRoute ein reiner Hash-Parser bleibt
    (() => {
      const legacy = new URLSearchParams(location.search).get('memory');
      if (!legacy) return;
      const demo = DEMOS.find((d) => legacy.split('/').pop().includes(d.id));
      history.replaceState(null, '', location.pathname + (demo ? '#demo=' + demo.id : ''));
    })();

    const shuffleArray = (array) => {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    };

    // ---------- LaTeX/Text gemischt rendern ----------
    const MathRenderer = ({ content }) => {
      const ref = useRef(null);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        el.innerHTML = '';
        for (const part of content.split(/(\$[^$]+\$)/g)) {
          if (!part) continue;
          if (part.startsWith('$') && part.endsWith('$') && window.katex) {
            const span = document.createElement('span');
            try {
              window.katex.render(part.slice(1, -1), span, { throwOnError: false, displayMode: false });
            } catch (e) {
              span.textContent = part;
            }
            el.appendChild(span);
          } else {
            el.appendChild(document.createTextNode(part));
          }
        }
      }, [content]);

      // Umbrechen regelt der Aufrufer (Karte: WRAP, Vorschau: break-words)
      return <span ref={ref}></span>;
    };

    // ---------- Text, der sich auf die Kachel einpasst ----------
    // Lange Einträge sollen möglich sein, ohne aus der Karte zu laufen: die
    // Schrift geht stufenweise runter, bis der Text in die Kachel passt. Die
    // oberste Stufe gilt für kurze Einträge (die dürfen gross sein), die unterste
    // ist die Grenze — darunter wird es auch am Beamer nicht mehr lesbar.
    // Handy-Kacheln sind viel kleiner, deshalb dort eine eigene Leiter.
    const FONT_STEPS = [32, 28, 24, 22, 20, 18, 16, 14];
    const FONT_STEPS_SM = [18, 16, 14, 12, 11, 10];
    const SMALL_SCREEN = window.matchMedia('(max-width: 640px)');
    // Welche Leiter gerade gilt — gefragt beim Messen und für die Grösse davor.
    const subscribeSmall = (fn) => { SMALL_SCREEN.addEventListener('change', fn); return () => SMALL_SCREEN.removeEventListener('change', fn); };
    const fontSteps = () => (SMALL_SCREEN.matches ? FONT_STEPS_SM : FONT_STEPS);

    // Gemessen wird nicht jede Karte für sich, sondern alle Inhalte zusammen:
    // der längste bestimmt die Stufe für das ganze Spielfeld. So sind alle
    // Kacheln gleich beschriftet und die Schrift springt beim Aufdecken nicht.
    // `boxRef` zeigt auf eine echte Kachel (die Masse), gemessen wird in einer
    // unsichtbaren Kopie mit derselben Schrift — sonst bräche es anders um.
    //
    // Ausnahme sind einzelne Einträge, die auf KEINER Stufe passen: eine Formel
    // bricht nicht um, `$\sqrt{a^2-2ab+b^2}$` bleibt auch bei 14 px zu breit.
    // Solche Ausreisser zählen bei der Stufenwahl nicht mit — sie würden das
    // ganze Spielfeld nach unten ziehen, ohne selber zu passen — und bekommen
    // stattdessen allein eine kleinere Schrift. Unter MIN_PX hört es auf: was
    // dann noch nicht passt, ist schlicht zu lang für eine Karte.
    const MIN_PX = 8;

    // Wie ein Wort umbrechen darf, gestaffelt: zuerst nur ganze Wörter (die
    // Schrift wird lieber kleiner als «Deutschla/nd»), für Ausreisser dann
    // Silbentrennung nach der Sprache am <html>, ganz zuletzt mitten im Wort.
    // Würde von Anfang an überall umgebrochen, passte jeder Text scheinbar
    // schon auf der obersten Stufe und die Schrift ginge nie hinunter.
    // Zusammengesetzte Wörter («Rindfleischetikettierung») dürfen von Anfang an
    // getrennt werden: als Ganzes zwängen sie sonst die Schrift des ganzen
    // Feldes klein. Kürzere Wörter («Deutschland») bleiben immer ganz.
    const LONG_WORD = 14;
    const baseWrap = (content) =>
      content.replace(/\$[^$]*\$/g, ' ').split(/[\s\-\/]+/).some((w) => w.length >= LONG_WORD) ? 'hyphen' : 'whole';
    const WRAP = {
      whole: { overflowWrap: 'normal', hyphens: 'manual', WebkitHyphens: 'manual' },
      hyphen: { overflowWrap: 'normal', hyphens: 'auto', WebkitHyphens: 'auto' },
      anywhere: { overflowWrap: 'anywhere', hyphens: 'auto', WebkitHyphens: 'auto' },
    };

    // Zurück kommt eine Map Inhalt → { px, wrap } (Map statt Objekt: Kartentexte wie
    // «constructor» sind gültige Schlüssel, keine geerbten Eigenschaften).
    const useSharedFontSize = (contents, boxRef) => {
      const probeRef = useRef(null);
      const [sizes, setSizes] = useState(() => new Map());
      const key = contents.join('\u0000');

      // Passives useEffect (kein Layout-Effekt): so ist der KaTeX-Inhalt der
      // MathRenderer-Kinder schon da, wenn hier gemessen wird.
      useEffect(() => {
        const measure = () => {
          const box = boxRef.current, probe = probeRef.current;
          if (!box || !probe) return;
          const cs = getComputedStyle(box);
          const availW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
          const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
          if (availW <= 0 || availH <= 0) return;

          const els = Array.from(probe.children);
          els.forEach(el => { el.style.maxWidth = `${availW}px`; });
          const steps = fontSteps();
          const setStep = (step) => els.forEach(el => { el.style.fontSize = `${step}px`; });
          const setWrap = (el, wrap) => Object.assign(el.style, WRAP[wrap]);
          const bases = contents.map(baseWrap);
          els.forEach((el, i) => setWrap(el, bases[i]));
          const fits = (el) => el.scrollWidth <= availW && el.scrollHeight <= availH;

          // Einmal die Leiter hinunter und dabei merken, wer auf welcher Stufe
          // noch übersteht. Wer nicht einmal zuunterst passt, ist ein Ausreisser
          // und redet bei der Stufenwahl nicht mit. Passt gar keiner, sind es
          // keine Ausreisser, sondern lauter lange Einträge — dann gilt wieder
          // für alle dieselbe unterste Stufe.
          const unfitAt = [];
          for (const step of steps) {
            setStep(step);
            unfitAt.push(els.filter(el => !fits(el)));
            if (!unfitAt[unfitAt.length - 1].length) break;
          }
          const bottom = unfitAt[unfitAt.length - 1];
          const stubborn = new Set(bottom.length < els.length ? bottom : []);
          const level = unfitAt.findIndex(unfit => unfit.every(el => stubborn.has(el)));
          const chosen = steps[level < 0 ? steps.length - 1 : level];

          // Für jeden, der auf der gewählten Stufe nicht als ganze Wörter passt
          // (Ausreisser, oder alle, wenn alle lang sind), die grösste Schrift
          // suchen: erst ganze Wörter etwas kleiner («Niederlande» schlägt
          // «Niederlan-de»), dann mit Silbentrennung, dann mitten im Wort. Halbierend
          // statt gerechnet: umbrechender Text wird mit halber Schrift nicht
          // halb so hoch, sondern viertelt sich (halb so breite Zeilen UND halb
          // so viele) — eine Formel dagegen schrumpft linear. Gemessen schlägt
          // gerechnet.
          const largestFit = (el, floor) => { // grösste passende Schrift in [floor, chosen], sonst 0
            el.style.fontSize = `${chosen}px`;
            if (fits(el)) return chosen;
            let lo = floor - 1, hi = chosen; // lo passt (oder liegt unter der Grenze), hi passt nicht
            while (hi - lo > 1) {
              const mid = Math.floor((lo + hi) / 2);
              el.style.fontSize = `${mid}px`;
              if (fits(el)) lo = mid; else hi = mid;
            }
            return lo < floor ? 0 : lo;
          };
          setStep(chosen);
          const wholeFloor = Math.max(MIN_PX, Math.round(chosen * 0.8));
          const next = new Map(contents.map((content, i) => [content, { px: chosen, wrap: bases[i] }]));
          els.forEach((el, i) => {
            if (fits(el)) return;
            let px = 0, wrap;
            for (wrap of ['whole', 'hyphen', 'anywhere'].slice(bases[i] === 'hyphen' ? 1 : 0)) {
              setWrap(el, wrap);
              px = largestFit(el, wrap === 'whole' ? wholeFloor : MIN_PX);
              if (px) break;
            }
            next.set(contents[i], { px: px || MIN_PX, wrap });
          });
          setSizes((prev) => (
            prev.size === next.size && [...next].every(([c, v]) => prev.get(c)?.px === v.px && prev.get(c)?.wrap === v.wrap) ? prev : next
          ));
        };
        // Beim Ziehen am Fensterrand kämen sonst 60 Messungen pro Sekunde —
        // gebündelt bleibt eine pro Bild übrig.
        let frame = 0;
        const refit = () => {
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(measure);
        };

        measure();
        // Die KaTeX-Schriften kommen nachgeladen und ändern die Masse
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
        // Tailwind kommt vom CDN: beim ersten Messen steht die Kachel womöglich
        // noch ohne ihr Seitenverhältnis da und wäre viel zu flach. Der Beobachter
        // misst deshalb jedes Mal neu, wenn die Kachel ihre Grösse ändert — das
        // deckt auch Fenstergrösse und Handy-Drehung ab.
        const box = boxRef.current;
        if (!window.ResizeObserver || !box) { // ältere Geräte: wenigstens beim Drehen neu messen
          window.addEventListener('resize', refit);
          return () => { cancelAnimationFrame(frame); window.removeEventListener('resize', refit); };
        }
        const observer = new ResizeObserver(refit);
        observer.observe(box);
        return () => { cancelAnimationFrame(frame); observer.disconnect(); };
      }, [key]);

      // Die Kopie hängt an den Inhalten, nicht am Spielstand: sonst würde bei
      // jedem aufgedeckten Kärtchen die ganze KaTeX-Arbeit noch einmal anfallen.
      const probe = useMemo(() => (
        <div
          ref={probeRef} aria-hidden="true" className="font-bold text-center"
          style={{ position: 'fixed', left: 0, top: '-9999px', visibility: 'hidden' }}
        >
          {contents.map((content, i) => (
            <div key={i} className="leading-tight"><MathRenderer content={content} /></div>
          ))}
        </div>
      ), [key]);
      // Der Aufrufer fragt nur nach dem Inhalt; wie die Grösse zustande kommt,
      // bleibt hier drin. Vor der ersten Messung gilt die oberste Stufe.
      const sizeFor = (content) => sizes.get(content) || { px: fontSteps()[0], wrap: 'whole' };
      return [sizeFor, probe];
    };

    // ---------- Spielfeld, das ins Fenster passt ----------
    // Das ganze Feld soll ohne Scrollen sichtbar sein — am Beamer sieht sonst
    // die halbe Klasse die untere Hälfte nicht. Für jede Spaltenzahl wird die
    // Kachel so gross wie möglich gerechnet (Breite UND Höhe begrenzen), und die
    // grösste gewinnt: 16 Karten werden am breiten Beamer 8×2 statt 4×4.
    // Wäre die Kachel dann kleiner als MIN_TILE (Handy, viele Karten), bleibt
    // es beim Scrollen mit der alten Spaltenregel über die ganze Breite —
    // lesbare Karten schlagen ein Feld ohne Scrollen.
    // Das Feld darf breiter werden als die Spalte darüber: die ist ab 1360 px
    // für das Einstellungs-Kästchen verschmälert, das beim Spielen aber zu ist.
    // Geöffnet liegt es dann halt kurz über den Karten.
    const TILE_RATIO = 1.5; // aspect-[3/2]
    const MIN_TILE = 110;
    const BOARD_RESERVE = 104; // unter dem Feld: Abstand, «Neues Spiel», Seitenrand
    const useBoardLayout = (count, fallbackCols, boardRef) => {
      const [layout, setLayout] = useState({ cols: fallbackCols, width: null });
      useLayoutEffect(() => {
        const board = boardRef.current;
        if (!board) return;
        const page = board.parentElement.parentElement; // Feld → Spalte → Seite
        const measure = () => {
          const ps = getComputedStyle(page);
          const availW = page.clientWidth - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight);
          const availH = window.innerHeight - (board.getBoundingClientRect().top + window.scrollY) - BOARD_RESERVE;
          const gap = parseFloat(getComputedStyle(board).columnGap) || 0;
          let best = null;
          for (let cols = 2; cols <= Math.min(count, 10); cols++) {
            const rows = Math.ceil(count / cols);
            const empty = cols * rows - count;
            const byW = (availW - gap * (cols - 1)) / cols;
            const byH = ((availH - gap * (rows - 1)) / rows) * TILE_RATIO;
            // Leere Plätze in der letzten Reihe kosten: ein volles Raster sieht
            // ruhiger aus, wenn es fast gleich gross wird. Die angebrochene
            // Reihe steht mittig (.board ist flex-wrap), das fällt wenig auf.
            const tile = Math.min(byW, byH);
            if (tile < MIN_TILE) continue;
            const score = tile * 0.85 ** empty;
            if (!best || score > best.score) best = { cols, tile, score };
          }
          const next = best
            ? { cols: best.cols, width: Math.floor(best.cols * best.tile + gap * (best.cols - 1)) }
            : { cols: fallbackCols, width: null };
          setLayout((prev) => (prev.cols === next.cols && prev.width === next.width ? prev : next));
        };
        measure();
        let frame = 0;
        const refit = () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(measure); };
        window.addEventListener('resize', refit);
        // Die Spalte ändert ihre Breite auch ohne Fenster-Resize (Tailwind vom
        // CDN kommt spät, Einstellungen wandern an den Rand)
        const observer = window.ResizeObserver ? new ResizeObserver(refit) : null;
        if (observer) { observer.observe(board.parentElement); observer.observe(page); }
        return () => { cancelAnimationFrame(frame); window.removeEventListener('resize', refit); observer?.disconnect(); };
      }, [count, fallbackCols]);
      return layout;
    };

    const FitText = ({ content, fit }) => (
      <div className="max-w-full leading-tight" style={{ fontSize: `${fit.px}px`, ...WRAP[fit.wrap] }}>
        <MathRenderer content={content} />
      </div>
    );

    // ---------- Gemeinsame Bausteine ----------
    // Farben, Knöpfe und Flächen kommen aus dem My-Designsystem (Klassen im
    // <style> oben, Werte aus design/css) — hier nur noch die Zusammenstellung.
    const SCREEN = 'min-h-screen';
    const PAGE = `${SCREEN} p-4 sm:p-8 pt-14 sm:pt-20`; // Seite mit Rand oben: der Titel beginnt darunter
    const BTN_PRIMARY = 'knopf knopf-1';
    const BTN_SECONDARY = 'knopf knopf-2';
    const BTN_NEUTRAL = 'knopf knopf-n';
    const CARD = 'kachel';
    const LABEL = 'kopf';
    const INPUT = 'feld';

    const Modal = ({ children, onClose }) => (
      <div className="fixed inset-0 flex items-center justify-center z-50 p-4" style={{ background: 'var(--schleier)' }} onClick={onClose}>
        <div className="kachel p-6 sm:p-8 max-w-md w-full" style={{ boxShadow: 'var(--schatten)' }} onClick={(e) => e.stopPropagation()}>
          {children}
        </div>
      </div>
    );

    // prompt()/confirm() des Browsers sehen fremd aus und frieren die Seite ein —
    // dieselben zwei Fragen als Modal, gesteuert über einen `dialog`-Zustand:
    // { kind: 'prompt', label, preset, onOk } bzw. { kind: 'confirm', text, onYes }.
    const AskModal = ({ dialog, onClose }) => {
      const [value, setValue] = useState(dialog.preset || '');
      const isPrompt = dialog.kind === 'prompt';
      const submit = () => {
        if (isPrompt) { if (!value.trim()) return; dialog.onOk(value.trim()); }
        else dialog.onYes();
        onClose();
      };
      return (
        <Modal onClose={onClose}>
          <p className="mb-4">{isPrompt ? dialog.label : dialog.text}</p>
          {isPrompt && (
            <input
              autoFocus type="text" value={value}
              onChange={(e) => setValue(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
              className={`w-full mb-4 ${INPUT}`}
            />
          )}
          <div className="flex gap-3">
            <button onClick={onClose} className={`flex-1 ${BTN_NEUTRAL}`}>
              {t('cancel')}
            </button>
            <button onClick={submit} className={`flex-1 ${BTN_PRIMARY}`}>
              {dialog.ok || 'OK'}
            </button>
          </div>
        </Modal>
      );
    };

    // Quadratischer Symbolknopf (DESIGN.md, kompakte Liste); `danger` färbt
    // beim Darüberfahren rot — für Löschen.
    const IconButton = ({ onClick, title, danger = false, extra = '', children }) => (
      <button onClick={(e) => { e.stopPropagation(); onClick(e); }} title={title} aria-label={title}
        className={`symbol ${danger ? 'gefahr' : ''} ${extra}`}>
        {children}
      </button>
    );

    // ---------- Symbole ----------
    // Einfache Strichzeichnungen statt Emoji: die kommen je nach System als
    // bunte 3D-Bildchen. Alle teilen sich denselben Rahmen, damit sie in einer
    // Knopfreihe gleich gross sind.
    const Icon = ({ children }) => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {children}
      </svg>
    );

    const LinkIcon = () => (
      <Icon>
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </Icon>
    );
    const QrIcon = () => (
      <Icon>
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
        <path d="M14 14.5h3.5V18H14z" />
        <path d="M18.5 18.5H21V21h-2.5z" />
      </Icon>
    );
    const PenIcon = () => (
      <Icon><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z" /></Icon>
    );
    // Schieberegler statt Zahnrad: als Strichzeichnung besser zu erkennen
    const SettingsIcon = () => (
      <Icon>
        <path d="M4 8h10M18 8h2M4 16h4M12 16h8" />
        <circle cx="16" cy="8" r="2" />
        <circle cx="10" cy="16" r="2" />
      </Icon>
    );
    const DownloadIcon = () => (
      <Icon>
        <path d="M12 3v12" />
        <path d="M7.5 10.5 12 15l4.5-4.5" />
        <path d="M4 20h16" />
      </Icon>
    );
    const ChevronIcon = () => (
      <Icon><path d="M9 6l6 6-6 6" /></Icon>
    );
    const PlusIcon = () => (
      <Icon><path d="M12 5v14" /><path d="M5 12h14" /></Icon>
    );
    const FolderIcon = () => (
      <Icon><path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" /></Icon>
    );
    const EyeOffIcon = () => (
      <Icon>
        <path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-2.4 3" />
        <path d="M6.6 6.6C4.3 8.1 3 12 3 12s4 6 9 6a9 9 0 0 0 5.4-1.6" />
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
        <path d="M3 3l18 18" />
      </Icon>
    );
    const TrashIcon = () => (
      <Icon>
        <path d="M4 7h16" />
        <path d="M9 7V5h6v2" />
        <path d="M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12" />
      </Icon>
    );

    // ---------- QR-Code-Dialog ----------

    const QrModal = ({ title, url, onClose, onCopy }) => {
      const svg = useMemo(() => {
        try {
          const qr = window.qrcode(0, 'M');
          qr.addData(url);
          qr.make();
          return qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
        } catch (e) {
          return null; // zu viele Daten für einen QR-Code
        }
      }, [url]);

      return (
        <Modal onClose={onClose}>
          <h2 className="text-xl font-bold text-center mb-4">{title}</h2>
          {svg ? (
            <div className="flex justify-center mb-4">
              <div className="qr [&>svg]:w-56 [&>svg]:h-56" dangerouslySetInnerHTML={{ __html: svg }} />
            </div>
          ) : (
            <div className="text-center text-rot mb-4">
              {t('qrTooBig')}
            </div>
          )}
          <div className="text-xs text-text-3 break-all max-h-16 overflow-y-auto mb-4">{url}</div>
          <div className="flex gap-2">
            <button onClick={onCopy} className={`flex-1 ${BTN_PRIMARY}`}>
              {t('copyLinkBtn')}
            </button>
            <button onClick={onClose} className={BTN_NEUTRAL}>
              {t('close')}
            </button>
          </div>
        </Modal>
      );
    };

    // ---------- Einstellungen ----------
    // Knopf und Kästchen kommen getrennt zurück, weil sie an verschiedenen
    // Stellen der Seite stehen (Knopf im Kopf, Kästchen darunter). Es gibt sie
    // auf der Auswahlseite und im Spiel: wer über einen Link hereinkommt, sieht
    // die Übersicht nie und käme sonst nicht an die Sprache.
    // Einstellungen wie in MyKahoot: Hat es neben der mittleren Spalte Platz für das
    // Kästchen, wandert alles an den Fensterrand oben rechts und klappt dort auf, ohne
    // die Spalte zu überdecken. Damit das schon früh klappt, wird die Spalte dafür
    // schmaler (COLUMN: höchstens Fenster − 2 × 22.5rem, also Kästchen 20rem + Rand
    // auf beiden Seiten, damit sie mittig bleibt) — bis zur Untergrenze 480 px
    // (Übersicht) bzw. 640 px (Spielfeld); darunter wäre sie zu eng. Sonst bleibt der
    // Knopf in der Kopfzeile und das Kästchen klappt über den Inhalt — nie schiebt es
    // die Spalte nach unten. Zu per Knopf, Klick daneben oder Esc.
    // Im Spiel dockt es schon ab 1100 px an: das Feld ist breiter als die Spalte, der
    // Knopf in der Kopfzeile stünde sonst mitten im Feld statt am Fensterrand.
    // `wide`: Spalte des Spiels (max-w-5xl) statt der Übersicht (max-w-2xl). Die
    // Klassen stehen ausgeschrieben da, sonst erzeugt Tailwind (CDN) sie nicht.
    const SETTINGS_DOCK = {
      narrow: 'min-[1200px]:fixed min-[1200px]:top-3 min-[1200px]:right-3.5 z-30',
      wide: 'min-[1100px]:fixed min-[1100px]:top-3 min-[1100px]:right-3.5 z-30',
    };
    const COLUMN = {
      narrow: 'max-w-2xl min-[1200px]:max-w-[min(42rem,calc(100vw-45rem))] mx-auto',
      wide: 'max-w-5xl min-[1360px]:max-w-[min(64rem,calc(100vw-45rem))] mx-auto',
    };
    // `link`/`count`: nur die Übersicht reicht den Ordner herein (wie MyVoci); im
    // Spiel gibt es dort nichts zu verwalten.
    const Settings = ({ wide = false, link = null, count = 0, onBackupSave = null, onBackupText = null }) => {
      const [open, setOpen] = useState(false);
      const box = useRef(null);
      const backupInput = useRef(null);
      useEffect(() => {
        if (!open) return;
        const away = (e) => { if (!box.current?.contains(e.target)) setOpen(false); };
        const esc = (e) => { if (e.key === 'Escape') setOpen(false); };
        document.addEventListener('pointerdown', away);
        document.addEventListener('keydown', esc);
        return () => { document.removeEventListener('pointerdown', away); document.removeEventListener('keydown', esc); };
      }, [open]);
      const [look, setLook] = useState(currentLook);
      const [modus, setModus] = useState(currentModus);
      const [examplesShown, setExamplesShown] = useExamplesShown();
      const pickLook = (next) => { setLook(next); applyLook(next); };
      const pickModus = (next) => { setModus(next); applyModus(next); };

      const button = (
        <IconButton onClick={() => setOpen((v) => !v)} title={t('settings')} extra="auf-rand"><SettingsIcon /></IconButton>
      );
      const toggle = (items, active, pick) => (
        <div className="umschalter">
          {items.map(([id, label]) => (
            <button key={id} onClick={() => pick(id)} aria-pressed={id === active}>{label}</button>
          ))}
        </div>
      );
      // Ein Tupfer zeigt seine Farbe über `--tupfer`: der Ton liest das
      // Schema am <html>, der Schema-Tupfer trägt sein eigenes data-schema
      // und damit dessen Akzent.
      const swatch = (key, title, color, active, onClick, schema) => (
        <button
          key={key} title={title} aria-label={title} aria-pressed={active} onClick={onClick}
          className="farbtupfer" data-schema={schema} style={{ '--tupfer': color }}
        />
      );
      const scheme = SCHEMES.find((x) => x.id === look.schema);
      const panel = open && (
        <div className={`${CARD} absolute right-0 top-full mt-2 z-30 w-80 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-9rem)] overflow-y-auto p-5 space-y-4 text-left shadow-[var(--schatten)]`}>
          <div>
            <div className={`${LABEL} mb-2`}>{t('language')}</div>
            {toggle(LANGS.map((l) => [l.id, l.name]), currentLang, changeLang)}
          </div>
          <div>
            <div className={`${LABEL} mb-2`}>{t('look')}</div>
            {toggle(MODI.map((m) => [m, t('modi')[m]]), modus, pickModus)}
          </div>
          <div>
            <div className={`${LABEL} mb-2`}>{t('examples')}</div>
            {toggle(['an', 'aus'].map((k) => [k, t('examplesShown')[k]]), examplesShown ? 'an' : 'aus',
              (k) => setExamplesShown(k === 'an'))}
          </div>
          <div>
            <div className={`${LABEL} mb-2`}>{t('scheme')}</div>
            <div className="flex flex-wrap gap-2">
              {SCHEMES.map((x) => (
                <button
                  key={x.id} onClick={() => pickLook({ schema: x.id, ton: DEFAULT_LOOK.schema === x.id ? DEFAULT_LOOK.ton : null })}
                  aria-pressed={x.id === look.schema}
                  className={`flex items-center gap-2 ${x.id === look.schema ? BTN_SECONDARY : BTN_NEUTRAL} !px-3 !py-1.5 text-sm`}
                >
                  <span className="punkt" data-schema={x.id} style={{ background: 'var(--akzent)' }} />
                  {x.name}
                </button>
              ))}
            </div>
          </div>
          <div>
            <div className={`${LABEL} mb-2`}>{t('tone')}</div>
            <div className="flex flex-wrap items-center gap-2.5">
              {swatch('0', t('toneDefault'), 'var(--akzent)', !look.ton, () => pickLook({ ...look, ton: null }), look.schema)}
              <span className="w-px h-5 bg-linie" />
              {t('tones')[scheme.id].map((name, i) => swatch(i + 1, name, `var(--ton-${i + 1})`, look.ton === i + 1,
                () => pickLook({ ...look, ton: i + 1 })))}
            </div>
          </div>
          {link && (
            <div>
              <div className={`${LABEL} mb-2`}>{t('dirTitle')}</div>
              <p className="text-sm text-text-2 mb-3">{link.status === 'unsupported' ? t('dirUnsupported') : t('dirShort')}</p>
              {link.status === 'ok' && <p className="text-sm text-text-2 mb-3">{t('dirConnected', link.name, count)}</p>}
              {/* «Freigeben» und «nicht erreichbar» stehen schon als Streifen über
                  der Liste — hier nur die Knöpfe. */}
              <div className="flex flex-wrap gap-2">
                {link.status === 'none' && <button onClick={link.connect} className={`${BTN_SECONDARY} !px-3 !py-1.5 text-sm`}>{t('dirChoose')}</button>}
                {link.status === 'prompt' && <button onClick={link.reconnect} className={`${BTN_PRIMARY} !px-3 !py-1.5 text-sm`}>{t('dirReconnect')}</button>}
                {(link.status === 'ok' || link.status === 'error') && <button onClick={link.refresh} className={`${BTN_NEUTRAL} !px-3 !py-1.5 text-sm`}>{t('dirReload')}</button>}
                {link.status !== 'none' && link.status !== 'unsupported' && <button onClick={link.disconnect} className={`${BTN_NEUTRAL} !px-3 !py-1.5 text-sm`}>{t('dirDisconnect')}</button>}
              </div>
            </div>
          )}
          {onBackupSave && (
            <div>
              <div className={`${LABEL} mb-2`}>{t('backupTitle')}</div>
              <p className="text-sm text-text-2 mb-3">{t('backupHint')}</p>
              <div className="flex flex-wrap gap-2">
                <button onClick={onBackupSave} className={`${BTN_NEUTRAL} !px-3 !py-1.5 text-sm`}>{t('backupExport')}</button>
                <button onClick={() => backupInput.current.click()} className={`${BTN_NEUTRAL} !px-3 !py-1.5 text-sm`}>{t('backupImport')}</button>
                <input ref={backupInput} type="file" accept=".json,application/json" className="hidden"
                  onChange={(e) => { for (const f of e.target.files) f.text().then(onBackupText); e.target.value = ''; }} />
              </div>
            </div>
          )}
        </div>
      );
      return <div ref={box} className={`relative shrink-0 ${SETTINGS_DOCK[wide ? 'wide' : 'narrow']}`}>{button}{panel}</div>;
    };

    // Ordnerwahl mit eingerückten Unterordnern — Editor und «Memory erstellen»
    const FolderSelect = ({ value, onChange, folders, className = '' }) => (
      <select value={value} onChange={(e) => onChange(e.target.value)} className={`flex-1 min-w-0 ${INPUT} ${className}`}>
        <option value="">{t('rootFolder')}</option>
        {folders.map((f) => <option key={f} value={f}>{'\u00a0\u00a0'.repeat(f.split('/').length - 1) + dirName(f)}</option>)}
      </select>
    );

    // Was die Vorschau als «nicht verstanden» meldet: alles ausser den Zeilen,
    // die parseFA liest (Kopfzeilen kennt strayLines selbst). Das alte «## Vorderseite»-Format liest jede
    // Zeile als Rückseite, dort gibt es nichts zu melden.
    const knownLine = (l) => /^-{3,}$/.test(l) || /^[FQA]:/i.test(l);
    const strayOf = (text) => (/^##\s/m.test(text) ? [] : MyAblage.strayLines(text, knownLine));

    // Kasten «Memory erstellen» (wie in MyVoci und MyTafelfussball). Eine eigene
    // Komponente mit eigenem Zustand für den eingefügten Text: lag der in der
    // Übersicht, zeichnete jedes getippte Zeichen die ganze Liste neu.
    // Eingefügter Text und eine einzelne Datei kommen erst in die Vorschau
    // (ABLAGE.md, «Text einfügen und Vorschau»); mehrere Dateien gehen direkt
    // in den gewählten Ordner `into`.
    const CreateBox = ({ open, onToggle, into, onPick, folders, hint, onFiles, takeRef, onSave, onNew, onCopyPrompt }) => {
      const [pasted, setPasted] = useState('');
      const [fileName, setFileName] = useState(''); // Datei im Feld: ihr Name ist der Ersatztitel
      // Eigener Titel als { value, auto }: gilt, solange der Text denselben «# Titel»
      // bringt wie beim Ändern — eine ganz andere KI-Antwort bringt ihren eigenen mit
      const [title, setTitle] = useState(null);
      const [dragging, setDragging] = useState(false);
      const titleInput = useRef(null);
      const parsed = useMemo(() => (pasted.trim() ? parseFile(pasted, fileName) : null), [pasted, fileName]);
      const strays = useMemo(() => (parsed ? strayOf(pasted) : []), [pasted, parsed]);
      const pairs = parsed ? parsed.pairs : [];
      const auto = parsed ? parsed.title || '' : '';
      const shownTitle = title && title.auto === auto ? title.value : auto;
      const clear = () => { setPasted(''); setFileName(''); setTitle(null); };
      const typed = (text) => { setPasted(text); if (!text.trim()) { setFileName(''); setTitle(null); } };
      // Eine Datei kommt ins Feld (sichtbar und änderbar), mehrere direkt in die Sammlung.
      // Auch eine aufs Fenster oder einen Ordner gezogene Datei kommt hierher (takeRef).
      const takeFiles = (files) => {
        if (files.length !== 1 || /\.json$/i.test(files[0].name)) { onFiles(files); return; }
        const file = files[0];
        file.text().then((text) => { setPasted(text); setFileName(file.name); setTitle(null); });
      };
      takeRef.current = takeFiles;
      const save = () => {
        const name = shownTitle.trim();
        if (!name) { titleInput.current.focus(); return; }
        onSave({ ...parsed, title: name }, clear);
      };
      // Das Feld nimmt Text und Dateien. Es braucht ein eigenes onDrop: sonst
      // fiele die Datei zum Fenster-Listener durch — der kennt nur die Hauptebene.
      // Gezogener Text bleibt beim Browser (er fügt ihn ins Feld ein).
      const hereDrop = {
        onDragOver: (e) => { if (![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); e.stopPropagation(); setDragging(true); },
        onDragLeave: () => setDragging(false),
        onDrop: (e) => { setDragging(false); if (!e.dataTransfer.files.length) return; e.preventDefault(); e.stopPropagation(); takeFiles([...e.dataTransfer.files]); },
      };
      return (
        <div id="create" className={`${CARD} mb-8 scroll-mt-4`}>
          <button onClick={onToggle} className="w-full flex items-center justify-between gap-2 px-5 py-4 text-left">
            <h2 className="text-lg font-bold">{t('createTitle')}</h2>
            <span className={`text-text-3 transition-transform ${open ? 'rotate-90' : ''}`}><ChevronIcon /></span>
          </button>
          {open && (
            <div className="px-5 pb-5">
              {folders.length > 0 && (
                <label className="flex items-center gap-3 mb-4">
                  <span className={LABEL}>{t('createIn')}</span>
                  <FolderSelect value={into} onChange={onPick} folders={folders} className="text-sm" />
                </label>
              )}
              <ol className="list-decimal list-inside text-text-2 space-y-1 mb-4">{t('steps')}</ol>
              <button onClick={onCopyPrompt} className={`w-full ${BTN_PRIMARY} mb-6`}>{t('copyPrompt')}</button>
              <textarea value={pasted} onChange={(e) => typed(e.target.value)} {...hereDrop} rows={8} placeholder={t('pastePh')}
                aria-label={t('pasteLabel')} className={`w-full text-sm font-mono ${INPUT} ${dragging ? 'ziehen' : ''}`} />
              {pasted.trim() && !pairs.length && <p className="text-sm text-rot mt-2">{fileName ? t('noPairsInFile', fileName) : t('noPairsFound')}</p>}
              {pairs.length > 0 && (
                <div className="vorschau mt-4 rounded-lg border border-linie p-4">
                  <label className={`block ${LABEL} mb-1`} htmlFor="previewTitle">{t('previewTitle')}</label>
                  <input id="previewTitle" ref={titleInput} type="text" value={shownTitle} onChange={(e) => setTitle({ value: e.target.value, auto })}
                    placeholder={t('previewTitleMissing')} className={`w-full mb-3 ${INPUT}`} />
                  <p className="text-sm text-text-2 mb-1">{t('previewFolder', into)}</p>
                  <p className={`${LABEL} mt-3 mb-1`}>{t('previewCount', pairs.length)}</p>
                  <ol className="list-decimal pl-6 max-h-56 overflow-auto text-sm space-y-0.5 mb-3 break-words">
                    {pairs.map((p, i) => (
                      <li key={i}><MathRenderer content={p.question} /> <span className="text-text-2">→ <MathRenderer content={p.answer} /></span></li>
                    ))}
                  </ol>
                  {strays.length > 0 && (
                    <p className="text-sm text-orange mb-3">
                      {t('previewStray', strays.length)} {MyAblage.strayText(strays)}
                    </p>
                  )}
                  <div className="flex gap-2">
                    <button onClick={save} className={`flex-1 ${BTN_PRIMARY}`}>{t('previewSave')}</button>
                    <button onClick={clear} className={BTN_NEUTRAL}>{t('previewDiscard')}</button>
                  </div>
                </div>
              )}
              <div className={`flex items-center gap-3 my-4 ${LABEL}`}>
                <span className="flex-1 h-px bg-linie" /> {t('orByHand')} <span className="flex-1 h-px bg-linie" />
              </div>
