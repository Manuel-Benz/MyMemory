<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyMemory</title>
  <link rel="icon" type="image/svg+xml" href="design/icons/memory.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- My-Designsystem: Kopie aus ~/MySuite (design/HERKUNFT.txt), hier nie ändern -->
  <link rel="stylesheet" href="design/css/my-tokens.css" />
  <link rel="stylesheet" href="design/css/my-schemen.css" />
  <script>
    // Schema, Ton und Hell/Dunkel stehen am <html>, bevor irgendetwas
    // gezeichnet wird — sonst blitzt beim Laden kurz das Standardschema auf.
    // Dieselben Schlüssel liest die App unten (LOOK_KEY, MODUS_KEY).
    (() => {
      const read = (key) => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } };
      const saved = read('mymemory_look');
      // Ob die Schema-ID noch existiert, prüft die App (SCHEMES) und setzt sonst DEFAULT_LOOK.
      const look = saved && typeof saved.schema === 'string'
        ? saved : { schema: 'budapest', ton: 3 }; // = DEFAULT_LOOK
      const modus = read('mymemory_modus');
      const html = document.documentElement;
      html.dataset.schema = look.schema;
      const ton = look.ton;
      if (ton) html.dataset.ton = ton;
      if (modus === 'hell' || modus === 'dunkel') html.dataset.modus = modus;
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind kennt nur noch die Farben des Designsystems: eine vergessene
    // Klasse wie `text-red-600` erzeugt gar keinen Stil statt einer festen Farbe.
    tailwind.config = {
      theme: {
        colors: {
          transparent: 'transparent',
          current: 'currentColor',
          grund: 'var(--grund)',
          karte: 'var(--karte)',
          linie: 'var(--linie)',
          hover: 'var(--hover)',
          zeile: 'var(--zeile)',
          text: { DEFAULT: 'var(--text)', 2: 'var(--text-2)', 3: 'var(--text-3)' },
          akzent: { DEFAULT: 'var(--akzent)', weich: 'var(--akzent-weich)', text: 'var(--akzent-text)', ink: 'var(--akzent-ink)' },
          rot: 'var(--rot-text)',
          orange: 'var(--orange-text)',
        },
        borderRadius: {
          none: '0',
          s: 'var(--radius-s)',
          DEFAULT: 'var(--radius)',
          lg: 'var(--radius)',
          xl: 'var(--radius-l)',
          full: 'var(--radius-pille)',
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style type="text/tailwindcss">
    /* Über Tailwind verarbeitet, sonst läge dessen Preflight (button { background:
       transparent }) hinter diesen Regeln und gewönne. Komponenten in @layer
       components, damit Tailwind-Klassen sie im Einzelfall noch übersteuern. */
    @layer base {
    /* Eigene Werte heissen bewusst anders als die Tokens (--akzent, --karte, --radius …):
       gleichnamig neu definiert, würden sie das Schema still überschreiben.
       Abgeleitete Flächen mischen mit var(--karte) — so machen sie Hell/Dunkel mit. */
    /* Erzwungenes Hell/Dunkel setzt my-tokens.css am [data-modus] selbst */
    :root:not([data-modus]) { color-scheme: light dark; }
    :root {
      /* Signalfarben als Schrift: Orange/Grün erreichen auf Weiss nur ~3:1 */
      --rot-text: color-mix(in oklab, var(--rot) 80%, var(--text));
      --orange-text: color-mix(in oklab, var(--orange) 60%, var(--text));
      /* Spiel: Spieler 1 + Vorderseite, Spieler 2 + Rückseite. Spielfarbe 2 bleibt
         aussen vor — im Schema Budapest ist sie identisch mit dem Akzent (Aubergine). */
      --farbe-p1: var(--spiel-1);
      --farbe-p2: var(--spiel-4);
      --ink-p1: var(--text); --ink-p2: var(--text); --ink-paar: var(--text);
      --flaeche-p1: color-mix(in oklab, var(--farbe-p1) 24%, var(--karte));
      --flaeche-p2: color-mix(in oklab, var(--farbe-p2) 24%, var(--karte));
      --flaeche-paar: color-mix(in oklab, var(--gruen) 36%, var(--karte));
      --schleier: color-mix(in srgb, var(--leiste) 55%, transparent);
    }
    /* Isle of Dogs: Spielfarbe 1 und 4 sind beide Beigebraun (Abstand unter der
       Wahrnehmungsschwelle) — Spieler 2 nimmt dort das Blau des Schemas. */
    [data-schema="isle"] { --farbe-p2: var(--blau); }
    /* Ohne color-mix (Safari < 16.2, Chrome < 111) wären die Flächen sonst
       ungültig und durchsichtig: dann deckende Spielfarben mit ihrer Schriftfarbe. */
    @supports not (color: color-mix(in oklab, red, blue)) {
      :root {
        --flaeche-p1: var(--farbe-p1); --ink-p1: var(--spiel-1-ink);
        --flaeche-p2: var(--farbe-p2); --ink-p2: var(--spiel-4-ink);
        --flaeche-paar: var(--gruen); --ink-paar: #FFFFFF;
        --schleier: rgba(32, 32, 34, .55);
      }
      [data-schema="isle"] { --ink-p2: #FFFFFF; }
      .spieler.dran-1, .spieler.dran-2 { background: var(--zeile); }
    }
    body {
      background: var(--grund); color: var(--text);
      font-family: var(--schrift); font-size: 16px; line-height: 1.55;
    }
    h1, h2 { letter-spacing: -0.02em; }
    }
    @layer components {
    .kopf { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }
    .kachel { background: var(--karte); border: 1px solid var(--linie); border-radius: var(--radius-l); }

    /* Knöpfe (DESIGN.md): primär, sekundär, neutral */
    .knopf { border-radius: var(--radius); font-weight: 600; padding: 10px 20px; transition: background .15s, border-color .15s, opacity .15s; }
    .knopf-1 { background: var(--akzent); color: var(--akzent-ink); }
    .knopf-1:hover { background: color-mix(in oklab, var(--akzent) 88%, var(--text)); }
    .knopf-2 { background: var(--akzent-weich); color: var(--akzent-text); }
    .knopf-2:hover { background: color-mix(in oklab, var(--akzent) 24%, var(--karte)); }
    .knopf-n { background: transparent; color: var(--text); border: 1px solid var(--linie); }
    .knopf-n:hover { background: var(--hover); }
    /* Markenzug wie in MyKahoot: Elefant rechts vom Titel, ohne Kachel, als Maske in
       currentColor — so dunkel auf Hell und hell auf Dunkel. Datei aus tools/make-logo.py */
    .logo {
      display: inline-block; height: 1.1em;
      aspect-ratio: 758 / 600; /* = viewBox-Breite/-Höhe, gibt tools/make-logo.py aus */
      background: currentColor;
      -webkit-mask: url("logo-elefant.svg") center / contain no-repeat;
      mask: url("logo-elefant.svg") center / contain no-repeat;
    }

    /* Rand oben, der nach unten ausdünnt (wie Dschungel/Blut in MyKahoot): Hell =
       8-Bit-Pixel, Dunkel = Neuronen-Netz. Jede Farbschicht ist eine Maske aus
       hintergrund/ (tools/make-hintergrund.py), gefüllt mit einem Token des Schemas —
       so macht der Rand jedes Farbschema mit. Hinter allem (z-index −1), fest am Fenster. */
    .rand { position: fixed; inset: 0 0 auto 0; height: 460px; z-index: -1; pointer-events: none; }
    .rand > i { position: absolute; inset: 0; background: var(--c);
      -webkit-mask: var(--m) left top / 1200px auto repeat-x; mask: var(--m) left top / 1200px auto repeat-x; }
    .rand-hell { height: 300px; } /* wie die Pixel-Kacheln, sonst malt der Browser leere 160 px mit */
    .rand-dunkel { display: none;
      background: radial-gradient(ellipse 60% 70% at 50% 0%, color-mix(in srgb, var(--akzent) 16%, transparent), transparent 70%); }
    :root[data-modus="dunkel"] .rand-dunkel { display: block; }
    :root[data-modus="dunkel"] .rand-hell { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-modus="hell"]) .rand-dunkel { display: block; }
      :root:not([data-modus="hell"]) .rand-hell { display: none; }
    }
    /* Was frei auf dem Rand steht (Titel, Untertitel), bekommt einen Hof in der Grundfarbe */
    .frei { text-shadow: 0 0 12px var(--grund), 0 0 5px var(--grund), 0 0 2px var(--grund); }
    .knopf:disabled { opacity: .45; cursor: not-allowed; }
    /* Quadratische Symbolknöpfe, ruhig bis zum Darüberfahren */
    .symbol { flex: none; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius); color: var(--text-2); background: transparent; transition: background .15s, color .15s; }
    .symbol:hover { background: var(--hover); color: var(--text); }
    .symbol.gefahr:hover { color: var(--rot-text); }
    /* Knöpfe, die auf dem Rand stehen: deckende Fläche, sonst scheint er durch. Das
       durchsichtige --hover legt sich beim Darüberfahren als Schleier darüber. */
    .auf-rand { background-color: var(--karte); }
    .auf-rand:hover { background-color: var(--karte); background-image: linear-gradient(var(--hover), var(--hover)); }
    /* Umschalter (Sprache, Darstellung, Schema) */
    .umschalter { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--linie); border-radius: var(--radius); }
    .umschalter button { padding: 4px 12px; border-radius: 7px; color: var(--text-2); font-size: 15px; }
    .umschalter button:hover { background: var(--hover); }
    .umschalter button[aria-pressed="true"] { background: var(--akzent-weich); color: var(--akzent-text); font-weight: 600; }
    .farbtupfer { width: 26px; height: 26px; border-radius: var(--radius-pille); background: var(--tupfer);
      outline-offset: 2px; transition: transform .1s; }
    .farbtupfer:hover { transform: scale(1.12); }
    .farbtupfer[aria-pressed="true"] { outline: 2px solid var(--text); }
    .feld { padding: 8px 12px; border: 1px solid var(--linie); border-radius: var(--radius); background: var(--karte); color: var(--text); }
    .feld:focus { outline: none; border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-weich); }
    .feld::placeholder { color: var(--text-3); }
    .kuerzel { padding: 0 6px; border-radius: var(--radius-s); background: var(--hover); color: var(--text-2);
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    code { background: var(--hover); padding: 0 4px; border-radius: var(--radius-s); }

    /* Kompakte Liste (DESIGN.md, Listen): keine Fläche, nur Hover */
    .liste-zeile { display: flex; align-items: center; gap: 2px; padding: 5px 6px 5px 10px; margin-bottom: 2px;
      border-radius: var(--radius); transition: background .15s; }
    .liste-zeile:hover { background: var(--hover); }
    .liste-name { flex: 0 1 19rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 600; text-align: left; }
    /* Die Zahl kürzt nie, der Name gibt nach — nur auf dem Handy dreht es sich um (s. unten) */
    .liste-zahl { flex: 1 0 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; color: var(--text-3); white-space: nowrap; }
    /* Handy: der Name behält eine Mindestbreite, dafür gibt die Zahl nach, das Sprachkürzel
       entfällt und die Ordner rücken weniger ein — sonst verschwindet der Titel ab Ebene 2 */
    @media (max-width: 640px) {
      .symbol { width: 30px; height: 30px; }
      .liste-name { min-width: 4.5rem; }
      .liste-zahl { flex-shrink: 1; padding: 0 4px; font-size: 14px; }
      .liste-zahl .kuerzel { display: none; }
      .liste-ordner { margin-left: 6px; padding-left: 6px; }
    }
    .liste-ordner { margin-left: 14px; padding-left: 10px; border-left: 2px solid var(--linie); }
    .ablage { border-radius: var(--radius); outline: 2px dashed transparent; outline-offset: -2px; transition: background .15s, outline-color .15s; }
    .ablage.ziel { background: var(--akzent-weich); outline-color: var(--akzent); }

    /* Spielfeld */
    .spieler { background: var(--zeile); border: 2px solid transparent; }
    .spieler.dran-1 { background: var(--flaeche-p1); border-color: var(--farbe-p1); }
    .spieler.dran-2 { background: var(--flaeche-p2); border-color: var(--farbe-p2); }
    .punkt { display: inline-block; width: 10px; height: 10px; border-radius: var(--radius-pille); flex: none; }
    .punkt-1 { background: var(--farbe-p1); }
    .punkt-2 { background: var(--farbe-p2); }
    .karte-ruecken { background: var(--akzent); color: var(--akzent-ink); }
    .karte-ruecken:hover { background: color-mix(in oklab, var(--akzent) 85%, var(--text)); }
    .karte-frage { background: var(--flaeche-p1); color: var(--ink-p1); }
    .karte-antwort { background: var(--flaeche-p2); color: var(--ink-p2); }
    .karte-paar { background: var(--flaeche-paar); color: var(--ink-paar); }
    /* QR-Code: schwarz auf weiss, sonst liest ihn kein Handy — auch im Dunkelmodus */
    .qr { background: #FFFFFF; padding: 8px; border-radius: var(--radius); }
    }

    /* Spielfeld: Spaltenzahl passt sich der Kartenzahl an (immer ALLE Paare der Datei) */
    .board { display: grid; gap: .75rem; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
    @media (max-width: 640px) { .board { grid-template-columns: repeat(var(--cols-sm), minmax(0, 1fr)); gap: .5rem; } }
  </style>
</head>
<body>
  <!-- Rand oben (s. .rand): Farbschichten als Masken, Farben aus dem Schema -->
  <div class="rand rand-hell" aria-hidden="true"></div>
  <div class="rand rand-dunkel" aria-hidden="true"></div>
  <script>
    // Datei i von tools/make-hintergrund.py trägt die i-te Farbe. V nach jedem Lauf des
    // Skripts hochzählen, sonst hängt im Browser-Cache eine alte Schicht neben neuen.
    // Läuft vor dem ersten Zeichnen, nichts blitzt auf.
    (() => {
      const V = 4;
      const schichten = {
        hell: ['pixel', ['--akzent', '--rad-1', '--rad-6', '--spiel-3']],
        dunkel: ['neuro', ['--akzent', '--rad-1', '--rad-2', '--spiel-3', '--rad-5', '--rad-6', '--rad-7']],
      };
      for (const [modus, [name, farben]] of Object.entries(schichten)) {
        document.querySelector('.rand-' + modus).innerHTML = farben
          .map((farbe, i) => `<i style="--c: var(${farbe}); --m: url(hintergrund/${name}-${i}.svg?v=${V})"></i>`).join('');
      }
    })();
  </script>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useSyncExternalStore } = React;

    // ---------- Browser-Speicher ----------
    // Der Browser darf jederzeit nein sagen (privates Fenster, voller Speicher) —
    // dann gilt der Standardwert. Alle Zugriffe laufen über diese zwei Zeilen.
    const readLocal = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch { return fallback; }
    };
    const writeLocal = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    };

    // ---------- Farbschema und Hell/Dunkel (My-Designsystem) ----------
    // Die Werte stehen in design/css/my-schemen.css; hier nur, was zur Wahl
    // steht. Gesetzt wird als data-schema/data-ton/data-modus am <html> — beim
    // Laden schon im <head> (gleiche Schlüssel), damit nichts aufblitzt.
    const LOOK_KEY = 'mymemory_look';
    const MODUS_KEY = 'mymemory_modus';
    const DEFAULT_LOOK = { schema: 'budapest', ton: 3 }; // Aubergine
    const SCHEMES = [
      { id: 'fox', name: 'Fantastic Mr. Fox' },
      { id: 'budapest', name: 'Grand Budapest Hotel' },
      { id: 'moonrise', name: 'Moonrise Kingdom' },
      { id: 'zissou', name: 'The Life Aquatic' },
      { id: 'isle', name: 'Isle of Dogs' },
    ];
    const MODI = ['system', 'hell', 'dunkel'];

    // Die Wahrheit steht am <html> (das Head-Skript hat sie dort gesetzt): so zeigen
    // die Einstellungen immer, was gilt — auch wenn der Browser das Speichern verweigert.
    const currentLook = () => {
      const { schema, ton } = document.documentElement.dataset;
      return { schema, ton: Number(ton) || null };
    };
    const applyLook = (look) => {
      writeLocal(LOOK_KEY, look);
      const html = document.documentElement;
      html.dataset.schema = look.schema;
      if (look.ton) html.dataset.ton = look.ton; else delete html.dataset.ton;
    };
    if (!SCHEMES.some((x) => x.id === currentLook().schema)) applyLook(DEFAULT_LOOK); // unbekannte ID im Speicher
    const currentModus = () => document.documentElement.dataset.modus || 'system';
    const applyModus = (modus) => {
      writeLocal(MODUS_KEY, modus);
      const html = document.documentElement;
      if (modus === 'system') delete html.dataset.modus; else html.dataset.modus = modus;
    };

    // ---------- Sprache (wie in MyKahoot) ----------
    // Umgeschaltet wird nur die Oberfläche, nie der Inhalt: Titel, Paare und die
    // eingebauten Beispiele bleiben, wie sie sind. Die Wahl merkt sich der
    // Browser; `t(key, …args)` liest das Wörterbuch, dynamische Texte sind
    // Funktionen, Texte mit Auszeichnung stehen als JSX drin. Beide Tabellen
    // müssen dieselben Schlüssel haben — ein fehlender bleibt leer.
    const LANGS = [{ id: 'de', name: 'Deutsch' }, { id: 'en', name: 'English' }];
    const LANG_KEY = 'mymemory_lang';
    const loadLang = () => (readLocal(LANG_KEY) === 'en' ? 'en' : 'de');
    // Ein geteilter Link bringt seine Sprache mit (…&l=en): die Klasse sieht
    // damit die Sprache, in der geteilt wurde, ohne selber etwas einstellen zu
    // müssen — umschalten darf sie trotzdem, und das merkt sich ihr Browser.
    const hashParts = () => location.hash.slice(1).split('&');
    // Nur bekannte Sprachen zählen: bei `&l=fr` gilt weiter, was der Browser
    // gemerkt hat, statt stillschweigend auf Deutsch zu fallen.
    const langFromHash = () => {
      const part = hashParts().find((x) => x.startsWith('l=') && LANGS.some((l) => l.id === x.slice(2)));
      return part && part.slice(2);
    };
    let currentLang = langFromHash() || loadLang();
    document.documentElement.lang = currentLang;
    // `t()` liest `currentLang` direkt — React weiss davon nichts. Die App trägt
    // hier einmal ein, wie sie sich neu zeichnen lässt.
    let redrawLang = () => {};

    const code = (x) => <code>{x}</code>;

    const I18N = {
      de: {
        // Auswahlseite
        subtitle: 'Wähle ein Memory und finde die Paare!',
        settings: 'Einstellungen',
        language: 'Sprache',
        look: 'Darstellung',
        modi: { system: 'Wie das System', hell: 'Hell', dunkel: 'Dunkel' },
        scheme: 'Farbschema',
        tone: 'Akzentfarbe',
        toneDefault: 'Akzent des Schemas',
        tones: {
          fox: ['Azid-Himmelblau', 'Dunkles Petrol', 'Moos-Oliv', 'Kürbis', 'Rost-Karmin', 'Schokolade', 'Pflaume', 'Altrosa', 'Bronze-Senf'],
          budapest: ['Indigoblau', 'Lobby-Violett', 'Aubergine', 'Orchidee', 'Magenta', 'Mauve-Taupe', "Mendl's Zuckerrosa", 'Himbeere', 'Messing-Gold'],
          moonrise: ['Oliv-Khaki', 'Limette', 'Gras', 'Tanne', 'Seegrün', 'Petrol', 'Navy', 'Schieferblau', 'Suzy-Rot'],
          zissou: ['Zissou-Rot', 'Orange', 'Gold', 'Oliv', 'Meerblau', 'Tiefsee', 'Rost', 'Mützenrosa', 'Petrol'],
          isle: ['Sand', 'Kaffee', 'Rost', 'Taupe', 'Lavendel', 'Stroh', 'Moos', 'Schiefer', 'Altrosa'],
        },
        createTitle: 'Memory erstellen',
        steps: (
          <>
            <li>Kopiere den KI-Prompt (Button unten) in ein KI-Tool wie <b>Claude</b> oder <b>ChatGPT</b>.</li>
            <li>Fülle dort <b>den Block zuoberst</b> aus: Thema <i>oder</i> Material (PDF/Text anhängen), Klasse, Anzahl Paare, Sprache … Alles darunter unverändert lassen — das ist die Formatvorgabe.</li>
            <li>Du erhältst eine .txt-Datei <i>und</i> denselben Text zum Kopieren (Format {code('F:')} / {code('A:')} / {code('---')}).</li>
            <li>Datei unten in die Ablage-Fläche ziehen — oder den Text ins Feld darunter einfügen.</li>
          </>
        ),
        copyPrompt: 'KI-Prompt kopieren',
        promptCopied: 'KI-Prompt kopiert!',
        dropTitle: 'Datei hierher ziehen',
        dropHint: 'oder klicken zum Auswählen (.txt im F:/A:/---‑Format)',
        orPaste: 'oder Text einfügen',
        pastedTitlePh: 'Titel (z.B. Hauptstädte Europas)',
        pastePh: 'F: Hauptstadt der Schweiz\nA: Bern\n---',
        importText: 'Text importieren',
        importHint: 'Importierte Memories werden in diesem Browser gespeichert. Bewahre die Originaldatei trotzdem auf — leert der Browser seinen Speicher, importierst du sie einfach wieder.',
        myMemories: 'Meine Memories',
        examples: 'Beispiele',
        hideExamples: 'Beispiele ausblenden',
        examplesShown: { an: 'Anzeigen', aus: 'Ausblenden' },
        emptyList: 'Noch nichts da — oben ein Memory erstellen oder eine Datei hierher ziehen.',
        storedHint: 'Gespeichert in diesem Browser. Zum Teilen: Direktlink oder QR-Code — darin steckt das ganze Memory. Memories und Ordner lassen sich per Ziehen umhängen.',
        nPairs: (n) => `${n} ${n === 1 ? 'Paar' : 'Paare'}`,
        nMemories: (n) => `${n} ${n === 1 ? 'Memory' : 'Memories'}`,
        // Knöpfe und Rückmeldungen
        newMemory: 'Neues Memory',
        newMemoryHere: 'Neues Memory in diesem Ordner',
        newFolder: 'Neuer Ordner',
        newSubfolder: 'Unterordner anlegen',
        renameFolder: 'Ordner umbenennen',
        deleteFolder: 'Ordner löschen (nur wenn leer)',
        exportAll: 'Alle Memories als ZIP herunterladen',
        exportOne: 'Als .txt herunterladen',
        copyLink: 'Direktlink kopieren',

    // Aufgebaut wie der Prompt in MyKahoot: zuoberst ein Block zum Ausfüllen,

    // die Anleitung wechselt mit der Oberflächensprache (kiPrompt()). Welche
    // Sprache das Memory selbst hat, gibt der Nutzer im Ausfüll-Block vor.

    const KI_PROMPT_EN = [

      "- Does a back appear twice or nearly identically?",
      "- Are both sides short enough for a card?",
      "- Does the level fit the given class throughout?",
      "- Is every number in math mode, every thousands separator a \\,?",
